[package]
name = "madloop-pole-patch-validation"
version = "0.1.0"
edition = "2024"
[workspace]
[lib]
name = "iregi_rust"
path = "/shared/external/madloop_tirust/madgraph7_madloop_tirust/.tirust-build/pole-development/crates/iregi-rust/src/lib.rs"
[features]
default = []
native-f64-abc = ["iregi-masters/native-f64-abc"]
[dependencies]
iregi-masters = { path = "/shared/external/madloop_tirust/madgraph7_madloop_tirust/.tirust-build/pole-development/crates/iregi-masters" }
madloop-pole-kernels = { path = "/shared/external/madloop_tirust/madgraph7_madloop_tirust/.tirust-build/pole-development/madloop-pole-kernels" }
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr", "native_code_generation", "bincode", "serde", "tracing_max_level_info"] }
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "bd703d09a78f7849a6b86a07096e6f222fc01193", default-features = false, features = ["generated-evaluators", "rust-codegen"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
[dev-dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"
[[test]]
name = "pole_only"
path = "/shared/external/madloop_tirust/madgraph7_madloop_tirust/.tirust-build/pole-development/crates/iregi-rust/tests/pole_only.rs"
[patch.crates-io]
symbolica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "dfe6bd97b974b1028dc63071ea165136cd2b0ef5" }
numerica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "dfe6bd97b974b1028dc63071ea165136cd2b0ef5" }
graphica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "dfe6bd97b974b1028dc63071ea165136cd2b0ef5" }

[patch."https://github.com/alphal00p/oneloopmaster.git"]
oneloop = { path = "/shared/external/madloop_tirust/madgraph7_madloop_tirust/.tirust-build/scalar-poles/oneloopmaster" }

[profile.dev]
opt-level = 2
