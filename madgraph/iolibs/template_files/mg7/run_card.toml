# Documentation: https://docs.madgraph.org/latest/run_card.html
$hidden_groups

[run]
run_name = %(run.run_name)s
seed = %(run.seed)s
device = %(run.device)s
cpu_mode = %(run.cpu_mode)s # SIMD width of the matrix elements on cpu; options: auto, scalar, simd_128, simd_256, simd_512, avx512y
madspace_cpu_mode = %(run.madspace_cpu_mode)s # SIMD width of the phase-space sampling on cpu; options: auto, scalar, simd_128 (ARM), simd_256, avx512y, simd_512
precision = %(run.precision)s # options: all64, all32, color32 (FP32 color sum), denom64 (FP64 momenta and denominators)
precision_check = %(run.precision_check)s # fraction of the events evaluated again in all64 to check the precision; 0: off
validation = %(run.validation)s # FPTYPE to reweight the events to after the run, e.g. d (all64), to check the weights; empty: off
validation_events = %(run.validation_events)s
cpu_thread_pool_size = %(run.cpu_thread_pool_size)s
gpu_thread_pool_size = %(run.gpu_thread_pool_size)s
combine_thread_pool_size = %(run.combine_thread_pool_size)s
use_pigz = %(run.use_pigz)s # gzip the lhe output with pigz; auto: when it is installed
lhe_compression = %(run.lhe_compression)s # auto: on a gpu device when madspace was built with nvCOMP; options: auto, cpu
lhe_gzip_algorithm = %(run.lhe_gzip_algorithm)s # nvCOMP gzip algorithm on gpu: 0 fastest to 5 smallest output
output_format = %(run.output_format)s # options: compact_npy, lhe_npy, lhe
weighted_histograms = %(run.weighted_histograms)s
postprocessing_histograms = %(run.postprocessing_histograms)s
make_plots = %(run.make_plots)s
write_hwu = %(run.write_hwu)s
verbosity = %(run.verbosity)s # options: auto, silent, pretty, log
dummy_matrix_element = %(run.dummy_matrix_element)s
me_frame = %(run.me_frame)s # particles whose momenta define the matrix element frame; []: lab, [1, 2]: partonic c.m.

[beam]
ebeam1 = %(beam.ebeam1)s # in GeV, units accepted; beam 1 moves along +z, events and eta cuts are in this lab frame
ebeam2 = %(beam.ebeam2)s
leptonic = %(beam.leptonic)s
lepton_density = %(beam.lepton_density)s # dressed-lepton density in Source/PDF/lep_densities (ISR, beamstrahlung); empty: none
pdf1 = %(beam.pdf1)s # LHAPDF set; set beam.pdf X sets both beams, a leptonic run has none
pdf2 = %(beam.pdf2)s
fixed_ren_scale = %(beam.fixed_ren_scale)s
fixed_fact_scale = %(beam.fixed_fact_scale)s
ren_scale = %(beam.ren_scale)s
fact_scale1 = %(beam.fact_scale1)s
fact_scale2 = %(beam.fact_scale2)s
dynamical_scale_choice = %(beam.dynamical_scale_choice)s # options: transverse_energy, transverse_mass, half_transverse_mass, partonic_energy, mlm, ckkwl
scale_factor = %(beam.scale_factor)s
max_jet_flavor = %(beam.max_jet_flavor)s # heaviest quark flavour of the MLM jets; more MLM clustering options are in the documentation
min_scale = %(beam.min_scale)s # floor on mu_R and mu_F in GeV (MLM drops the events below it); 0 disables it

[generation]
events = %(generation.events)s
max_overweight_truncation = %(generation.max_overweight_truncation)s
freeze_max_weight_after = %(generation.freeze_max_weight_after)s
cpu_batch_size = %(generation.cpu_batch_size)s
gpu_batch_size = %(generation.gpu_batch_size)s
survey_min_iters = %(generation.survey_min_iters)s
survey_max_iters = %(generation.survey_max_iters)s
survey_target_precision = %(generation.survey_target_precision)s
cut_efficiency_threshold = %(generation.cut_efficiency_threshold)s
max_cut_repetitions = %(generation.max_cut_repetitions)s
interference_helicity = %(generation.interference_helicity)s # helicity of an interference |M|^2; options: exact (as madevent), summed (written as 9)

[systematics]
enable = %(systematics.enable)s
mur = %(systematics.mur)s
muf = %(systematics.muf)s
alps = %(systematics.alps)s
together = %(systematics.together)s
dynamical_scale = %(systematics.dynamical_scale)s
pdf = %(systematics.pdf)s # "errorset", "central", LHAPDF set names or ids, or "<set>@<member>"
write_inputs = %(systematics.write_inputs)s

[phasespace]
mode = %(phasespace.mode)s # multichannel, flat (one channel), both (small channels flat) or auto (both with MadNIS)
merge_subprocesses = %(phasespace.merge_subprocesses)s # share the channels of subprocesses with the same topologies; off for MLM
sde_strategy = %(phasespace.sde_strategy)s # channel weights from the squared diagrams or the denominators; options: diagrams, denominators
t_channel = %(phasespace.t_channel)s # options: propagator, rambo, chili
flat_mode = %(phasespace.flat_mode)s # options: propagator, rambo, chili
combine_channel_threshold = %(phasespace.combine_channel_threshold)s
drop_qcd_s_channel = %(phasespace.drop_qcd_s_channel)s
ew_channel_reduction = %(phasespace.ew_channel_reduction)s # channel count above which off-shell EW boson variants are merged; -1 keeps all
ew_channel_reduction_mode = %(phasespace.ew_channel_reduction_mode)s # options: full, partial, t_channel
channel_reduction_with_vegas = %(phasespace.channel_reduction_with_vegas)s
invariant_power = %(phasespace.invariant_power)s
bw_cutoff = %(phasespace.bw_cutoff)s
cut_decays = %(phasespace.cut_decays)s
xqcut = %(phasespace.xqcut)s # MLM merging cut on the kt of matrix-element jets in GeV (dynamical_scale_choice = "mlm"); 0: off
auto_ptj_mjj = %(phasespace.auto_ptj_mjj)s
# CKKW-L merging with Pythia8: set at most one of ktdurham and ptlund, not together with xqcut
ktdurham = %(phasespace.ktdurham)s
ptlund = %(phasespace.ptlund)s
dparameter = %(phasespace.dparameter)s
merging_pdgs = %(phasespace.merging_pdgs)s
adaptive_symmetry_sampling = %(phasespace.adaptive_symmetry_sampling)s

[madnis]
enable = %(madnis.enable)s
train_batches = %(madnis.train_batches)s
#@group madnis
# normalizing flow
flow_hidden_dim = %(madnis.flow_hidden_dim)s
flow_layers = %(madnis.flow_layers)s
flow_spline_bins = %(madnis.flow_spline_bins)s
flow_activation = %(madnis.flow_activation)s # options: relu, leaky_relu, elu, gelu, sigmoid, softplus
flow_invert_spline = %(madnis.flow_invert_spline)s
# discrete dimensions
discrete_hidden_dim = %(madnis.discrete_hidden_dim)s
discrete_layers = %(madnis.discrete_layers)s
discrete_activation = %(madnis.discrete_activation)s # options: relu, leaky_relu, elu, gelu, sigmoid, softplus
flavor_levels = %(madnis.flavor_levels)s
flavor_prior_floor = %(madnis.flavor_prior_floor)s
flavor_logit_bound = %(madnis.flavor_logit_bound)s
# channel weight network
cwnet_hidden_dim = %(madnis.cwnet_hidden_dim)s
cwnet_layers = %(madnis.cwnet_layers)s
cwnet_activation = %(madnis.cwnet_activation)s # options: relu, leaky_relu, elu, gelu, sigmoid, softplus
nn_float_precision = %(madnis.nn_float_precision)s # precision of all networks; options: float32, float64
# training
log_interval = %(madnis.log_interval)s
batch_size_offset = %(madnis.batch_size_offset)s
batch_size_per_channel = %(madnis.batch_size_per_channel)s
generator_target_size_factor = %(madnis.generator_target_size_factor)s
gpu_generator_batch_granularity = %(madnis.gpu_generator_batch_granularity)s
lr = %(madnis.lr)s
lr_scheduler = %(madnis.lr_scheduler)s # options: none, cosine
adam_beta1 = %(madnis.adam_beta1)s
adam_beta2 = %(madnis.adam_beta2)s
adam_eps = %(madnis.adam_eps)s
adam_weight_decay = %(madnis.adam_weight_decay)s
grad_clip_threshold = %(madnis.grad_clip_threshold)s
buffer_capacity = %(madnis.buffer_capacity)s
minimum_buffer_size = %(madnis.minimum_buffer_size)s
buffered_steps_fraction = %(madnis.buffered_steps_fraction)s
buffer_skip_batches = %(madnis.buffer_skip_batches)s
buffer_unweighting_quantile = %(madnis.buffer_unweighting_quantile)s
uniform_channel_ratio = %(madnis.uniform_channel_ratio)s
integration_history_length = %(madnis.integration_history_length)s
channel_dropping_threshold = %(madnis.channel_dropping_threshold)s
channel_dropping_interval = %(madnis.channel_dropping_interval)s
resonance_guard = %(madnis.resonance_guard)s
drop_zero_integrands = %(madnis.drop_zero_integrands)s
fixed_cwnet_fraction = %(madnis.fixed_cwnet_fraction)s
softclip_threshold = %(madnis.softclip_threshold)s
compressed_channel_weight_count = %(madnis.compressed_channel_weight_count)s
#@end

[multiparticles]
$multiparticles

[cuts]
# <group>[-<group>]-<observable>.min / .max
# groups: jet, bottom, lepton, missing, photon (see [multiparticles])
# observables: pt, eta_abs, delta_r, mass, pair_mass, sfos_pair_mass, sqrt_s
$cuts

[histograms]
# <observable>.min, .max and .bin_count; "jet_1-pt" selects the hardest jet
# "weight" histograms the event weight over the unit weight sigma_abs
$histograms

#@group amplicol
[amplicol]
color_accuracy = %(amplicol.color_accuracy)s
mode = %(amplicol.mode)s
first_pass_max_overweight_truncation = %(amplicol.first_pass_max_overweight_truncation)s
first_pass_freeze_max_weight_after = %(amplicol.first_pass_freeze_max_weight_after)s
prior_partner_share = %(amplicol.prior_partner_share)s
lc_flavors = %(amplicol.lc_flavors)s # options: all, two_lines_resample (others switched in the full-colour pass), two_lines (others dropped)
#@end

#@group gridpack
[gridpack]
save_gridpack = %(gridpack.save_gridpack)s
include_source = %(gridpack.include_source)s
include_madspace = %(gridpack.include_madspace)s
include_madspace_source = %(gridpack.include_madspace_source)s
include_madtrex = %(gridpack.include_madtrex)s
include_madtrex_source = %(gridpack.include_madtrex_source)s
compress = %(gridpack.compress)s
run_mode = %(gridpack.run_mode)s # options: regular, minimal (no events), fix_max_weight (no events, adds bin/event_stream.py)
temp_output_dir = %(gridpack.temp_output_dir)s
output_dir = %(gridpack.output_dir)s
#@end

#@group cluster
[cluster]
enable = %(cluster.enable)s # train the subprocesses and generate the events in batch jobs
mode = %(cluster.mode)s # options: full (both passes, events combined), gridpack_only
type = %(cluster.type)s # auto (cluster_type of the configuration), local_parallel, condor, slurm, pbs, sge, lsf, ...
parallel_jobs = %(cluster.parallel_jobs)s
train_queue = %(cluster.train_queue)s
train_walltime = %(cluster.train_walltime)s
train_extra_args = %(cluster.train_extra_args)s # e.g. "--gres=gpu:1" for slurm, "request_gpus = 1" for condor
subprocesses_per_job = %(cluster.subprocesses_per_job)s
fix_max_weight = %(cluster.fix_max_weight)s # true: max weights of the training jobs (correct); false: estimated by each generation job
deploy_queue = %(cluster.deploy_queue)s
deploy_walltime = %(cluster.deploy_walltime)s
deploy_extra_args = %(cluster.deploy_extra_args)s
events_per_job = %(cluster.events_per_job)s

[cluster_train]
# [run], [generation] or [madnis] settings of the training jobs, e.g. run.device = ["cuda"]
$cluster_train

[cluster_deploy]
# the same for the event generation jobs, e.g. run.cpu_thread_pool_size = 8
$cluster_deploy
#@end

#@group postprocessing
[postprocessing]
time_of_flight = %(postprocessing.time_of_flight)s
#@end

#@group vegas
[vegas]
enable = %(vegas.enable)s
bins = %(vegas.bins)s
damping = %(vegas.damping)s
optimization_patience = %(vegas.optimization_patience)s
optimization_threshold = %(vegas.optimization_threshold)s
start_batch_size = %(vegas.start_batch_size)s
max_batch_size = %(vegas.max_batch_size)s
#@end

#@group custom_functions
[custom_functions]
# functions created with bin/init_custom_func, a .so or .py path relative to the process directory; "": off
cut = %(custom_functions.cut)s
scale = %(custom_functions.scale)s
pdf = %(custom_functions.pdf)s
bias = %(custom_functions.bias)s # events are generated with |w| b and written with w / b
$custom_function_parameters
#@end

#@group surrogate
[surrogate]
function = %(surrogate.function)s # .so (may contain {subprocess}, {device}) or .py defining custom_surrogate; "": off
mode = %(surrogate.mode)s
first_pass_max_overweight_truncation = %(surrogate.first_pass_max_overweight_truncation)s
first_pass_freeze_max_weight_after = %(surrogate.first_pass_freeze_max_weight_after)s
param_card = %(surrogate.param_card)s
#@end
