---
title: Shapes, etc.

stack:
  inputs: any
  outputs:
    - name: out
      desc: Combined tensor with shape (b, n, *) given n inputs with shape (b, *).
  desc: >
    Combines input tensors by adding another dimension after the batch dimension.
  class: StackInstruction
  custom_op: True
  differentiable: True

unstack:
  inputs:
    - name: in1
      desc: "tensor with shape (batch, n, *)"
  outputs: any
  desc: "Splits a tensor along the dimension after the batch dimension into a list of tensors."
  class: UnstackInstruction
  custom_op: True
  differentiable: True

stack_sizes:
  inputs: any
  outputs:
    - name: sizes
      desc: "combined batch-size list, one entry per input"
  desc: "Combines several single-entry batch-size lists into one list, one entry per input."
  class: StackSizesInstruction
  custom_op: True

unstack_sizes:
  inputs:
    - name: in1
      desc: "batch-size list"
  outputs: any
  desc: "Splits a batch-size list into its individual batch sizes."
  class: UnstackSizesInstruction
  custom_op: True

pop:
  inputs:
    - name: in1
      type: [float, n, ...]
      desc: "tensor with shape (batch, n, ...)"
  outputs:
    - name: rest
      type: [float, n-1, ...]
      desc: "the first n-1 slices"
    - name: item
      type: [float, ...]
      desc: "the last slice"
  custom_op: True
  differentiable: True
  desc: "Splits off the last slice along the dimension after the batch dimension."

batch_cat:
  inputs: any
  outputs:
    - name: out
      desc: "concatenation, with batch size the sum of the inputs'"
    - name: counts
      desc: "batch-size list giving each input's batch size"
  desc: "Concatenates several tensors along the batch dimension."
  class: BatchCatInstruction
  custom_op: True
  differentiable: True

batch_split:
  inputs:
    - name: in1
      desc: "tensor to split, with a batch dimension"
    - name: counts
      desc: "batch-size list giving the size of each output slice"
  outputs: any
  desc: "Splits a tensor along the batch dimension according to a batch-size list."
  class: BatchSplitInstruction
  custom_op: True
  differentiable: True

cat:
  inputs: any
  outputs:
    - name: out
      desc: "concatenation along the dimension after the batch dimension"
  desc: "Concatenates several tensors along the dimension after the batch dimension."
  class: CatInstruction
  custom_op: True
  differentiable: True

batch_size:
  inputs: any
  outputs:
    - name: batch_size
      desc: "batch-size list with the shared batch size"
  class: BatchSizeInstruction
  custom_op: True
  desc: "Returns the common batch size of its arguments as a single-entry batch-size list."

offset_indices:
  inputs:
    - name: batch_sizes_offset
      desc: "batch-size list of the offsets to add"
    - name: batch_sizes_out
      desc: "batch-size list of the output layout"
  outputs:
    - name: offsets
      desc: "integer offset per output element"
  class: OffsetIndicesInstruction
  custom_op: True
  desc: "Builds an integer tensor of total length sum(batch_sizes_out). Entries of group k hold the sum of the first k entries of batch_sizes_offset."

full:
  inputs: any
  outputs:
    - name: output
      desc: "tensor filled with the constant value"
  class: FullInstruction
  custom_op: True
  desc: "Creates a tensor of the given batch size and shape filled with a constant."

squeeze:
  inputs:
    - name: input
      desc: "tensor with shape (batch, 1, ...)"
  outputs:
    - name: output
      desc: "tensor with shape (batch, ...)"
  class: SqueezeInstruction
  custom_op: True
  differentiable: True
  desc: "Removes the dimension after the batch dimension by taking its first entry (normally of size 1)."

unsqueeze:
  inputs:
    - name: input
      desc: "input tensor"
  outputs:
    - name: output
      desc: "tensor with an added size-1 dimension after the batch dimension"
  class: UnsqueezeInstruction
  custom_op: True
  differentiable: True
  desc: "Inserts a size-1 dimension after the batch dimension."

accept_norm:
  inputs:
    - name: accepted_batch
      desc: "the accepted events"
    - name: full_batch
      desc: "the full batch before acceptance"
  outputs:
    - name: norm
      desc: "ratio of full to accepted batch size"
  class: AcceptNormInstruction
  custom_op: True
  desc: "Ratio of the full batch size to the accepted batch size, as a float scalar."

batch_split_by_index:
  inputs:
    - name: indices
      type: [int]
      desc: "per-event sub-batch index"
    - name: count
      type: [int, single]
      desc: "number of sub-batches"
  outputs: any
  class: BatchSplitByIndexInstruction
  custom_op: True
  desc: "Splits a batch by a per-event integer index into that many sub-batches."

batch_merge_by_index:
  inputs: any
  outputs:
    - name: output
      desc: "the merged batch"
  class: BatchMergeByIndexInstruction
  custom_op: True
  desc: "Inverse of `batch_split_by_index`: merges indexed sub-batches back into one batch."

---
title: Math

add:
  inputs:
    - name: in1
      type: [float, ...]
      desc: first input to addition
    - name: in2
      type: [float, ...]
      desc: second input to addition
  outputs:
    - name: out
      type: [float, ...]
      desc: sum of the two inputs
  desc: Computes the sum of the two inputs.
  differentiable: True
  dims: 0

add_int:
  inputs:
    - name: in1
      type: [int, ...]
      desc: first input to addition
    - name: in2
      type: [int, ...]
      desc: second input to addition
  outputs:
    - name: out
      type: [int, ...]
      desc: sum of the two inputs
  desc: Computes the sum of the two inputs.
  dims: 0

sub:
  inputs:
    - name: in1
      type: [float, ...]
      desc: first input to subtraction
    - name: in2
      type: [float, ...]
      desc: second input to subtraction
  outputs:
    - name: out
      type: [float, ...]
      desc: difference of the two inputs
  desc: Computes the difference of the two inputs.
  differentiable: True
  dims: 0

mul:
  precision: [float32, float64]
  inputs:
    - name: in1
      type: [float, ...]
      desc: first input to multiplication
    - name: in2
      type: [float, ...]
      desc: second input to multiplication
  outputs:
    - name: out
      type: [float, ...]
      desc: product of the two inputs
  desc: Computes the product of the two inputs.
  differentiable: True
  dims: 0

div:
  inputs:
    - name: in1
      type: [float, ...]
      desc: first input to division
    - name: in2
      type: [float, ...]
      desc: second input to division
  outputs:
    - name: out
      type: [float, ...]
      desc: quotient of the two inputs
  desc: Computes the quotient of the two inputs.
  differentiable: True
  dims: 0

reduce_sum:
  inputs:
    - name: in1
      type: [float, ..., n]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "sum over the last dimension"
  dims: 0
  desc: "Sums a tensor over its last dimension."

reduce_sum_vector:
  inputs:
    - name: in1
      type: [float, ..., n, m]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ..., m]
      desc: "sum over the second-to-last dimension"
  dims: 0
  desc: "Sums a tensor over its second-to-last dimension."

batch_reduce_sum:
  inputs:
    - name: in1
      type: [float]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, single]
      desc: "sum over the batch"
  differentiable: True
  custom_op: True
  desc: "Sums a tensor over the batch dimension."

batch_reduce_mean:
  inputs:
    - name: in1
      type: [float]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, single]
      desc: "mean over the batch"
  differentiable: True
  custom_op: True
  desc: "Averages a tensor over the batch dimension."

batch_reduce_mean_keepdim:
  inputs:
    - name: in1
      type: [float]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float]
      desc: "batch mean, broadcast back over the batch dimension"
  differentiable: True
  custom_op: True
  desc: "Averages a tensor over the batch dimension, keeping that dimension with the mean broadcast across it."

reduce_product:
  inputs:
    - name: in1
      type: [float, n]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float]
      desc: "product over the last dimension"
  differentiable: True
  desc: "Multiplies the entries of a tensor along its last dimension."

sqrt:
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "square root of the input"
  differentiable: True
  dims: 0
  desc: "Element-wise square root."

square:
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "square of the input"
  differentiable: True
  dims: 0
  desc: "Element-wise square."

min:
  inputs:
    - name: in1
      type: [float, ...]
      desc: "first input"
    - name: in2
      type: [float, ...]
      desc: "second input"
  outputs:
    - name: out
      type: [float, ...]
      desc: "element-wise minimum"
  desc: "Element-wise minimum of two tensors."
  dims: 0

max:
  inputs:
    - name: in1
      type: [float, ...]
      desc: "first input"
    - name: in2
      type: [float, ...]
      desc: "second input"
  outputs:
    - name: out
      type: [float, ...]
      desc: "element-wise maximum"
  desc: "Element-wise maximum of two tensors."
  dims: 0

abs:
  inputs:
    - name: input
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "absolute value of the input"
  dims: 0
  desc: "Element-wise absolute value."

---
title: Observables

obs_sqrt_s:
  inputs:
    - name: p_ext
      type: [float, n, 4]
      desc: "external four-momenta"
  outputs:
    - name: obs
      type: [float]
      desc: "center-of-mass energy"
  desc: "Invariant mass of the sum of the first two external momenta (the incoming particles). See @ref Observable."

obs_e:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "energy"
  dims: 0
  desc: "Energy component of a four-momentum. See @ref Observable."

obs_px:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "momentum x component"
  dims: 0
  desc: "x component of a four-momentum. See @ref Observable."

obs_py:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "momentum y component"
  dims: 0
  desc: "y component of a four-momentum. See @ref Observable."

obs_pz:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "momentum z component"
  dims: 0
  desc: "z component of a four-momentum. See @ref Observable."

obs_mass:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "invariant mass"
  dims: 0
  desc: "Invariant mass of a four-momentum. See @ref Observable."

obs_pt:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "transverse momentum"
  dims: 0
  desc: "Transverse momentum of a four-momentum. See @ref Observable."

obs_p_mag:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "spatial momentum magnitude"
  dims: 0
  desc: "Magnitude of the spatial momentum. See @ref Observable."

obs_phi:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "azimuthal angle"
  dims: 0
  desc: "Azimuthal angle of a four-momentum. See @ref Observable."

obs_theta:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "polar angle in [0, pi]"
  dims: 0
  desc: "Polar angle of a four-momentum. See @ref Observable."

obs_y:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "rapidity"
  dims: 0
  desc: "Rapidity of a four-momentum. See @ref Observable."

obs_y_abs:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "absolute rapidity"
  dims: 0
  desc: "Absolute rapidity of a four-momentum. See @ref Observable."

obs_eta:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "pseudorapidity"
  dims: 0
  desc: "Pseudorapidity of a four-momentum; 99 if the momentum is (nearly) zero. See @ref Observable."

obs_eta_abs:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "absolute pseudorapidity"
  dims: 0
  desc: "Absolute pseudorapidity of a four-momentum; 99 if the momentum is (nearly) zero. See @ref Observable."

obs_delta_eta:
  inputs:
    - name: p1
      type: [float, ..., 4]
      desc: "first four-momentum"
    - name: p2
      type: [float, ..., 4]
      desc: "second four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "pseudorapidity difference"
  dims: 0
  desc: "Signed pseudorapidity difference eta(p1) - eta(p2). See @ref Observable."

obs_delta_phi:
  inputs:
    - name: p1
      type: [float, ..., 4]
      desc: "first four-momentum"
    - name: p2
      type: [float, ..., 4]
      desc: "second four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "azimuthal angle difference"
  dims: 0
  desc: "Azimuthal angle difference phi(p1) - phi(p2), wrapped to [-pi, pi). See @ref Observable."

obs_delta_r:
  inputs:
    - name: p1
      type: [float, ..., 4]
      desc: "first four-momentum"
    - name: p2
      type: [float, ..., 4]
      desc: "second four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "delta-R separation"
  dims: 0
  desc: "Angular separation in the eta-phi plane between two four-momenta. See @ref Observable."

obs_pair_mass:
  inputs:
    - name: p1
      type: [float, ..., 4]
      desc: "first four-momentum"
    - name: p2
      type: [float, ..., 4]
      desc: "second four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "invariant mass of the pair"
  dims: 0
  desc: "Invariant mass of the two-particle system. See @ref Observable."

---
title: Kinematics

boost_beam:
  inputs:
    - name: p1
      type: [float, n, 4]
      desc: "momenta in the partonic center-of-mass frame"
    - name: masses
      type: [float, single, n]
      desc: "mass of each particle, or a negative value to read it off its momentum"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "momenta in the lab frame"
  desc: "Boosts momenta from the partonic center-of-mass frame to the lab frame given the momentum fractions. See @ref Luminosity."

boost_beam_inverse:
  inputs:
    - name: p1
      type: [float, n, 4]
      desc: "momenta in the lab frame"
    - name: masses
      type: [float, single, n]
      desc: "mass of each particle, or a negative value to read it off its momentum"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "momenta in the partonic center-of-mass frame"
  desc: "Inverse of `boost_beam`: boosts lab-frame momenta back to the partonic center-of-mass frame."

com_p_in:
  inputs:
    - name: e_cm
      type: [float]
      desc: "center-of-mass energy"
  outputs:
    - name: p1
      type: [float, 4]
      desc: "incoming momentum along +z"
    - name: p2
      type: [float, 4]
      desc: "incoming momentum along -z"
  desc: "Builds the two incoming momenta for a given center-of-mass energy."

r_to_x1x2:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: s_hat
      type: [float]
      desc: "partonic invariant mass squared"
    - name: s_lab
      type: [float, single]
      desc: "hadronic invariant mass squared"
  outputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Maps a random number to the beam momentum fractions at fixed partonic energy. See @ref Luminosity."

x1x2_to_r:
  inputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: s_lab
      type: [float, single]
      desc: "hadronic invariant mass squared"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Inverse of `r_to_x1x2`: maps beam momentum fractions back to the random number. See @ref Luminosity."

r_to_x1x2_window:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: s_hat
      type: [float]
      desc: "partonic invariant mass squared"
    - name: s_lab
      type: [float, single]
      desc: "hadronic invariant mass squared"
    - name: y_max
      type: [float, single]
      desc: "largest allowed absolute rapidity of the partonic system"
  outputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "`r_to_x1x2` with the rapidity log(x1/x2)/2 of the partonic system restricted to |y| <= y_max. See @ref PhaseSpaceMapping."

x1x2_to_r_window:
  inputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: s_lab
      type: [float, single]
      desc: "hadronic invariant mass squared"
    - name: y_max
      type: [float, single]
      desc: "largest allowed absolute rapidity of the partonic system"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Inverse of `r_to_x1x2_window`. See @ref PhaseSpaceMapping."

lepton_x_sample:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: x_min
      type: [float]
      desc: "lower end of the momentum fraction"
    - name: beta
      type: [float, single]
      desc: "exponent of the sampling, (1 - x)^(beta - 1)"
  outputs:
    - name: x
      type: [float]
      desc: "momentum fraction of the beam"
    - name: one_minus_x
      type: [float]
      desc: "1 - x, exact close to x = 1"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Maps a random number to the momentum fraction of a lepton beam as generate_x_ee of genps_fks.f, 1 - x = (1 - x_min) r^(1 / (1 - beta)). See @ref LeptonLuminosity."

lepton_x_sample_inverse:
  inputs:
    - name: one_minus_x
      type: [float]
      desc: "1 - x of the momentum fraction of the beam"
    - name: x_min
      type: [float]
      desc: "lower end of the momentum fraction"
    - name: beta
      type: [float, single]
      desc: "exponent of the sampling, (1 - x)^(beta - 1)"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Inverse of lepton_x_sample. See @ref LeptonLuminosity."

diff_cross_section:
  inputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: pdf1
      type: [float]
      desc: "PDF value for beam 1"
    - name: pdf2
      type: [float]
      desc: "PDF value for beam 2"
    - name: matrix_element
      type: [float]
      desc: "matrix element value"
    - name: e_cm2
      type: [float, single]
      desc: "squared center-of-mass energy"
  outputs:
    - name: result
      type: [float]
      desc: "differential cross section"
  desc: "Differential cross section in pb: matrix_element * pdf1 * pdf2 / (2 e_cm2 x1^2 x2^2), with the unit conversion from GeV^-2. See @ref DifferentialCrossSection."

two_body_decay_com:
  inputs:
    - name: r_phi
      type: [float]
      desc: "random number for the azimuthal angle"
    - name: r_cos_theta
      type: [float]
      desc: "random number for the polar angle"
    - name: m0
      type: [float]
      desc: "mass of the decaying particle"
    - name: m1
      type: [float]
      desc: "mass of the first decay product"
    - name: m2
      type: [float]
      desc: "mass of the second decay product"
  outputs:
    - name: p1
      type: [float, 4]
      desc: "first decay product momentum"
    - name: p2
      type: [float, 4]
      desc: "second decay product momentum"
    - name: det
      type: [float]
      desc: "Jacobian of the decay mapping"
  desc: "Two-body decay in the rest frame of the decaying particle. Building block of @ref TwoBodyDecay."

two_body_decay_com_inverse:
  inputs:
    - name: p1
      type: [float, 4]
      desc: "first decay product momentum"
    - name: p2
      type: [float, 4]
      desc: "second decay product momentum"
  outputs:
    - name: r_phi
      type: [float]
      desc: "random number for the azimuthal angle"
    - name: r_cos_theta
      type: [float]
      desc: "random number for the polar angle"
    - name: m0
      type: [float]
      desc: "mass of the decaying particle"
    - name: m1
      type: [float]
      desc: "mass of the first decay product"
    - name: m2
      type: [float]
