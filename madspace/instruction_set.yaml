    - name: gs
      type: [float]
      desc: "Jacobian ds/dr"
  desc: "Samples a propagator invariant with a (s - m^2 + 0.01)^-nu density, the pole shifted slightly below m^2. Building block of @ref Invariant."

stable_invariant_nu_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: mass
      type: [float, single]
      desc: "pole mass"
    - name: nu
      type: [float, single]
      desc: "exponent of the power law"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: gs
      type: [float]
      desc: "Jacobian dr/ds"
  desc: "Inverse of `stable_invariant_nu`. Building block of @ref Invariant."

