      desc: "lower bound of |t2|"
    - name: t2_max
      type: [float]
      desc: "upper bound of |t2|"
    - name: pa
      type: [float, 4]
      desc: "first incoming momentum (a beam, in the partonic centre-of-mass frame)"
    - name: pb
      type: [float, 4]
      desc: "second incoming momentum (the other beam)"
    - name: m1
      type: [float]
      desc: "mass of the single outgoing particle p1"
    - name: t1_abs
      type: [float]
      desc: "the sampled |t1| = -(pa - p1)^2"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: beam_sign
      type: [float, single]
