    - name: s23_max
      type: [float]
      desc: "upper limit of the 2-3 invariant mass squared"
  desc: "Kinematic limits of the 2-3 invariant mass squared. Building block of @ref TwoToThreeParticleScattering."

s23_value_and_min_max:
  inputs:
    - name: pa
      type: [float, 4]
      desc: "first incoming momentum"
    - name: p3
      type: [float, 4]
