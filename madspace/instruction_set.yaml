    - name: etmin_i
      type: [float]
      desc: "minimum transverse energy of particle i"
    - name: etmin_ir
      type: [float]
      desc: "minimum transverse energy of the i-r system"
  outputs:
    - name: t_abs
      type: [float]
      desc: "absolute value of the first momentum transfer"
    - name: t_min
      type: [float]
      desc: "lower limit of the first momentum transfer"
    - name: t_max
      type: [float]
      desc: "upper limit of the first momentum transfer"
  desc: "First momentum transfer and its limits in a double-t configuration. Building block of @ref DoubleT."

t2_inv_min_max_doublet:
  inputs:
    - name: pa
      type: [float, 4]
      desc: "first incoming momentum"
    - name: pb
      type: [float, 4]
      desc: "second incoming momentum"
    - name: m1
      type: [float]
