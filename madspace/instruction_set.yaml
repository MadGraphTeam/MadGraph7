      desc: "narrowed upper bound of |t2|"
  desc: "Narrows |t2| of the double-t central block, at fixed |t1|, to the values for which both outgoing momenta can satisfy their rapidity bounds. Building block of @ref DoubleT."

t_inv_value_and_min_max_cut:
