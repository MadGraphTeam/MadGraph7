title: Cuts

cut_unphysical:
  inputs:
    - name: w_in
      type: [float]
      desc: "incoming weight"
    - name: p
      type: [float, n, 4]
      desc: "final-state momenta"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  outputs:
    - name: w_out
      type: [float]
      desc: "weight, set to zero for unphysical events"
  desc: "Zeroes the weight of events with NaN weight or momenta, or with a momentum fraction outside [0, 1]. See @ref Cuts."

cut_one:
  inputs:
    - name: obs
      type: [float]
      desc: "observable value"
    - name: min
      type: [float, single]
      desc: "lower bound"
    - name: max
      type: [float, single]
      desc: "upper bound"
  outputs:
    - name: w
      type: [float]
      desc: "1 if the observable is inside [min, max], 0 otherwise"
  desc: "Cut indicator for a single observable: 1 inside the window, 0 outside. See @ref Cuts."

cut_all:
  inputs:
    - name: obs
      type: [float, n]
      desc: "observable values"
    - name: min
      type: [float, single]
      desc: "lower bound applied to each observable"
    - name: max
      type: [float, single]
      desc: "upper bound applied to each observable"
  outputs:
    - name: w
      type: [float]
      desc: "1 if all observables are in [min, max], 0 otherwise"
  desc: "Cut indicator: 1 only if every observable in the vector is inside the window, 0 otherwise. See @ref Cuts."

cut_any:
  inputs:
    - name: obs
      type: [float, n]
      desc: "observable values"
    - name: min
      type: [float, single]
      desc: "lower bound applied to each observable"
    - name: max
      type: [float, single]
      desc: "upper bound applied to each observable"
  outputs:
    - name: w
      type: [float]
      desc: "1 if at least one observable is in [min, max], 0 otherwise"
  desc: "Cut indicator: 1 if at least one observable in the vector is inside the window, 0 otherwise. See @ref Cuts."

