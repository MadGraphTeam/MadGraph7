    - name: t_max
      type: [float]
      desc: "upper limit of the second momentum transfer"
  desc: "Limits of the second momentum transfer in a double-t configuration. Building block of @ref DoubleT."

t2_inv_value_and_min_max_doublet:
  inputs:
    - name: pa
      type: [float, 4]
      desc: "first incoming momentum"
    - name: pb
      type: [float, 4]
      desc: "second incoming momentum"
    - name: p1
      type: [float, 4]
      desc: "outgoing momentum"
