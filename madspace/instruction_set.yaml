---
title: Kinematics

boost_beam:
  inputs:
    - name: p1
      type: [float, n, 4]
      desc: "momenta in the partonic center-of-mass frame"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "momenta in the lab frame"
  desc: "Boosts momenta from the partonic center-of-mass frame to the lab frame given the momentum fractions. See @ref Luminosity."

boost_beam_inverse:
  inputs:
    - name: p1
      type: [float, n, 4]
      desc: "momenta in the lab frame"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "momenta in the partonic center-of-mass frame"
  desc: "Inverse of `boost_beam`: boosts lab-frame momenta back to the partonic center-of-mass frame."

com_p_in:
  inputs:
    - name: e_cm
      type: [float]
      desc: "center-of-mass energy"
  outputs:
    - name: p1
      type: [float, 4]
      desc: "incoming momentum along +z"
    - name: p2
      type: [float, 4]
      desc: "incoming momentum along -z"
  desc: "Builds the two incoming momenta for a given center-of-mass energy."

r_to_x1x2:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: s_hat
      type: [float]
      desc: "partonic invariant mass squared"
    - name: s_lab
      type: [float]
      desc: "hadronic invariant mass squared"
  outputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Maps a random number to the beam momentum fractions at fixed partonic energy. See @ref Luminosity."

x1x2_to_r:
  inputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: s_lab
      type: [float]
      desc: "hadronic invariant mass squared"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Inverse of `r_to_x1x2`: maps beam momentum fractions back to the random number. See @ref Luminosity."

diff_cross_section:
  inputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: pdf1
      type: [float]
      desc: "PDF value for beam 1"
    - name: pdf2
      type: [float]
      desc: "PDF value for beam 2"
    - name: matrix_element
      type: [float]
      desc: "matrix element value"
    - name: e_cm2
      type: [float]
      desc: "squared center-of-mass energy"
  outputs:
    - name: result
      type: [float]
      desc: "differential cross section"
  desc: "Assembles the differential cross section from PDFs, the matrix element and the flux factor. See @ref DifferentialCrossSection."

two_body_decay_com:
  inputs:
    - name: r_phi
      type: [float]
      desc: "random number for the azimuthal angle"
    - name: r_cos_theta
      type: [float]
      desc: "random number for the polar angle"
    - name: m0
      type: [float]
      desc: "mass of the decaying particle"
    - name: m1
      type: [float]
      desc: "mass of the first decay product"
    - name: m2
      type: [float]
      desc: "mass of the second decay product"
  outputs:
    - name: p1
      type: [float, 4]
      desc: "first decay product momentum"
    - name: p2
      type: [float, 4]
      desc: "second decay product momentum"
    - name: det
      type: [float]
      desc: "Jacobian of the decay mapping"
  desc: "Two-body decay in the rest frame of the decaying particle. Building block of @ref TwoBodyDecay."

two_body_decay_com_inverse:
  inputs:
    - name: p1
      type: [float, 4]
      desc: "first decay product momentum"
    - name: p2
      type: [float, 4]
      desc: "second decay product momentum"
  outputs:
    - name: r_phi
      type: [float]
      desc: "random number for the azimuthal angle"
    - name: r_cos_theta
      type: [float]
      desc: "random number for the polar angle"
    - name: m0
      type: [float]
      desc: "mass of the decaying particle"
    - name: m1
      type: [float]
      desc: "mass of the first decay product"
    - name: m2
      type: [float]
      desc: "mass of the second decay product"
    - name: det
      type: [float]
      desc: "Jacobian of the decay mapping"
  desc: "Inverse of `two_body_decay_com`. Building block of @ref TwoBodyDecay."

two_body_decay:
  inputs:
    - name: r_phi
      type: [float]
      desc: "random number for the azimuthal angle"
    - name: r_cos_theta
      type: [float]
      desc: "random number for the polar angle"
    - name: m0
      type: [float]
      desc: "mass of the decaying particle"
    - name: m1
      type: [float]
      desc: "mass of the first decay product"
    - name: m2
      type: [float]
      desc: "mass of the second decay product"
    - name: p0
      type: [float, 4]
      desc: "momentum of the decaying particle"
  outputs:
    - name: p1
      type: [float, 4]
      desc: "first decay product momentum"
    - name: p2
      type: [float, 4]
      desc: "second decay product momentum"
    - name: det
      type: [float]
      desc: "Jacobian of the decay mapping"
  desc: "Two-body decay of a particle with given momentum. Building block of @ref TwoBodyDecay."

two_body_decay_inverse:
  inputs:
    - name: p1
      type: [float, 4]
      desc: "first decay product momentum"
    - name: p2
      type: [float, 4]
      desc: "second decay product momentum"
  outputs:
    - name: r_phi
      type: [float]
      desc: "random number for the azimuthal angle"
    - name: r_cos_theta
      type: [float]
      desc: "random number for the polar angle"
    - name: m0
      type: [float]
      desc: "mass of the decaying particle"
    - name: m1
      type: [float]
      desc: "mass of the first decay product"
    - name: m2
      type: [float]
      desc: "mass of the second decay product"
    - name: p0
      type: [float, 4]
      desc: "momentum of the decaying particle"
    - name: det
      type: [float]
      desc: "Jacobian of the decay mapping"
  desc: "Inverse of `two_body_decay`. Building block of @ref TwoBodyDecay."

two_to_two_particle_scattering_com:
  inputs:
    - name: r_phi
      type: [float]
      desc: "random number for the azimuthal angle"
    - name: pa
      type: [float, 4]
      desc: "first incoming momentum"
    - name: pb
      type: [float, 4]
      desc: "second incoming momentum"
    - name: t_abs
      type: [float]
      desc: "absolute value of the Mandelstam t"
    - name: m1
      type: [float]
      desc: "mass of the first outgoing particle"
    - name: m2
      type: [float]
      desc: "mass of the second outgoing particle"
  outputs:
    - name: p1
      type: [float, 4]
      desc: "first outgoing momentum"
    - name: p2
      type: [float, 4]
      desc: "second outgoing momentum"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "2 to 2 scattering in the center-of-mass frame at fixed momentum transfer. Building block of @ref TwoToTwoParticleScattering."

two_to_two_particle_scattering_com_inverse:
  inputs:
    - name: p1
      type: [float, 4]
      desc: "first outgoing momentum"
    - name: p2
      type: [float, 4]
      desc: "second outgoing momentum"
    - name: pa
      type: [float, 4]
      desc: "first incoming momentum"
    - name: pb
      type: [float, 4]
      desc: "second incoming momentum"
  outputs:
    - name: r_phi
      type: [float]
      desc: "random number for the azimuthal angle"
    - name: m1
      type: [float]
      desc: "mass of the first outgoing particle"
    - name: m2
      type: [float]
      desc: "mass of the second outgoing particle"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Inverse of `two_to_two_particle_scattering_com`. Building block of @ref TwoToTwoParticleScattering."

two_to_two_particle_scattering:
  inputs:
    - name: r_phi
