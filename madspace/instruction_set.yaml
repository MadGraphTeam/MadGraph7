    - name: s23_max
      type: [float]
      desc: "upper limit of the 2-3 invariant mass squared"
  desc: "The 2-3 invariant mass squared and its limits for a given final state. Building block of @ref TwoToThreeParticleScattering."

s23_min_max_cut:
  inputs:
    - name: pa
      type: [float, 4]
      desc: "first incoming momentum"
    - name: p12
      type: [float, 4]
      desc: "momentum of the system of the first and second outgoing particles"
    - name: p3
      type: [float, 4]
      desc: "momentum of the third particle"
    - name: t1_abs
      type: [float]
      desc: "absolute value of the first momentum transfer"
    - name: m1
      type: [float]
      desc: "mass of the first outgoing particle"
    - name: m2
      type: [float]
      desc: "mass of the second outgoing particle"
    - name: etmin_1
      type: [float]
      desc: "minimum transverse energy of the first outgoing particle"
    - name: etmin_2
      type: [float]
      desc: "minimum transverse energy of the second outgoing particle"
    - name: drcut
      type: [float]
      desc: "minimum angular separation between the outgoing particles"
    - name: s23_min_cut
      type: [float]
      desc: "explicit lower cut on the 2-3 invariant mass squared"
  outputs:
    - name: s23_min
      type: [float]
      desc: "lower limit of the 2-3 invariant mass squared"
    - name: s23_max
      type: [float]
      desc: "upper limit of the 2-3 invariant mass squared"
  desc: "Cut-restricted limits of the 2-3 invariant mass squared. Building block of @ref TwoToThreeParticleScattering; see @ref Cuts."

s23_value_and_min_max_cut:
  inputs:
    - name: pa
      type: [float, 4]
      desc: "first incoming momentum"
    - name: p3
      type: [float, 4]
      desc: "momentum of the third particle"
    - name: t1_abs
      type: [float]
      desc: "absolute value of the first momentum transfer"
    - name: p1
      type: [float, 4]
      desc: "first outgoing momentum"
    - name: p2
      type: [float, 4]
      desc: "second outgoing momentum"
    - name: etmin_1
      type: [float]
      desc: "minimum transverse energy of the first outgoing particle"
    - name: etmin_2
      type: [float]
      desc: "minimum transverse energy of the second outgoing particle"
    - name: drcut
      type: [float]
      desc: "minimum angular separation between the outgoing particles"
    - name: s23_min_cut
      type: [float]
      desc: "explicit lower cut on the 2-3 invariant mass squared"
  outputs:
    - name: s_23
      type: [float]
      desc: "the 2-3 invariant mass squared"
    - name: s23_min
      type: [float]
      desc: "lower limit of the 2-3 invariant mass squared"
    - name: s23_max
      type: [float]
      desc: "upper limit of the 2-3 invariant mass squared"
  desc: "The 2-3 invariant mass squared and its cut-restricted limits. Building block of @ref TwoToThreeParticleScattering; see @ref Cuts."

s23_position:
  inputs:
    - name: s23
      type: [float]
      desc: "the 2-3 invariant mass squared"
    - name: s_phys_min
      type: [float]
      desc: "lower kinematic limit of the 2-3 invariant mass squared"
    - name: s_phys_max
      type: [float]
      desc: "upper kinematic limit of the 2-3 invariant mass squared"
  outputs:
    - name: u
      type: [float]
      desc: "position of s23 in its kinematic range"
    - name: u_c
      type: [float]
      desc: "1 - u"
  desc: "Position of the 2-3 invariant in its kinematic range, from both ends. Building block of @ref TwoToThreeParticleScattering."

s23_arcsine_sample:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: s_min
      type: [float]
      desc: "lower limit of the sampled 2-3 invariant mass squared"
    - name: s_max
      type: [float]
      desc: "upper limit of the sampled 2-3 invariant mass squared"
    - name: s_phys_min
      type: [float]
      desc: "lower kinematic limit of the 2-3 invariant mass squared"
    - name: s_phys_max
      type: [float]
      desc: "upper kinematic limit of the 2-3 invariant mass squared"
    - name: power
      type: [float, single]
      desc: "exponent of the 1/(s - m^2)^power sampling, as in @ref Invariant"
    - name: mass
      type: [float, single]
      desc: "pole mass of the sampling, as in @ref Invariant"
  outputs:
    - name: u
      type: [float]
      desc: "position of s23 in its kinematic range"
    - name: u_c
      type: [float]
      desc: "1 - u"
    - name: det
      type: [float]
      desc: "Jacobian d s23 / d r"
  desc: "Arcsine map in the azimuth composed with the importance sampling of the 2-3 invariant, returning its position in the kinematic range at full relative precision near both ends. Building block of @ref TwoToThreeParticleScattering."

s23_arcsine_sample_inverse:
  inputs:
    - name: u
      type: [float]
      desc: "position of s23 in its kinematic range"
    - name: u_c
      type: [float]
      desc: "1 - u"
    - name: s_min
      type: [float]
      desc: "lower limit of the sampled 2-3 invariant mass squared"
    - name: s_max
      type: [float]
      desc: "upper limit of the sampled 2-3 invariant mass squared"
    - name: s_phys_min
      type: [float]
      desc: "lower kinematic limit of the 2-3 invariant mass squared"
    - name: s_phys_max
      type: [float]
      desc: "upper kinematic limit of the 2-3 invariant mass squared"
    - name: power
      type: [float, single]
      desc: "exponent of the 1/(s - m^2)^power sampling, as in @ref Invariant"
    - name: mass
      type: [float, single]
      desc: "pole mass of the sampling, as in @ref Invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: det
      type: [float]
      desc: "Jacobian d r / d s23"
  desc: "Inverse of `s23_arcsine_sample`. Building block of @ref TwoToThreeParticleScattering."

invariants_from_momenta:
  inputs:
    - name: p_ext
      type: [float, n, 4]
      desc: "external four-momenta"
    - name: factors
      type: [float, single, m, n]
      desc: "coefficient matrix, one row of per-particle coefficients for each invariant"
  outputs:
    - name: invariants
      type: [float, m]
      desc: "squared invariant mass of the coefficient-weighted sum of external momenta, one per row"
  desc: "For each row of factors, the Minkowski square of the sum of the external momenta weighted by that row. Building block of @ref PropagatorChannelWeights."

sde2_channel_weights:
  inputs:
    - name: invariants
      type: [float, m]
      desc: "propagator invariants"
    - name: masses
      type: [float, single, c, n]
      desc: "propagator masses per channel"
    - name: widths
      type: [float, single, c, n]
      desc: "propagator widths per channel"
    - name: indices
      type: [int, single, c, n]
      desc: "index into invariants for each propagator, -1 for an unused slot"
  outputs:
    - name: channel_weights
      type: [float, c]
      desc: "normalized weight per channel"
  desc: "Channel weights proportional to the inverse product of Breit-Wigner denominators (s - m^2)^2 + (m w)^2 over each channel's propagators, normalized to sum to one. Building block of @ref PropagatorChannelWeights."

subchannel_weights:
  inputs:
    - name: invariants
      type: [float, m]
      desc: "propagator invariants"
    - name: masses
      type: [float, single, c, n]
      desc: "propagator masses per channel"
    - name: widths
      type: [float, single, c, n]
      desc: "propagator widths per channel"
    - name: indices
      type: [int, single, c, n]
      desc: "index into invariants for each propagator, -1 for an unused slot"
    - name: on_shell
      type: [int, single, c, n]
      desc: "flag marking on-shell propagators per channel (0: propagator is ignored)"
    - name: group_sizes
      type: [int, single, g]
      desc: "number of subchannels in each channel group"
  outputs:
    - name: channel_weights
      type: [float, c]
      desc: "weight per subchannel, normalized to sum to one within each group"
  desc: "Subchannel weights from the product over flagged propagators of (m^4 + (m w)^2) / ((s - m^2)^2 + (m w)^2), normalized within each group of subchannels. Building block of @ref SubchannelWeights."

apply_subchannel_weights:
  inputs:
    - name: channel_weights_in
      type: [float, c]
      desc: "weight per channel"
    - name: subchannel_weights
      type: [float, n]
      desc: "weight per subchannel"
    - name: channel_indices
      type: [int, single, d]
      desc: "channel index per diagram"
    - name: subchannel_indices
      type: [int, single, d]
      desc: "subchannel index per diagram"
  outputs:
    - name: channel_weights_out
      type: [float, d]
      desc: "weight per diagram"
  desc: "Per-diagram weight: the channel weight times the subchannel weight, with a subchannel index of -1 meaning a subchannel weight of 1. Building block of @ref SubchannelWeights."

compress_channel_weights:
  inputs:
    - name: channel_index
      type: [int]
      desc: "index of the current channel, always kept"
    - name: channel_weights
      type: [float, n]
      desc: "dense weight per channel"
    - name: keep_count
      type: [size, k]
      desc: "number of entries k to keep"
  outputs:
    - name: chan_weight_values
      type: [float, k]
      desc: "the kept weights; the weight of the current channel is last, unused slots are 0"
    - name: chan_weight_indices
      type: [int, k]
      desc: "channel index of each kept weight, -1 for unused slots"
  desc: "Keeps the weight of the current channel plus the k-1 largest other weights, returning them as a sparse list. Building block of @ref PropagatorChannelWeights."

restore_channel_weights:
  inputs:
    - name: chan_weight_values
      type: [float, k]
      desc: "the kept weights"
    - name: chan_weight_indices
      type: [int, k]
      desc: "channel index of each kept weight"
    - name: full_count
      type: [size, n]
      desc: "length of the dense weight vector"
  outputs:
    - name: channel_weights
      type: [float, n]
      desc: "dense weight per channel"
  desc: "Expands the sparse weights back to a dense vector, adds a floor of 1e-12 to every channel and renormalizes to sum one (inverse of `compress_channel_weights` up to that). Building block of @ref PropagatorChannelWeights."

pt_eta_phi_x:
  inputs:
    - name: p_ext
      type: [float, n+2, 4]
      desc: "external four-momenta, including the two incoming particles"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  outputs:
    - name: output
      type: [float, 3n+2]
      desc: "x1, x2, then (log pt, phi, eta) for each final-state particle"
  desc: "Converts external momenta to the parametrization of the beam momentum fractions and per-particle log transverse momentum, azimuth and pseudorapidity. Building block of @ref ChiliMapping."

mirror_momenta:
  inputs:
    - name: p_ext
      type: [float, n, 4]
      desc: "external four-momenta"
    - name: mirror
      type: [int]
      desc: "per-event flag, 1 to mirror, 0 to leave unchanged"
  outputs:
    - name: p_mirror
      type: [float, n, 4]
      desc: "the possibly mirrored momenta"
  desc: "Flips the sign of the y and z components of all momenta if mirror is 1."

momenta_to_x1x2:
  inputs:
    - name: p_ext
      type: [float, n, 4]
      desc: "external four-momenta"
    - name: e_cm
      type: [float, single]
      desc: "hadronic center-of-mass energy"
  outputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  desc: "Beam momentum fractions x1 = 2 E_1 / e_cm and x2 = 2 E_2 / e_cm from the energies of the first two (incoming) momenta."

boost_to_frame:
  inputs:
    - name: p_ext
      type: [float, n, 4]
      desc: "external four-momenta"
    - name: frame_mask
      type: [int, single, n]
      desc: "1 for every particle whose momenta are summed up to define the rest frame, 0 for the others"
  outputs:
    - name: p_frame
      type: [float, n, 4]
      desc: "all momenta boosted into that rest frame"
  desc: "Boosts the external momenta into the rest frame of the selected particles, the frame the run card's me_frame asks the matrix element to be evaluated in; a single selected particle comes out exactly at rest. If no particle is selected the momenta are passed through unchanged. See @ref MatrixElement."

boost_to_zero_rapidity:
  inputs:
    - name: p_ext
      type: [float, n, 4]
      desc: "external four-momenta"
    - name: frame_mask
      type: [int, single, n]
      desc: "1 for every particle whose momenta are summed up to define the frame, 0 for the others"
  outputs:
    - name: p_frame
      type: [float, n, 4]
      desc: "all momenta boosted along the beam axis into that frame"
  desc: "Boosts the external momenta along the beam axis into the frame where the selected particles have zero rapidity. Followed by boost_to_frame with the same mask it reaches their rest frame in a way that does not depend on the frame along the beam the momenta come in. See @ref MatrixElement."


---
title: FKS radiation

fks_xi_y_sample:
  inputs:
    - name: r_xi
      type: [float]
      desc: "random number for the rescaled energy fraction xi_hat of the FKS parton"
    - name: r_y
      type: [float]
      desc: "random number for the cosine y of the FKS angle"
  outputs:
    - name: xi_hat
      type: [float]
      desc: "energy fraction of the FKS parton in units of its upper bound, in [stiny, 1]"
    - name: y
      type: [float]
      desc: "cosine of the angle between the FKS partons i and j, in [-1, 1 - 2 ctiny]"
    - name: det
      type: [float]
      desc: "Jacobian of the map"
  desc: "Quadratic importance sampling of the FKS variables towards the soft (xi_hat -> 0) and collinear (y -> 1) limits, as genps_fks.f of MadGraph, with its cutoffs stiny = 1e-6 and ctiny = 5e-7. Unlike genps_fks.f the Jacobian includes the factors 1 - stiny and 1 - ctiny, so that the map is exactly invertible."

fks_xi_y_sample_inverse:
  inputs:
    - name: xi_hat
      type: [float]
      desc: "energy fraction of the FKS parton in units of its upper bound"
    - name: y
      type: [float]
      desc: "cosine of the angle between the FKS partons i and j"
  outputs:
    - name: r_xi
      type: [float]
      desc: "random number for xi_hat"
    - name: r_y
      type: [float]
      desc: "random number for y"
    - name: det
      type: [float]
      desc: "Jacobian of the inverse map"
  desc: "Inverse of @ref fks_xi_y_sample."

fks_final_massless_radiate:
  inputs:
    - name: xi_hat
      type: [float]
      desc: "energy fraction of the FKS parton i in units of its upper bound xi_max"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and j"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the direction of the Born emitter"
    - name: sqrt_s
      type: [float]
      desc: "partonic center-of-mass energy of the Born, unchanged by the emission"
    - name: p_jbar
      type: [float, 4]
      desc: "massless Born emitter in the Born center-of-mass frame"
  outputs:
    - name: p_i
      type: [float, 4]
      desc: "FKS parton i (the radiated massless parton)"
    - name: p_j
      type: [float, 4]
      desc: "FKS parton j (the massless emitter after the emission)"
    - name: xi
      type: [float]
      desc: "energy fraction 2 E_i / sqrt_s"
    - name: xi_max
      type: [float]
      desc: "upper bound 1 - M_rec^2 / s of xi, with M_rec the mass of the system recoiling against the emitter"
    - name: det_xi
      type: [float]
      desc: "Jacobian of (xi_hat, y, r_phi) to the (n+1)-body phase space in units of the n-body one, divided by xi"
    - name: p_i_hat
      type: [float, 4]
      desc: "momentum of i per unit xi, p_i / xi, which stays finite in the soft limit (the p_i_fks of genps_fks.f, at the counter-events too)"
  desc: "FKS emission off a massless final-state parton, as generate_momenta_massless_final of MadGraph's genps_fks.f, except that the angle of i to i + j comes from its exact sine and cosine instead of the law of cosines, and the direction of the Born emitter from its components instead of the cosine of its polar angle (both lose up to half the digits of small angles). The sum of i and j has the direction of the Born emitter and the other final-state momenta are boosted along it with @ref fks_recoil_boost, at fixed partonic energy. Evaluated at xi_hat = 0 or y = 1 it gives the soft and collinear counter-events. det_xi stays finite in the soft limit, the Jacobian of the map is xi det_xi."

fks_final_massless_cluster:
  inputs:
    - name: p_i
      type: [float, 4]
      desc: "FKS parton i in the center-of-mass frame of the real emission"
    - name: p_j
      type: [float, 4]
      desc: "FKS parton j, massless"
    - name: sqrt_s
      type: [float]
      desc: "partonic center-of-mass energy"
  outputs:
    - name: p_jbar
      type: [float, 4]
      desc: "massless Born emitter"
    - name: xi_hat
      type: [float]
      desc: "energy fraction of i in units of xi_max"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and j"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the direction of the Born emitter"
    - name: xi
      type: [float]
      desc: "energy fraction 2 E_i / sqrt_s"
    - name: xi_max
      type: [float]
      desc: "upper bound of xi"
    - name: det_xi
      type: [float]
      desc: "inverse of det_xi of @ref fks_final_massless_radiate"
  desc: "Inverse of @ref fks_final_massless_radiate. The other final-state momenta are mapped back with @ref fks_recoil_boost_inverse."

fks_recoil_boost:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "final-state momenta of the Born recoiling against the emitter"
    - name: k
      type: [float, 4]
      desc: "momentum p_i + p_j of the FKS pair after the emission"
    - name: p_jbar
      type: [float, 4]
      desc: "Born emitter, along k"
    - name: sqrt_s
      type: [float]
      desc: "partonic center-of-mass energy"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the boosted momenta"
  desc: "Boost of the recoiling system along the direction of k in an FKS emission off a final-state parton, massless or massive, as genps_fks.f (with boostwdir2 and cosh(y) - 1 computed directly). It takes the Born recoil, of momentum (sqrt_s, 0) - p_jbar, to (sqrt_s, 0) - k at fixed invariant mass. See @ref fks_final_massless_radiate and @ref fks_final_massive_radiate."

fks_recoil_boost_inverse:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "final-state momenta recoiling against the FKS pair"
    - name: k
      type: [float, 4]
      desc: "momentum p_i + p_j of the FKS pair"
    - name: p_jbar
      type: [float, 4]
      desc: "Born emitter, along k"
    - name: sqrt_s
      type: [float]
      desc: "partonic center-of-mass energy"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the momenta of the Born recoil"
  desc: "Inverse of @ref fks_recoil_boost."

fks_resonance_frame:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "momenta of an FKS emission, in the partonic center-of-mass frame"
    - name: mask
      type: [float, n]
      desc: "1 for the members of the resonance, 0 for the other particles"
    - name: sqrt_s
      type: [float]
      desc: "partonic center-of-mass energy"
  outputs:
    - name: p_frame
      type: [float, n, 4]
      desc: "the members in the rest frame of their sum, the other momenta zero"
    - name: k
      type: [float, 4]
      desc: "the momentum K of the resonance, the sum of its members"
    - name: sqrt_s_frame
      type: [float]
      desc: "the mass sqrt(K^2) of the resonance"
  desc: "The rest frame of the resonance of the resonance-local recoil of an FKS emission off a final-state parton (prepare_resonance_frame of MadGraph7, after Jezo and Nason). The members add up to K and are boosted into its rest frame as boostx does, the other momenta are set to zero, so that the emission at sqrt_s_frame maps the members alone and keeps K. Without members (mask 0 everywhere) the momenta pass through, K = (sqrt_s, 0) and sqrt_s_frame = sqrt_s."

fks_resonance_frame_inverse:
  inputs:
    - name: p_frame
      type: [float, n, 4]
      desc: "momenta in the rest frame of the resonance"
    - name: p
      type: [float, n, 4]
      desc: "momenta of the particles that are not members, in the partonic center-of-mass frame"
    - name: mask
      type: [float, n]
      desc: "1 for the members of the resonance, 0 for the other particles"
    - name: k
      type: [float, 4]
      desc: "the momentum K of the resonance, from @ref fks_resonance_frame"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the members boosted back by K, the other momenta those of p"
  desc: "Inverse of @ref fks_resonance_frame: the members of p_frame are boosted by K into the partonic center-of-mass frame, the other momenta are taken from p. Without members p_frame passes through."

fks_final_massive_sample:
  inputs:
    - name: r_xi
      type: [float]
      desc: "random number for xi_hat"
    - name: r_y
      type: [float]
      desc: "random number for the cosine y of the FKS angle"
    - name: sqrt_s
      type: [float]
      desc: "partonic center-of-mass energy"
    - name: p_jbar
      type: [float, 4]
      desc: "massive Born emitter in the Born center-of-mass frame"
    - name: m_j
      type: [float]
      desc: "mass of the emitter"
  outputs:
    - name: xi_hat
      type: [float]
      desc: "position along the range of xi, see @ref fks_final_massive_radiate"
    - name: y
      type: [float]
      desc: "cosine of the angle between the FKS partons i and j, in [-1, 1 - 2 ctiny]"
    - name: det
      type: [float]
      desc: "Jacobian of the map"
  desc: "Sampling of the FKS variables for a massive final-state emitter, as generate_momenta_massive_final of MadGraph's genps_fks.f. y as in @ref fks_xi_y_sample. r_xi in [0, rat] is mapped quadratically onto xi_hat in [rat stiny, rat], the first solution for the momentum of the emitter, and r_xi in [rat, 1] linearly onto xi_hat in [rat, 1], the second one, with rat = xi_max / xi_norm (1 for y >= 0). The Jacobian includes the factors 1 - stiny and 1 - ctiny."

fks_final_massive_sample_inverse:
  inputs:
    - name: xi_hat
      type: [float]
      desc: "position along the range of xi"
    - name: y
      type: [float]
      desc: "cosine of the angle between the FKS partons i and j"
    - name: sqrt_s
      type: [float]
      desc: "partonic center-of-mass energy"
    - name: p_jbar
      type: [float, 4]
      desc: "massive Born emitter"
    - name: m_j
      type: [float]
      desc: "mass of the emitter"
  outputs:
    - name: r_xi
      type: [float]
      desc: "random number for xi_hat"
    - name: r_y
      type: [float]
      desc: "random number for y"
    - name: det
      type: [float]
      desc: "Jacobian of the inverse map"
  desc: "Inverse of @ref fks_final_massive_sample."

fks_final_massive_radiate:
  inputs:
    - name: xi_hat
      type: [float]
      desc: "position along the range of xi, xi = xi_norm xi_hat up to xi_hat = rat and xi = 2 xi_max - xi_norm xi_hat beyond"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and j"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the direction of the Born emitter"
    - name: sqrt_s
      type: [float]
      desc: "partonic center-of-mass energy of the Born, unchanged by the emission"
    - name: p_jbar
      type: [float, 4]
      desc: "massive Born emitter in the Born center-of-mass frame"
    - name: m_j
      type: [float]
      desc: "mass of the emitter"
  outputs:
    - name: p_i
      type: [float, 4]
      desc: "FKS parton i (the radiated massless parton)"
    - name: p_j
      type: [float, 4]
      desc: "FKS parton j (the massive emitter after the emission)"
    - name: xi
      type: [float]
      desc: "energy fraction 2 E_i / sqrt_s"
    - name: xi_max
      type: [float]
      desc: "largest xi at this y"
    - name: xi_norm
      type: [float]
      desc: "length of the path of xi_hat along the range of xi, xi_max for y >= 0 and 2 xi_max - xi_m for y < 0"
    - name: det_xi
      type: [float]
      desc: "Jacobian of (xi_hat, y, r_phi) to the (n+1)-body phase space in units of the n-body one, divided by xi"
    - name: p_i_hat
      type: [float, 4]
      desc: "momentum of i per unit xi, p_i / xi, which stays finite in the soft limit (the p_i_fks of genps_fks.f, at the counter-events too)"
  desc: "FKS emission off a massive final-state parton, as generate_momenta_massive_final of MadGraph's genps_fks.f. The emitter comes to rest at xi_m = ((1 - m_j)^2 - m_rec^2) / (1 - m_j) (in units of sqrt_s, with m_rec the mass of the system recoiling against it). For y >= 0 xi runs from 0 to xi_max = xi_m. For y < 0 there are two solutions for the momentum of the emitter, which meet at xi_max > xi_m, and xi_hat runs from 0 to xi_max with the first and back to xi_m with the second. Unlike genps_fks.f, xi_max, the momentum of the emitter and the phase-space factor are written without cancellations (genps_fks.f loses up to 1e-11 relative in the Jacobian of the second solution near xi_m and xi_max), the angle of i to i + j comes from its exact sine and cosine and the direction of the Born emitter from its components. The other final-state momenta are boosted with @ref fks_recoil_boost. Evaluated at xi_hat = 0 it gives the soft counter-event (genps_fks.f has no collinear one for a massive emitter). det_xi stays finite in the soft limit and diverges like 1 / sqrt(xi_max - xi) where the two solutions meet, the Jacobian of the map is xi det_xi."

fks_final_massive_cluster:
  inputs:
    - name: p_i
      type: [float, 4]
      desc: "FKS parton i"
    - name: p_j
      type: [float, 4]
      desc: "massive FKS parton j"
    - name: sqrt_s
      type: [float]
      desc: "partonic center-of-mass energy"
    - name: m_j
      type: [float]
      desc: "mass of the emitter"
  outputs:
    - name: p_jbar
      type: [float, 4]
      desc: "Born emitter, along p_i + p_j"
    - name: xi_hat
      type: [float]
      desc: "position along the range of xi"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and j"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i"
    - name: xi
      type: [float]
      desc: "energy fraction of i"
    - name: xi_max
      type: [float]
      desc: "largest xi at this y"
    - name: xi_norm
      type: [float]
      desc: "length of the path of xi_hat along the range of xi"
    - name: det_xi
      type: [float]
      desc: "inverse of det_xi of @ref fks_final_massive_radiate"
  desc: "Inverse of @ref fks_final_massive_radiate. The solution follows from the sign of (2 - xi) |k_j| + xi y E_j. The other final-state momenta are mapped back with @ref fks_recoil_boost_inverse."


fks_initial_radiate:
  inputs:
    - name: xi_hat
      type: [float]
      desc: "energy fraction of the FKS parton i, mapped linearly onto [xi_min, xi_max]"
    - name: y_hat
      type: [float]
      desc: "cosine of the angle between i and the incoming emitter j in [-1, 1], mapped linearly onto the allowed range of y (y = y_hat without a bound)"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the beam axis"
    - name: sqrt_s
      type: [float]
      desc: "partonic center-of-mass energy of the Born"
    - name: x1_born
      type: [float]
      desc: "momentum fraction of beam 1 in the Born"
    - name: x2_born
      type: [float]
      desc: "momentum fraction of beam 2 in the Born"
    - name: s_hat_min
      type: [float]
      desc: "lower bound on the partonic energy squared of the real emission (tau_lower_bound s_lab in genps_fks.f), 0 for none"
    - name: beam_sign
      type: [float]
      desc: "+1 if j comes from beam 1 (along +z), -1 if from beam 2"
  outputs:
    - name: p_in1
      type: [float, 4]
      desc: "incoming momentum along +z of the real emission, in the Born center-of-mass frame"
    - name: p_in2
      type: [float, 4]
      desc: "incoming momentum along -z of the real emission, in the Born center-of-mass frame"
    - name: p_i
      type: [float, 4]
      desc: "FKS parton i, in the Born center-of-mass frame"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1 in the real emission"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2 in the real emission"
    - name: xi
      type: [float]
      desc: "energy fraction 2 E_i / sqrt(s) of i in the center-of-mass frame of the real emission"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and j in the center-of-mass frame of the real emission"
    - name: xi_min
      type: [float]
      desc: "lower bound 1 - sqrt_s^2 / s_hat_min of xi, 0 if the Born is above the bound"
    - name: xi_max
      type: [float]
      desc: "upper bound of xi at this y, from x1 <= 1 and x2 <= 1"
    - name: det_xi
      type: [float]
      desc: "Jacobian of (xi_hat, y_hat, r_phi, x1_born, x2_born) to (x1, x2) and the (n+1)-body phase space, in units of the n-body one, divided by xi"
    - name: p_i_hat
      type: [float, 4]
      desc: "momentum of i per unit xi, p_i / xi, which stays finite in the soft limit (the p_i_fks of genps_fks.f, at the counter-events too)"
  desc: "FKS emission off an incoming parton, as generate_momenta_initial of MadGraph's genps_fks.f. The real emission has sqrt(s) = sqrt_s / sqrt(1 - xi), its incoming momenta and i are built in its center-of-mass frame and boosted along z into the Born center-of-mass frame, in which the final state of the Born keeps zero longitudinal momentum (see @ref fks_initial_recoil_boost). xi_max is the smaller root of the conditions x1 <= 1 and x2 <= 1, written without the cancellations of genps_fks.f near y -> -1 and x -> 1 (which lose up to 1e-4 relative there). With s_hat_min above the Born, xi >= xi_min = 1 - sqrt_s^2 / s_hat_min and y is restricted to where xi_max(y) >= xi_min, as genps_fks.f does with tau_lower_bound; the map then covers exactly the real emissions with s >= s_hat_min. Evaluated at xi_hat = 0 or y_hat = 1 it gives the soft and collinear counter-events where they exist (xi_min = 0, respectively y = 1 allowed). det_xi stays finite in the soft limit, the Jacobian of the map is xi det_xi."

fks_initial_cluster:
  inputs:
    - name: p_in1
      type: [float, 4]
      desc: "incoming momentum along +z of the real emission, in the Born center-of-mass frame"
    - name: p_in2
      type: [float, 4]
      desc: "incoming momentum along -z of the real emission, in the Born center-of-mass frame"
    - name: p_i
      type: [float, 4]
      desc: "FKS parton i, massless"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1 in the real emission"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2 in the real emission"
    - name: s_hat_min
      type: [float]
      desc: "lower bound on the partonic energy squared of the real emission, 0 for none"
    - name: beam_sign
      type: [float]
      desc: "+1 if j comes from beam 1 (along +z), -1 if from beam 2"
  outputs:
    - name: sqrt_s
      type: [float]
      desc: "partonic center-of-mass energy of the Born"
    - name: x1_born
      type: [float]
      desc: "momentum fraction of beam 1 in the Born"
    - name: x2_born
      type: [float]
      desc: "momentum fraction of beam 2 in the Born"
    - name: xi_hat
      type: [float]
      desc: "energy fraction of i in units of the range [xi_min, xi_max]"
    - name: y_hat
      type: [float]
      desc: "cosine of the angle between i and j in units of its allowed range"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the beam axis"
    - name: xi
      type: [float]
      desc: "energy fraction of i"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and j in the center-of-mass frame of the real emission"
    - name: xi_min
      type: [float]
      desc: "lower bound of xi"
    - name: xi_max
      type: [float]
      desc: "upper bound of xi"
    - name: det_xi
      type: [float]
      desc: "inverse of det_xi of @ref fks_initial_radiate"
  desc: "Inverse of @ref fks_initial_radiate. 1 - y and 1 + y come from the light-cone components of i, so that they keep their precision when i is collinear to a beam. The final state of the Born is mapped back with @ref fks_initial_recoil_boost_inverse."

fks_initial_recoil_boost:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "final-state momenta of the Born, in its center-of-mass frame"
    - name: xi
      type: [float]
      desc: "energy fraction of the FKS parton i"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and the incoming emitter j"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the beam axis"
    - name: beam_sign
      type: [float]
      desc: "+1 if j comes from beam 1 (along +z), -1 if from beam 2"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the boosted momenta"
  desc: "Transverse boost of the final state of the Born that gives it the transverse momentum -p_T of i in an FKS emission off an incoming parton, as genps_fks.f, with cosh(y) - 1 computed as sinh(y)^2 / (cosh(y) + 1). See @ref fks_initial_radiate."

fks_initial_recoil_boost_inverse:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "final-state momenta of the real emission without i"
    - name: xi
      type: [float]
      desc: "energy fraction of the FKS parton i"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and the incoming emitter j"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the beam axis"
    - name: beam_sign
      type: [float]
      desc: "+1 if j comes from beam 1 (along +z), -1 if from beam 2"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the final-state momenta of the Born"
  desc: "Inverse of @ref fks_initial_recoil_boost."

fks_initial_asymmetric_radiate:
  inputs:
    - name: xi_hat
      type: [float]
      desc: "energy fraction of the FKS parton i, mapped linearly onto [xi_min, xi_max]"
    - name: y_hat
      type: [float]
      desc: "cosine of the angle between i and the incoming emitter j, which this map does not restrict (y = y_hat)"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the beam axis"
    - name: sqrt_s
      type: [float]
      desc: "partonic center-of-mass energy of the Born"
    - name: x1_born
      type: [float]
      desc: "momentum fraction of beam 1 in the Born"
    - name: x2_born
      type: [float]
      desc: "momentum fraction of beam 2 in the Born"
    - name: s_hat_min
      type: [float]
      desc: "lower bound on the partonic energy squared of the real emission, 0 for none"
    - name: beam_sign
      type: [float]
      desc: "+1 if j comes from beam 1 (along +z), -1 if from beam 2"
  outputs:
    - name: p_in1
      type: [float, 4]
      desc: "incoming momentum along +z of the real emission, in the Born center-of-mass frame"
    - name: p_in2
      type: [float, 4]
      desc: "incoming momentum along -z of the real emission, in the Born center-of-mass frame"
    - name: p_i
      type: [float, 4]
      desc: "FKS parton i, in the Born center-of-mass frame"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1 in the real emission"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2 in the real emission"
    - name: xi
      type: [float]
      desc: "energy fraction 2 E_i / sqrt(s) of i in the center-of-mass frame of the real emission"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and j in the center-of-mass frame of the real emission"
    - name: xi_min
      type: [float]
      desc: "lower bound 1 - sqrt_s^2 / s_hat_min of xi, 0 if the Born is above the bound"
    - name: xi_max
      type: [float]
      desc: "upper bound 1 - xbar_j of xi, from x_j <= 1 for the momentum fraction xbar_j of the emitter in the Born"
    - name: det_xi
      type: [float]
      desc: "Jacobian of (xi_hat, y_hat, r_phi, x1_born, x2_born) to (x1, x2) and the (n+1)-body phase space, in units of the n-body one, divided by xi"
    - name: p_i_hat
      type: [float, 4]
      desc: "momentum of i per unit xi, p_i / xi, which stays finite in the soft limit"
  desc: "Asymmetric FKS emission off an incoming parton, as generate_momenta_initial_asymmetric of MadGraph7 (FKSISRMapping 0 and 2, its default). Only the emitter changes its momentum fraction, x_j = xbar_j / (1 - xi), and the spectator keeps its own, so that xi_max = 1 - xbar_j at every y. The real emission has sqrt(s) = sqrt_s / sqrt(1 - xi) and its incoming momenta and i are given in the Born center-of-mass frame, where the final state of the Born is mapped with @ref fks_initial_light_cone_map. With s_hat_min above the Born, xi >= xi_min = 1 - sqrt_s^2 / s_hat_min and y keeps its whole range, and where that leaves no range of xi (xi_max <= xi_min) det_xi is 0 and xi = xi_max. At xi_hat = 0 and y_hat = 1 it gives the soft and collinear counter-events of @ref fks_initial_radiate, the soft one where xi_min = 0. det_xi is that of @ref fks_initial_radiate with the whole range of y, the Jacobian of the map is xi det_xi."

fks_initial_asymmetric_cluster:
  inputs:
    - name: p_in1
      type: [float, 4]
      desc: "incoming momentum along +z of the real emission, in the Born center-of-mass frame"
    - name: p_in2
      type: [float, 4]
      desc: "incoming momentum along -z of the real emission, in the Born center-of-mass frame"
    - name: p_i
      type: [float, 4]
      desc: "FKS parton i, massless"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1 in the real emission"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2 in the real emission"
    - name: s_hat_min
      type: [float]
      desc: "lower bound on the partonic energy squared of the real emission, 0 for none"
    - name: beam_sign
      type: [float]
      desc: "+1 if j comes from beam 1 (along +z), -1 if from beam 2"
  outputs:
    - name: sqrt_s
      type: [float]
      desc: "partonic center-of-mass energy of the Born"
    - name: x1_born
      type: [float]
      desc: "momentum fraction of beam 1 in the Born"
    - name: x2_born
      type: [float]
      desc: "momentum fraction of beam 2 in the Born"
    - name: xi_hat
      type: [float]
      desc: "energy fraction of i in units of the range [xi_min, xi_max]"
    - name: y_hat
      type: [float]
      desc: "cosine of the angle between i and j, equal to y"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the beam axis"
    - name: xi
      type: [float]
      desc: "energy fraction of i"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and j in the center-of-mass frame of the real emission"
    - name: xi_min
      type: [float]
      desc: "lower bound of xi"
    - name: xi_max
      type: [float]
      desc: "upper bound of xi"
    - name: det_xi
      type: [float]
      desc: "inverse of det_xi of @ref fks_initial_asymmetric_radiate"
  desc: "Inverse of @ref fks_initial_asymmetric_radiate. xi = 2 p_i.P / P^2 and 1 -+ y come from the light-cone components of i, as in @ref fks_initial_cluster, and the momentum fraction of the emitter in the Born is x_j (1 - xi). The final state of the Born is mapped back with @ref fks_initial_light_cone_map_inverse."

fks_initial_asymmetric_born_fractions:
  inputs:
    - name: p_in1
      type: [float, 4]
      desc: "first incoming momentum of the real emission, along the beam axis"
    - name: p_in2
      type: [float, 4]
      desc: "second incoming momentum of the real emission, along the beam axis"
    - name: p_i
      type: [float, 4]
      desc: "FKS parton i, massless, in the same frame"
    - name: x1
      type: [float]
      desc: "momentum fraction of the first incoming parton in the real emission"
    - name: x2
      type: [float]
      desc: "momentum fraction of the second incoming parton in the real emission"
    - name: beam_sign
      type: [float]
      desc: "+1 if j is the first incoming parton, -1 if the second"
  outputs:
    - name: x1_born
      type: [float]
      desc: "momentum fraction of the first incoming parton in the Born"
    - name: x2_born
      type: [float]
      desc: "momentum fraction of the second incoming parton in the Born"
  desc: "The momentum fractions of the Born of @ref fks_initial_asymmetric_radiate from the real emission in any frame where the incoming momenta are along the beam axis: x_j (1 - xi) for the emitter, with the invariant xi = 2 p_i.(p_in1 + p_in2) / (p_in1 + p_in2)^2, and that of the spectator unchanged. They give the frame of the Born for the inverse of @ref FKSMapping."

fks_initial_light_cone_map:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "final-state momenta of the Born, in its center-of-mass frame"
    - name: masses
      type: [float, single, n]
      desc: "mass of each particle, or a negative value for none (the formulas without the mass shell)"
    - name: xi
      type: [float]
      desc: "energy fraction of the FKS parton i"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and the incoming emitter j"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the beam axis"
    - name: beam_sign
      type: [float]
      desc: "+1 if j comes from beam 1 (along +z), -1 if from beam 2"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the mapped momenta"
  desc: "Lorentz map of the final state of the Born in the asymmetric FKS emission off an incoming parton (@ref fks_initial_asymmetric_radiate), apply_isr_recoil_boost of MadGraph7. In light-cone components along the emitter, q^+ -> A q^+, q_T -> q_T + b q^+ and q^- -> (q^- + 2 b.q_T + b^2 q^+) / A, with A = 1 + xi (1 - y) / (2 (1 - xi)) and b = -xi sin(theta) / (2 sqrt(1 - xi)) (cos phi, sin phi). It keeps the direction of the spectator and gives the final state the momentum of the real emission without i. Where the mass is known, the smaller light-cone component on input and q^- on output come from the mass shell, which keeps the relative precision of every momentum."

fks_initial_light_cone_map_inverse:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "final-state momenta of the real emission without i"
    - name: masses
      type: [float, single, n]
      desc: "mass of each particle, or a negative value for none"
    - name: xi
      type: [float]
      desc: "energy fraction of the FKS parton i"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and the incoming emitter j"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the beam axis"
    - name: beam_sign
      type: [float]
      desc: "+1 if j comes from beam 1 (along +z), -1 if from beam 2"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the final-state momenta of the Born"
  desc: "Inverse of @ref fks_initial_light_cone_map, with q^+ -> q^+ / A and the mass shell for the smaller light-cone component on input and q^- on output, so that a momentum close to the axis keeps its precision where A is large."

fks_initial_fixed_light_cone_map:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "final-state momenta of the Born, in its rest frame of energy sqrt(s_rec) = sqrt((1 - xi) s)"
    - name: masses
      type: [float, single, n]
      desc: "mass of each particle, or a negative value for none"
    - name: xi
      type: [float]
      desc: "energy fraction of the FKS parton i"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and the incoming emitter j"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the beam axis"
    - name: beam_sign
      type: [float]
      desc: "+1 if j comes from beam 1 (along +z), -1 if from beam 2"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the mapped momenta, in the center-of-mass frame of the real emission"
  desc: "The asymmetric map of the Born without the projection of the event (lepton beams, @ref fks_initial_fixed_radiate), boost_born_momenta_noevpr of MadGraph7 with FKSISRMapping 2: @ref fks_initial_light_cone_map followed by the boost q^+ -> sqrt(1 - xi) q^+, q^- -> q^- / sqrt(1 - xi) into the center-of-mass frame of the real emission. It takes the place of @ref fks_initial_fixed_boost. The final state recoils against the same i, rotated about the momentum of the recoil."

fks_initial_fixed_light_cone_map_inverse:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "final-state momenta of the real emission without i, in its center-of-mass frame"
    - name: masses
      type: [float, single, n]
      desc: "mass of each particle, or a negative value for none"
    - name: xi
      type: [float]
      desc: "energy fraction of the FKS parton i"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and the incoming emitter j"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the beam axis"
    - name: beam_sign
      type: [float]
      desc: "+1 if j comes from beam 1 (along +z), -1 if from beam 2"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the final-state momenta of the Born, in its rest frame"
  desc: "Inverse of @ref fks_initial_fixed_light_cone_map."

fks_initial_fixed_radiate:
  inputs:
    - name: xi_hat
      type: [float]
      desc: "energy fraction of i over its upper end"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and the incoming emitter j"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i about the beam axis"
    - name: sqrt_s
      type: [float]
      desc: "partonic energy of the real emission"
    - name: s_born_min
      type: [float]
      desc: "lower end of the energy squared of the Born"
    - name: beam_sign
      type: [float]
      desc: "+1 if j comes from beam 1 (along +z), -1 if from beam 2"
  outputs:
    - name: p_i
      type: [float, 4]
      desc: "momentum of i in the partonic center-of-mass frame"
    - name: xi
      type: [float]
      desc: "energy fraction of i"
    - name: xi_max
      type: [float]
      desc: "upper end of xi, 1 - s_born_min / s"
    - name: sqrt_s_rec
      type: [float]
      desc: "energy of the Born, sqrt((1 - xi) s)"
    - name: det_xi
      type: [float]
      desc: "phase space of i per unit xi, xi_hat, y and r_phi"
    - name: p_i_hat
      type: [float, 4]
      desc: "momentum of i per unit xi"
  desc: "The emission off an incoming parton without the projection of the event onto the Born (generate_momenta_initial_noevpr of genps_fks.f), at fixed partonic energy and momentum fractions. See @ref FKSConfigurationMapping."

fks_initial_fixed_cluster:
  inputs:
    - name: p_i
      type: [float, 4]
      desc: "momentum of i in the partonic center-of-mass frame"
    - name: sqrt_s
      type: [float]
      desc: "partonic energy of the real emission"
    - name: s_born_min
      type: [float]
      desc: "lower end of the energy squared of the Born"
    - name: beam_sign
      type: [float]
      desc: "+1 if j comes from beam 1 (along +z), -1 if from beam 2"
  outputs:
    - name: xi_hat
      type: [float]
      desc: "energy fraction of i over its upper end"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and the incoming emitter j"
    - name: r_phi
      type: [float]
      desc: "random number for the azimuth of i"
    - name: xi
      type: [float]
      desc: "energy fraction of i"
    - name: sqrt_s_rec
      type: [float]
      desc: "energy of the Born"
    - name: det_xi
      type: [float]
      desc: "inverse of det_xi of fks_initial_fixed_radiate"
  desc: "Inverse of @ref fks_initial_fixed_radiate."

fks_initial_fixed_boost:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "final-state momenta of the Born in its rest frame"
    - name: p_i_hat
      type: [float, 4]
      desc: "momentum of i per unit xi"
    - name: xi
      type: [float]
      desc: "energy fraction of i"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the momenta in the partonic center-of-mass frame of the real emission"
  desc: "The boost of boost_born_momenta_noevpr (genps_fks.f) of the Born of @ref fks_initial_fixed_radiate from its rest frame into the partonic center-of-mass frame, where it recoils against i."

fks_initial_fixed_boost_inverse:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "final-state momenta of the real emission without i"
    - name: p_i_hat
      type: [float, 4]
      desc: "momentum of i per unit xi"
    - name: xi
      type: [float]
      desc: "energy fraction of i"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the final-state momenta of the Born in its rest frame"
  desc: "Inverse of @ref fks_initial_fixed_boost."

fks_recoil_light_cone:
  inputs:
    - name: p_in1
      type: [float, 4]
      desc: "incoming momentum along +z"
    - name: p_in2
      type: [float, 4]
      desc: "incoming momentum along -z"
    - name: p_i
      type: [float, 4]
      desc: "FKS parton i"
  outputs:
    - name: plus
      type: [float]
      desc: "E + p_z of p_in1 + p_in2 - p_i"
    - name: minus
      type: [float]
      desc: "E - p_z of p_in1 + p_in2 - p_i"
  desc: "Light-cone components of the system recoiling against i in an FKS emission off an incoming parton. It has zero longitudinal momentum in the center-of-mass frame of the Born, so plus / minus = exp(2 y) for the rapidity y of that frame in the frame of the inputs. See @ref FKSMapping."

fks_counter_event_det:
  inputs:
    - name: det
      type: [float]
      desc: "Jacobian of the counter-event"
    - name: xi
      type: [float]
      desc: "energy fraction of i at the counter-event"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and j at the counter-event"
    - name: xi_hat
      type: [float]
      desc: "xi_hat of the event"
    - name: rat
      type: [float]
      desc: "end of the first solution for the momentum of a massive emitter in xi_hat, xi_max / xi_norm (1 for any other emitter)"
    - name: soft
      type: [float]
      desc: "1 for a soft counter-event, 0 otherwise"
    - name: collinear
      type: [float]
      desc: "1 for a collinear counter-event, 0 otherwise"
    - name: exists
      type: [float]
      desc: "0 for a counter-event the emitter does not have (the collinear ones of a massive emitter), 1 otherwise"
  outputs:
    - name: det_out
      type: [float]
      desc: "det where the counter-event exists, 0 elsewhere"
  desc: "Jacobian of an FKS counter-event, zero where genps_fks.f does not generate it: a soft counter-event needs xi = 0, which a lower bound on the partonic energy of an emission off an incoming parton can exclude, and an event with the first solution for the momentum of a massive emitter; a collinear one needs y = 1, which the bound can exclude. A massive emitter has no collinear counter-events. See @ref FKSRadiation."

fks_beam_boost:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "momenta"
    - name: masses
      type: [float, single, n]
      desc: "mass of each particle, or a negative value for a linear boost"
    - name: plus
      type: [float]
      desc: "boost by the rapidity log(plus / minus) / 2"
    - name: minus
      type: [float]
      desc: "see plus"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the boosted momenta"
  desc: "Boost along the beam axis in light-cone components, the smaller one of each momentum from its mass shell, which keeps the relative precision of every momentum in both directions of the boost. Exchanging plus and minus gives the inverse. Unlike @ref boost_beam it does not lose precision when boosting out of the lab frame. See @ref FKSMapping."

---
title: FKS subtraction

fks_sector_function:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "momenta of the real emission or of a counter-event, in the order of the real process of the configuration of the event, in any frame"
    - name: p_i_hat
      type: [float, 4]
      desc: "momentum of i per unit xi, which gives its direction where i is soft"
    - name: index
      type: [int]
      desc: "FKS configuration of the event"
    - name: fks_i
      type: [int, single, c]
      desc: "position of i in the real process of each configuration"
    - name: fks_j
      type: [int, single, c]
      desc: "position of j in the real process of each configuration"
    - name: pairs
      type: [int, single, c, n, n]
      desc: "1 where (k, l) is an FKS pair of the real process of the configuration, each pair once"
    - name: octet
      type: [int, single, c, n]
      desc: "1 for a color octet, whose energy is always in d_kl"
    - name: aorg
      type: [int, single, c, n]
      desc: "1 for a gluon or a photon: a final-state pair (i, j) of two of them gets h_damp"
    - name: masses
      type: [float, single, c, n]
      desc: "masses of the particles of the real process of each configuration"
    - name: options
      type: [float, single, 6]
      desc: "fks_a, fks_b, useenergy, usebeta, one_h_damp and a_h_damp of fks_powers.inc"
  outputs:
    - name: s
      type: [float]
      desc: "the sector function S_ij of the configuration"
  vectorized: False
  desc: "FKS sector function S_ij of fks_Sij.f, 1 / sum_kl d_ij / d_kl over the FKS pairs (k, l) of the real process with d_kl = (E_k E_l / (sqrt_s / 2)^2)^fks_a (1 - beta_k beta_l cos theta_kl)^fks_b, times h_damp(E_i / (E_i + E_j)) for a final-state pair (i, j) of two gluons or photons. Energies and angles are those in the partonic center-of-mass frame of the momenta, from invariants. i enters with the direction of p_i_hat and the energy of its momentum in p, so that at a soft counter-event the pairs without i drop out. As in fks_Sij.f, S_ij is zero where an energy or the angle of a pair in a denominator falls below 1e-8."

fks_eikonals:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "momenta of the soft counter-event, in the order of the real process of the configuration of the event, in any frame"
    - name: p_i_hat
      type: [float, 4]
      desc: "momentum of i per unit xi, which gives its direction where i is soft"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and j in the partonic center-of-mass frame"
    - name: index
      type: [int]
      desc: "FKS configuration of the event"
    - name: fks_j
      type: [int, single, c]
      desc: "position of j in the real process of each configuration"
    - name: pair_count
      type: [int, single, c]
      desc: "number of pairs (m, n) of each configuration"
    - name: pair_m
      type: [int, single, c, k]
      desc: "position of m of each pair in the real process"
    - name: pair_n
      type: [int, single, c, k]
      desc: "position of n of each pair in the real process"
    - name: masses
      type: [float, single, c, n]
      desc: "masses of the particles of the real process of each configuration"
  outputs:
    - name: eik
      type: [float, k]
      desc: "reduced eikonal factor of each pair, zero past the pairs of the configuration"
  vectorized: False
  desc: "Reduced eikonal factors of eikonal_reduced in fks_singular.f, (p_m p_n) (1 - y) / ((p_m p_i_hat) (p_n p_i_hat)) for the pairs (m, n) of the soft limit of the configuration of the event. For a massless j, (p_j p_i_hat) / (1 - y) is sqrt_s E_j / 2 in the partonic center-of-mass frame, so that the factors are finite at y = 1. With the color-linked Borns of the pairs they give the soft limit of xi^2 (1 - y) times the real matrix element."

fks_eikonals_resonance:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "momenta of the soft counter-event, in the order of the real process of the configuration of the event, in any frame"
    - name: p_i_hat
      type: [float, 4]
      desc: "momentum of i per unit xi, which gives its direction where i is soft"
    - name: y
      type: [float]
      desc: "cosine of the angle between i and j in the partonic center-of-mass frame"
    - name: k
      type: [float, 4]
      desc: "momentum of the resonance of the resonance-local recoil of the event, zero where it has none"
    - name: index
      type: [int]
      desc: "FKS configuration of the event"
    - name: fks_j
      type: [int, single, c]
      desc: "position of j in the real process of each configuration"
    - name: pair_count
      type: [int, single, c]
      desc: "number of pairs (m, n) of each configuration"
    - name: pair_m
      type: [int, single, c, k]
      desc: "position of m of each pair in the real process"
    - name: pair_n
      type: [int, single, c, k]
      desc: "position of n of each pair in the real process"
    - name: masses
      type: [float, single, c, n]
      desc: "masses of the particles of the real process of each configuration"
  outputs:
    - name: eik
      type: [float, k]
      desc: "reduced eikonal factor of each pair, zero past the pairs of the configuration"
  vectorized: False
  desc: "Reduced eikonal factors of eikonal_reduced in fks_singular.f, (p_m p_n) (1 - y) / ((p_m p_i_hat) (p_n p_i_hat)) for the pairs (m, n) of the soft limit of the configuration of the event. For a massless j, (p_j p_i_hat) / (1 - y) is sqrt_s E_j / 2 in the partonic center-of-mass frame, so that the factors are finite at y = 1. With the color-linked Borns of the pairs they give the soft limit of xi^2 (1 - y) times the real matrix element. With the resonance-local recoil (eikonal_reduced of its MadGraph7 branch), (p_j p_i_hat) / (1 - y) is (k p_j) / 2 with the momentum k of the resonance where the event has one."

fks_splitting_kernels:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "momenta of the collinear or soft-collinear counter-event, in the order of the real process of the configuration of the event, in any frame"
    - name: index
      type: [int]
      desc: "FKS configuration of the event"
    - name: fks_i
      type: [int, single, c]
      desc: "position of i in the real process of each configuration"
    - name: fks_j
      type: [int, single, c]
      desc: "position of j in the real process of each configuration"
    - name: kind
      type: [int, single, c]
      desc: "splitting function of each configuration: 0 g -> g g, 1 g/a -> q q~, 2 q -> q g/a, 3 q -> g/a q"
    - name: factors
      type: [float, single, c, 4]
      desc: "QCD and QED factors of the Altarelli-Parisi kernel and of the azimuthal terms of each configuration"
  outputs:
    - name: z
      type: [float]
      desc: "momentum fraction of the splitting"
    - name: ap
      type: [float, 2]
      desc: "QCD and QED Altarelli-Parisi kernels (1 - z) P(z) / t of AP_reduced, without the couplings"
    - name: q
      type: [float, 2]
      desc: "QCD and QED azimuthal terms of Qterms_reduced_timelike or Qterms_reduced_spacelike, without the couplings"
  vectorized: False
  desc: "The collinear factors of sborncol_fsr and sborncol_isr in fks_singular.f: z = 1 - E_i / (E_i + E_j) in the partonic center-of-mass frame for a final-state j, 1 - xi = 1 - 2 E_i / sqrt(s) for an initial-state one, the Altarelli-Parisi kernel of the splitting and its azimuthal terms, timelike for a final-state j and spacelike for an initial-state one, with t = z s / 4 and without the couplings."

fks_splitting_kernels_resonance:
  inputs:
    - name: p
      type: [float, n, 4]
      desc: "momenta of the collinear or soft-collinear counter-event, in the order of the real process of the configuration of the event, in any frame"
    - name: k
      type: [float, 4]
      desc: "momentum of the resonance of the resonance-local recoil of the event, zero where it has none"
    - name: index
      type: [int]
      desc: "FKS configuration of the event"
    - name: fks_i
      type: [int, single, c]
      desc: "position of i in the real process of each configuration"
    - name: fks_j
      type: [int, single, c]
      desc: "position of j in the real process of each configuration"
    - name: kind
      type: [int, single, c]
      desc: "splitting function of each configuration: 0 g -> g g, 1 g/a -> q q~, 2 q -> q g/a, 3 q -> g/a q"
    - name: factors
      type: [float, single, c, 4]
      desc: "QCD and QED factors of the Altarelli-Parisi kernel and of the azimuthal terms of each configuration"
  outputs:
