    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: gs
      type: [float]
      desc: "Jacobian dr/ds"
  desc: "Inverse of `stable_invariant`. Building block of @ref Invariant."

stable_invariant_nu:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: mass
      type: [float, single]
      desc: "pole mass"
    - name: nu
      type: [float, single]
