      desc: "flag marking on-shell propagators per channel"
    - name: group_sizes
      type: [int, single, g]
      desc: "number of subchannels in each channel group"
  outputs:
    - name: channel_weights
      type: [float, c]
      desc: "normalized weight per subchannel"
  desc: "Channel weights refined into subchannel weights using on-shell information. Building block of @ref SubchannelWeights."

apply_subchannel_weights:
  inputs:
    - name: channel_weights_in
      type: [float, c]
      desc: "weight per channel"
    - name: subchannel_weights
      type: [float, n]
      desc: "weight per subchannel"
    - name: channel_indices
      type: [int, d]
      desc: "channel index per diagram"
    - name: subchannel_indices
      type: [int, d]
      desc: "subchannel index per diagram"
  outputs:
    - name: channel_weights_out
      type: [float, d]
      desc: "weight per diagram"
  desc: "Combines channel and subchannel weights into a per-diagram weight. Building block of @ref SubchannelWeights."

compress_channel_weights:
  inputs:
    - name: channel_index
      type: [int]
      desc: "index of the current channel"
    - name: channel_weights
      type: [float, n]
      desc: "dense weight per channel"
    - name: keep_count
      type: [size, k]
      desc: "number of channels to keep"
  outputs:
    - name: chan_weight_values
      type: [float, k]
      desc: "the kept weights"
    - name: chan_weight_indices
      type: [int, k]
      desc: "channel index of each kept weight"
  desc: "Keeps only the largest channel weights, returning them as a sparse list. Building block of @ref PropagatorChannelWeights."

restore_channel_weights:
  inputs:
    - name: chan_weight_values
      type: [float, k]
      desc: "the kept weights"
    - name: chan_weight_indices
      type: [int, k]
      desc: "channel index of each kept weight"
    - name: full_count
      type: [size, n]
      desc: "length of the dense weight vector"
  outputs:
    - name: channel_weights
      type: [float, n]
      desc: "dense weight per channel"
  desc: "Inverse of `compress_channel_weights`: expands the sparse weights back to a dense vector. Building block of @ref PropagatorChannelWeights."

pt_eta_phi_x:
  inputs:
    - name: p_ext
      type: [float, n+2, 4]
      desc: "external four-momenta, including the two incoming particles"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  outputs:
    - name: output
      type: [float, 3n+2]
      desc: "flattened (pt, eta, phi) per final-state particle plus the two momentum fractions"
  desc: "Converts external momenta to the transverse-momentum, pseudorapidity, azimuth and momentum-fraction parametrization. Building block of @ref ChiliMapping."

mirror_momenta:
  inputs:
    - name: p_ext
      type: [float, n, 4]
      desc: "external four-momenta"
    - name: mirror
      type: [int]
      desc: "per-event flag selecting whether to reflect"
  outputs:
    - name: p_mirror
      type: [float, n, 4]
      desc: "the possibly reflected momenta"
  desc: "Optionally reflects the momenta along the beam axis to symmetrize the final state."

momenta_to_x1x2:
  inputs:
    - name: p_ext
      type: [float, n, 4]
      desc: "external four-momenta"
    - name: e_cm
      type: [float]
      desc: "hadronic center-of-mass energy"
  outputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  desc: "Recovers the beam momentum fractions from a set of external momenta."


---
title: Invariants

uniform_invariant:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: s
      type: [float]
      desc: "sampled invariant"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Samples a propagator invariant flat in s. Building block of @ref Invariant."

uniform_invariant_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Inverse of `uniform_invariant`. Building block of @ref Invariant."

breit_wigner_invariant:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: mass
      type: [float]
      desc: "resonance mass"
    - name: width
      type: [float]
      desc: "resonance width"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: s
      type: [float]
      desc: "sampled invariant"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Samples a propagator invariant with a Breit-Wigner density around the pole mass. Building block of @ref Invariant."

breit_wigner_invariant_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: mass
      type: [float]
      desc: "resonance mass"
    - name: width
      type: [float]
      desc: "resonance width"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Inverse of `breit_wigner_invariant`. Building block of @ref Invariant."

stable_invariant:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: mass
      type: [float]
      desc: "pole mass"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: s
      type: [float]
      desc: "sampled invariant"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Samples a propagator invariant with a 1/s power law around a stable pole. Building block of @ref Invariant."

stable_invariant_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: mass
      type: [float]
      desc: "pole mass"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Inverse of `stable_invariant`. Building block of @ref Invariant."

stable_invariant_nu:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: mass
      type: [float]
      desc: "pole mass"
    - name: nu
      type: [float]
      desc: "exponent of the power law"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: s
      type: [float]
      desc: "sampled invariant"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Samples a propagator invariant with a tunable 1/s^nu power law. Building block of @ref Invariant."

stable_invariant_nu_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: mass
      type: [float]
      desc: "pole mass"
    - name: nu
      type: [float]
      desc: "exponent of the power law"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Inverse of `stable_invariant_nu`. Building block of @ref Invariant."

---
title: Fast RAMBO on diet

fast_rambo_massless:
  inputs:
    - name: r
      type: [float, 3n-4]
      desc: "random numbers, one per phase-space degree of freedom"
    - name: e_cm
      type: [float]
      desc: "total center-of-mass energy"
    - name: p0
      type: [float, 4]
      desc: "total momentum of the system"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the n generated momenta"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "RAMBO-on-diet mapping to n massless momenta with a given total momentum. Building block of @ref FastRamboMapping."

fast_rambo_massless_inverse:
  inputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the n momenta"
    - name: e_cm
      type: [float]
      desc: "total center-of-mass energy"
  outputs:
    - name: r
      type: [float, 3n-4]
      desc: "random numbers, one per phase-space degree of freedom"
    - name: p0
      type: [float, 4]
      desc: "total momentum of the system"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Inverse of `fast_rambo_massless`. Building block of @ref FastRamboMapping."

fast_rambo_massless_com:
  inputs:
    - name: r
      type: [float, 3n-4]
      desc: "random numbers, one per phase-space degree of freedom"
    - name: e_cm
      type: [float]
      desc: "total center-of-mass energy"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the n generated momenta"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "RAMBO-on-diet mapping to n massless momenta in the center-of-mass frame. Building block of @ref FastRamboMapping."

fast_rambo_massive:
  inputs:
    - name: r
      type: [float, 3n-4]
      desc: "random numbers, one per phase-space degree of freedom"
    - name: e_cm
      type: [float]
      desc: "total center-of-mass energy"
    - name: masses
      type: [float, n]
      desc: "mass of each final-state particle"
    - name: p0
      type: [float, 4]
      desc: "total momentum of the system"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the n generated momenta"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "RAMBO-on-diet mapping to n massive momenta with a given total momentum. Building block of @ref FastRamboMapping."

fast_rambo_massive_inverse:
  inputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the n momenta"
    - name: e_cm
      type: [float]
      desc: "total center-of-mass energy"
    - name: masses
      type: [float, n]
      desc: "mass of each final-state particle"
  outputs:
    - name: r
      type: [float, 3n-4]
      desc: "random numbers, one per phase-space degree of freedom"
    - name: p0
      type: [float, 4]
      desc: "total momentum of the system"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Inverse of `fast_rambo_massive`. Building block of @ref FastRamboMapping."

fast_rambo_massive_com:
  inputs:
    - name: r
      type: [float, 3n-4]
      desc: "random numbers, one per phase-space degree of freedom"
    - name: e_cm
      type: [float]
      desc: "total center-of-mass energy"
    - name: masses
      type: [float, n]
      desc: "mass of each final-state particle"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "the n generated momenta"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "RAMBO-on-diet mapping to n massive momenta in the center-of-mass frame. Building block of @ref FastRamboMapping."

---
title: Cuts

cut_unphysical:
  inputs:
    - name: w_in
      type: [float]
      desc: "incoming weight"
    - name: p
      type: [float, n, 4]
      desc: "final-state momenta"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  outputs:
    - name: w_out
      type: [float]
      desc: "weight, set to zero for unphysical events"
  desc: "Zeroes the weight of events with unphysical momenta or momentum fractions. See @ref Cuts."

cut_one:
  inputs:
    - name: obs
      type: [float]
      desc: "observable value"
    - name: min
      type: [float]
      desc: "lower bound"
    - name: max
      type: [float]
      desc: "upper bound"
  outputs:
    - name: w
      type: [float]
      desc: "weight, zero when the observable is outside [min, max]"
  desc: "Zeroes the weight when a single observable falls outside its window. See @ref Cuts."

cut_all:
  inputs:
    - name: obs
      type: [float, n]
      desc: "observable values"
    - name: min
      type: [float]
      desc: "lower bound applied to each observable"
    - name: max
      type: [float]
      desc: "upper bound applied to each observable"
  outputs:
    - name: w
      type: [float]
      desc: "weight, zero unless all observables are in [min, max]"
  desc: "Zeroes the weight unless every observable in the vector is inside its window. See @ref Cuts."

cut_any:
  inputs:
    - name: obs
      type: [float, n]
      desc: "observable values"
    - name: min
      type: [float]
      desc: "lower bound applied to each observable"
    - name: max
      type: [float]
      desc: "upper bound applied to each observable"
  outputs:
    - name: w
      type: [float]
      desc: "weight, zero unless some observable is in [min, max]"
  desc: "Zeroes the weight unless at least one observable in the vector is inside its window. See @ref Cuts."

---
title: Energy scale

scale_transverse_energy:
  inputs:
    - name: momenta
      type: [float, n, 4]
      desc: "final-state momenta"
  outputs:
    - name: scale
      type: [float]
      desc: "the energy scale"
  desc: "Dynamical scale set to the summed transverse energy of the final state. See @ref EnergyScale."

scale_transverse_mass:
  inputs:
    - name: momenta
      type: [float, n, 4]
      desc: "final-state momenta"
  outputs:
    - name: scale
      type: [float]
      desc: "the energy scale"
  desc: "Dynamical scale set to the summed transverse mass of the final state. See @ref EnergyScale."

scale_half_transverse_mass:
  inputs:
    - name: momenta
      type: [float, n, 4]
      desc: "final-state momenta"
  outputs:
    - name: scale
      type: [float]
      desc: "the energy scale"
  desc: "Dynamical scale set to half the summed transverse mass of the final state. See @ref EnergyScale."

scale_partonic_energy:
  inputs:
    - name: momenta
      type: [float, n, 4]
      desc: "final-state momenta"
  outputs:
    - name: scale
      type: [float]
      desc: "the energy scale"
  desc: "Dynamical scale set to the partonic center-of-mass energy. See @ref EnergyScale."

---
title: Chili

chili_forward:
  inputs:
    - name: r
      type: [float, 3n-2]
      desc: "random numbers, one per phase-space degree of freedom"
    - name: e_cm
      type: [float]
      desc: "hadronic center-of-mass energy"
    - name: m_out
      type: [float, n]
      desc: "mass of each final-state particle"
    - name: pt_min
      type: [float, n]
      desc: "minimum transverse momentum per final-state particle"
    - name: y_max
      type: [float, n]
      desc: "maximum rapidity per final-state particle"
  outputs:
    - name: p_ext
      type: [float, n+2, 4]
      desc: "external momenta, incoming particles first"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Chili hadron-collider mapping from the unit hypercube to external momenta. Building block of @ref ChiliMapping."

chili_inverse:
  inputs:
    - name: p_ext
      type: [float, n+2, 4]
      desc: "external momenta, incoming particles first"
    - name: e_cm
      type: [float]
      desc: "hadronic center-of-mass energy"
    - name: m_out
      type: [float, n]
      desc: "mass of each final-state particle"
    - name: pt_min
      type: [float, n]
      desc: "minimum transverse momentum per final-state particle"
    - name: y_max
      type: [float, n]
      desc: "maximum rapidity per final-state particle"
  outputs:
    - name: r
      type: [float, 3n-2]
      desc: "random numbers, one per phase-space degree of freedom"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Inverse of `chili_forward`. Building block of @ref ChiliMapping."

---
title: Interface to ME and PDF

matrix_element:
  inputs: any
  outputs: any
  class: MatrixElementInstruction
  custom_op: True
  desc: "Evaluates a loaded matrix element on a batch of momenta. See @ref MatrixElement."

collect_channel_weights:
  inputs:
    - name: amp2
      type: [float, n]
      desc: "squared amplitude per diagram"
    - name: channel_indices
      type: [int, single, n]
      desc: "channel index of each diagram"
    - name: channel_count
      type: [size, c]
      desc: "number of channels"
  outputs:
    - name: channel_weights
      type: [float, c]
      desc: "weight per channel"
  desc: "Sums squared amplitudes into per-channel weights. Building block of @ref PropagatorChannelWeights."

interpolate_pdf:
  inputs:
    - name: x
      type: [float]
      desc: "momentum fraction"
    - name: q
      type: [float]
      desc: "factorization scale"
    - name: pid_indices
      type: [int, n]
      desc: "grid index for each requested parton flavour"
    - name: grid_logx
      type: [float, single, a]
      desc: "log-x grid nodes"
    - name: grid_logq2
      type: [float, single, b]
      desc: "log-Q2 grid nodes"
    - name: grid_coeffs
      type: [float, single, 16, c, d]
      desc: "bicubic interpolation coefficients"
  outputs:
    - name: pdf
      type: [float, n]
      desc: "PDF value per requested flavour"
  vectorized: False
  desc: "Evaluates parton densities by bicubic interpolation of a log-x / log-Q2 grid. See @ref PartonDensity."

interpolate_alpha_s:
  inputs:
    - name: q
      type: [float]
      desc: "renormalization scale"
    - name: grid_logq2
      type: [float, single, b+1]
      desc: "log-Q2 grid nodes"
    - name: grid_coeffs
      type: [float, single, 4, b]
      desc: "cubic interpolation coefficients"
  outputs:
    - name: alpha_s
      type: [float]
      desc: "the strong coupling at q"
  vectorized: False
  desc: "Evaluates the running coupling by cubic interpolation of a log-Q2 grid. See @ref RunningCoupling."

---
title: Normalizing flows and MLPs

matmul:
  inputs:
    - name: x
      type: [float, n]
      desc: "input vector"
      backward_arg: True
    - name: weight
      type: [float, single, m, n]
      desc: "weight matrix"
      backward_arg: True
    - name: bias
      type: [float, single, m]
      desc: "bias vector"
  outputs:
    - name: y
      type: [float, m]
      desc: "the affine transform of the input"
  custom_op: True
  differentiable: True
  desc: "Affine layer y = weight x + bias. Building block of @ref MLP."

relu:
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise ReLU activation. Building block of @ref MLP."

leaky_relu:
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise leaky ReLU activation. Building block of @ref MLP."

elu:
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise ELU activation. Building block of @ref MLP."

gelu:
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise GELU activation. Building block of @ref MLP."

sigmoid:
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      backward_arg: True
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise sigmoid activation. Building block of @ref MLP."

scaled_tanh:
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      backward_arg: True
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise scaled hyperbolic tangent activation. Building block of @ref MLP."

softplus:
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise softplus activation. Building block of @ref MLP."

rqs_reshape:
  inputs:
    - name: input
      desc: "raw spline parameters from the subnetwork"
    - name: bin_count
      desc: "number of spline bins"
  outputs:
    - name: widths
      desc: "normalized bin widths"
    - name: heights
      desc: "normalized bin heights"
    - name: derivatives
      desc: "knot derivatives"
  class: RqsReshapeInstruction
  differentiable: True
  custom_op: True
  desc: "Reshapes raw network outputs into rational-quadratic-spline bin widths, heights and derivatives. Building block of @ref Flow."

rqs_find_bin:
  inputs:
    - name: input
      type: [float, n]
      desc: "values to be transformed"
    - name: in_sizes
      type: [float, n, b]
      desc: "cumulative input-side bin sizes"
    - name: out_sizes
      type: [float, n, b]
      desc: "cumulative output-side bin sizes"
    - name: derivatives
      type: [float, n, b+1]
      desc: "knot derivatives"
  outputs:
    - name: condition
      type: [float, n, 6]
      desc: "packed spline parameters for the active bin"
  differentiable: True
  dims: 2
  desc: "Builds the per-element spline condition by locating the active bin. Building block of @ref Flow."

rqs_forward:
  inputs:
    - name: input
      type: [float, n]
      desc: "values to transform"
    - name: condition
      type: [float, n, 6]
      desc: "packed spline parameters"
  outputs:
    - name: output
      type: [float, n]
      desc: "transformed values"
    - name: det
      type: [float, n]
      desc: "per-element Jacobian"
  differentiable: True
  dims: 2
  desc: "Applies a rational-quadratic spline in the forward direction. Building block of @ref Flow."

rqs_inverse:
  inputs:
    - name: input
      type: [float, n]
      desc: "values to transform"
    - name: condition
      type: [float, n, 6]
      desc: "packed spline parameters"
  outputs:
    - name: output
      type: [float, n]
      desc: "transformed values"
    - name: det
      type: [float, n]
      desc: "per-element Jacobian"
  differentiable: True
  dims: 2
  desc: "Applies a rational-quadratic spline in the inverse direction. Building block of @ref Flow."

softmax:
  inputs:
    - name: input
      type: [float, ...]
      desc: "logits"
  outputs:
    - name: output
      type: [float, ...]
      desc: "normalized probabilities"
      backward_arg: True
  differentiable: True
  dims: 0
  desc: "Softmax over the last dimension. Building block of @ref DiscreteSampler."

softmax_prior:
  inputs:
    - name: input
      type: [float, n]
      desc: "logits"
    - name: prior
      type: [float, n]
      desc: "prior probabilities"
  outputs:
    - name: output
      type: [float, n]
      desc: "normalized probabilities"
      backward_arg: True
  differentiable: True
  desc: "Softmax over the last dimension reweighted by a prior. Building block of @ref DiscreteSampler."

---
title: Discrete sampling

sample_discrete:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: option_count
      type: [int]
      desc: "number of choices"
  outputs:
    - name: output
      type: [int]
      desc: "sampled index"
    - name: det
      type: [float]
      desc: "probability of the sampled index"
  desc: "Samples a uniform discrete choice from a random number. Building block of @ref DiscreteSampler."

sample_discrete_inverse:
  inputs:
    - name: index
      type: [int]
      desc: "index"
    - name: option_count
      type: [int, single]
      desc: "number of choices"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: det
      type: [float]
      desc: "probability of the index"
  desc: "Inverse of `sample_discrete`. Building block of @ref DiscreteSampler."

sample_discrete_probs:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: probs
      type: [float, n]
      desc: "probability of each choice"
  outputs:
    - name: output
      type: [int]
      desc: "sampled index"
    - name: det
      type: [float]
      desc: "probability of the sampled index"
  desc: "Samples a discrete choice from a given probability vector. Building block of @ref DiscreteFlow."

sample_discrete_probs_inverse:
  inputs:
    - name: index
      type: [int]
      desc: "index"
    - name: probs
      type: [float, n]
      desc: "probability of each choice"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: det
      type: [float]
      desc: "probability of the index"
  differentiable: True
  desc: "Inverse of `sample_discrete_probs`. Building block of @ref DiscreteFlow."

discrete_histogram:
  inputs:
    - name: input
      type: [int]
      desc: "discrete value per event"
    - name: weights
      type: [float]
      desc: "event weight"
    - name: option_count
      type: [size, n]
      desc: "number of bins"
  outputs:
    - name: values
      type: [float, single, n]
      desc: "summed weight per bin"
    - name: counts
      type: [int, single, n]
      desc: "event count per bin"
  custom_op: True
  desc: "Accumulates a weighted histogram over a discrete variable. Building block of @ref DiscreteHistogram."

permute_momenta:
  inputs:
    - name: momenta
      type: [float, n, 4]
      desc: "input momenta"
    - name: permutations
      type: [int, single, m, n]
      desc: "table of permutations"
    - name: index
      type: [int]
      desc: "permutation index per event"
  outputs:
    - name: output
      type: [float, n, 4]
      desc: "permuted momenta"
  desc: "Reorders momenta according to a stored permutation selected per event. Building block of @ref MultiChannelMapping."

gather:
  inputs:
    - name: index
      type: [int]
      desc: "index to select"
      backward_arg: True
    - name: choices
      type: [float, n]
      desc: "vector of choices"
  outputs:
    - name: output
      type: [float]
      desc: "the selected entry"
  differentiable: True
  desc: "Selects one entry per event from a vector of float choices."

gather_int:
  inputs:
    - name: index
      type: [int]
      desc: "index to select"
    - name: choices
      type: [int, n]
      desc: "vector of choices"
  outputs:
    - name: output
      type: [int]
      desc: "the selected entry"
  desc: "Selects one entry per event from a vector of integer choices."

gather_vector:
  inputs:
    - name: index
      type: [int]
      desc: "row index to select"
    - name: choices
      type: [float, n, m]
      desc: "matrix of choices"
  outputs:
    - name: output
      type: [float, m]
      desc: "the selected row"
  vectorized: False
  desc: "Selects one row per event from a matrix of choices."

select_int:
  inputs:
    - name: input
      type: [int, n]
      desc: "source vector"
    - name: indices
      type: [int, m]
      desc: "indices to gather"
  outputs:
    - name: output
      type: [int, m]
      desc: "gathered entries"
  desc: "Gathers several entries from an integer vector by index."

select:
  inputs:
    - name: input
      type: [float, n]
      desc: "source vector"
    - name: indices
      type: [int, m]
      desc: "indices to gather"
      backward_arg: True
  outputs:
    - name: output
      type: [float, m]
      desc: "gathered entries"
  differentiable: True
  desc: "Gathers several entries from a float vector by index."

select_vector:
  inputs:
    - name: input
      type: [float, n, k]
      desc: "source matrix"
    - name: indices
      type: [int, m]
      desc: "row indices to gather"
  outputs:
    - name: output
      type: [float, m, k]
      desc: "gathered rows"
  vectorized: False
  desc: "Gathers several rows from a matrix by index."

argsort:
  inputs:
    - name: input
      type: [float, n]
      desc: "vector to sort"
  outputs:
    - name: indices
      type: [int, n]
      desc: "permutation that sorts the input"
  vectorized: False
  desc: "Indices that sort a vector in ascending order."

quantile:
  inputs:
    - name: input
      type: [float]
      desc: "value per event"
    - name: q
      type: [float, single]
      desc: "quantile level in [0, 1]"
  outputs:
    - name: output
      type: [float, single]
      desc: "the estimated quantile"
  custom_op: True
  desc: "Estimates a quantile of a value over the batch."

one_hot:
  inputs:
    - name: index
      type: [int]
      desc: "index to encode"
    - name: option_count
      type: [size, n]
      desc: "length of the one-hot vector"
  outputs:
    - name: output
      type: [float, n]
      desc: "one-hot vector"
  desc: "One-hot encoding of a discrete index."

madnis_abs_weight:
  inputs:
    - name: f
      type: [float]
      desc: "integrand value"
    - name: q
      type: [float]
      desc: "sampling density"
  outputs:
    - name: w
      type: [float]
      desc: "absolute weight f / q"
  differentiable: True
  desc: "Absolute integrand contribution used by the MadNIS loss. Building block of @ref MadnisLoss."

madnis_softclip:
  inputs:
    - name: f
      type: [float]
      desc: "integrand value"
    - name: q
      type: [float]
      desc: "sampling density"
    - name: norm
      type: [float]
      desc: "normalization used for the clip threshold"
    - name: threshold
      type: [float]
      desc: "relative clipping threshold"
  outputs:
    - name: f_clip
      type: [float]
      desc: "softly clipped integrand"
  differentiable: True
  desc: "Softly clips the integrand to limit large weights during training. Building block of @ref MadnisLoss."

madnis_variance:
  inputs:
    - name: f
      type: [float]
      desc: "integrand value"
    - name: g
      type: [float]
      desc: "trained sampling density"
    - name: q
      type: [float]
      desc: "sampling density used to draw the event"
    - name: mean
      type: [float]
      desc: "running estimate of the integral"
  outputs:
    - name: w
      type: [float]
      desc: "per-event variance contribution"
  differentiable: True
  desc: "Per-event contribution to the variance loss. Building block of @ref MadnisLoss."

madnis_single_channel_variance:
  inputs:
    - name: var
      type: [float]
      desc: "running variance estimate"
    - name: abs_mean
      type: [float]
      desc: "running mean of the absolute weight"
      backward_arg: True
  outputs:
    - name: loss
      type: [float]
      desc: "the variance loss"
  differentiable: True
  desc: "Single-channel variance loss from its running moments. Building block of @ref MadnisLoss."

madnis_multi_channel_variance:
  inputs:
    - name: vars
      type: [float, c]
      desc: "running variance estimate per channel"
    - name: abs_means
      type: [float, c]
      desc: "running mean of the absolute weight per channel"
  outputs:
    - name: loss
      type: [float]
      desc: "the variance loss"
  differentiable: True
  desc: "Multi-channel variance loss summed over channels. Building block of @ref MadnisLoss."

---
title: Indexing

nonzero:
  inputs:
    - name: input
      desc: "mask, nonzero where an event is kept"
  outputs:
    - name: indices
      desc: "batch indices of the kept events"
  class: NonzeroInstruction
  custom_op: True
  desc: "Indices of the nonzero entries of a batched mask."

batch_gather:
  inputs:
    - name: indices
      desc: "batch indices to keep"
    - name: values
      desc: "values to select from"
  outputs:
    - name: selection
      desc: "the selected events"
  class: BatchGatherInstruction
  custom_op: True
  desc: "Selects events from a batch by index."

batch_scatter:
  inputs:
    - name: indices
      desc: "target batch indices"
    - name: target
      desc: "batch to write into"
    - name: source
      desc: "events to write"
  outputs:
    - name: output
      desc: "the updated batch"
  class: BatchScatterInstruction
  custom_op: True
  desc: "Writes source events into a target batch at the given indices."

---
title: Random numbers

random:
  inputs:
    - name: batch_size
      desc: "batch size to generate"
    - name: count
      desc: "random numbers per event"
  outputs:
    - name: output
      desc: "uniform random numbers in [0, 1]"
  class: RandomInstruction
  custom_op: True
  desc: "Draws a batch of uniform random numbers."

random_int:
  inputs:
    - name: batch_size
      desc: "batch size to generate"
    - name: max
      desc: "exclusive upper bound"
  outputs:
    - name: output
      desc: "random integers in [0, max)"
  class: RandomIntInstruction
  custom_op: True
  desc: "Draws a batch of uniform random integers."

unweight:
  inputs:
    - name: weights
      desc: "event weights"
    - name: max_weight
      desc: "maximum weight used for the acceptance test"
  outputs:
    - name: indices
      desc: "batch indices of the accepted events"
    - name: uw_weights
      desc: "residual weights of the accepted events"
  class: UnweightInstruction
  custom_op: True
  desc: "Accept/reject unweighting against a maximum weight. See @ref Unweighter."

---
title: VEGAS

vegas_forward:
  inputs:
    - name: input
      type: [float, n]
      desc: "points in the unit hypercube"
    - name: grid
      type: [float, single, n, b]
      desc: "VEGAS bin edges per dimension"
  outputs:
    - name: output
      type: [float, n]
      desc: "remapped points"
    - name: det
      type: [float, n]
      desc: "per-dimension Jacobian"
  dims: 2
  desc: "Applies the VEGAS grid mapping in the forward direction. Building block of @ref VegasMapping."

vegas_inverse:
  inputs:
    - name: input
      type: [float, n]
      desc: "remapped points"
    - name: grid
      type: [float, single, n, b]
      desc: "VEGAS bin edges per dimension"
  outputs:
    - name: output
      type: [float, n]
      desc: "points in the unit hypercube"
    - name: det
      type: [float, n]
      desc: "per-dimension Jacobian"
  dims: 2
  desc: "Inverse of `vegas_forward`. Building block of @ref VegasMapping."

vegas_histogram:
  inputs:
    - name: input
      type: [float, n]
      desc: "points in the unit hypercube"
    - name: weights
      type: [float]
      desc: "event weight"
    - name: bin_count
      type: [size, b]
      desc: "number of grid bins per dimension"
  outputs:
    - name: values
      type: [float, single, n, b]
      desc: "summed weight per bin and dimension"
    - name: counts
      type: [int, single, n, b]
      desc: "event count per bin and dimension"
  custom_op: True
  desc: "Accumulates the weighted histograms VEGAS uses to refine its grid. Building block of @ref VegasHistogram."

histogram:
  inputs:
    - name: input
      type: [float, ...]
      desc: "value per event"
    - name: weights
      type: [float]
      desc: "event weight"
    - name: min
      type: [float]
      desc: "lower edge of the histogram range"
    - name: max
      type: [float]
      desc: "upper edge of the histogram range"
    - name: bin_count
      type: [size, b]
      desc: "number of interior bins"
  outputs:
    - name: values
      type: [float, single, b+2]
      desc: "summed weight per bin, with underflow and overflow"
    - name: square_values
      type: [float, single, b+2]
      desc: "summed squared weight per bin, for the statistical error"
  custom_op: True
  desc: "Accumulates a weighted histogram with underflow and overflow bins. See @ref Histogram."
