      desc: "momentum fraction of the splitting"
    - name: ap
      type: [float, 2]
      desc: "QCD and QED Altarelli-Parisi kernels (1 - z) P(z) / t of AP_reduced, without the couplings"
    - name: q
      type: [float, 2]
      desc: "QCD and QED azimuthal terms of Qterms_reduced_timelike or Qterms_reduced_spacelike, without the couplings"
  vectorized: False
  desc: "The collinear factors of sborncol_fsr and sborncol_isr in fks_singular.f: z = 1 - E_i / (E_i + E_j) in the partonic center-of-mass frame for a final-state j, 1 - xi = 1 - 2 E_i / sqrt(s) for an initial-state one, the Altarelli-Parisi kernel of the splitting and its azimuthal terms, timelike for a final-state j and spacelike for an initial-state one, with t = z s / 4 and without the couplings. With the resonance-local recoil (sborncol_fsr of its MadGraph7 branch), the energies and s of a final-state j are those in the rest frame of the momentum k of the resonance where the event has one, t = z k^2 / 4."

