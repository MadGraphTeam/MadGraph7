    - name: index
      type: [int]
      desc: "FKS configuration of the event"
    - name: symmetry
      type: [float, single, c]
      desc: "symmetry factor of each configuration"
    - name: options
      type: [float, single, 2]
      desc: "xiScut and deltaS of fks_powers.inc"
  outputs:
    - name: real_out
      type: [float, o]
      desc: "contribution of the real emission per NLO order, per unit weight of the event"
    - name: soft_out
      type: [float, o]
      desc: "contribution of the soft counterterm per NLO order, per unit Jacobian of its counter-event"
    - name: collinear_out
      type: [float, o]
      desc: "contribution of the collinear counterterm per NLO order, per unit Jacobian of its counter-event"
    - name: soft_collinear_out
      type: [float, o]
      desc: "contribution of the soft-collinear counterterm per NLO order, per unit Jacobian of its counter-event"
  vectorized: False
  desc: "The real emission and its FKS counterterms per NLO order with their sector functions, prefactors, signs, symmetry factors and conditions, as compute_real_emission and compute_soft_counter_term and its siblings in fks_singular.f, the collinear remnants added to the collinear counterterms: the soft counterterm where xi_hat xi_max_s <= xiScut and xi <= xiScut, the collinear one where y > 1 - deltaS, the soft-collinear one where both xi_hat xi_max_c and xi_c are below xiScut and y > 1 - deltaS, each zero where its momenta are not generated."

fks_soft_virtual:
  inputs:
    - name: momenta
      type: [float, n, 4]
      desc: "momenta of the Born"
    - name: born
      type: [float, b]
      desc: "the Born per Born order"
    - name: color_correlated
      type: [float, b, n, n]
      desc: "color-correlated Borns <T_a . T_b> B of the particles a, b of the Born (C_a B for a = b) per Born order"
    - name: alpha_s
      type: [float]
      desc: "strong coupling"
    - name: alpha
      type: [float]
      desc: "QED coupling"
    - name: ren_scale
      type: [float]
      desc: "renormalization scale, also the Ellis-Sexton scale"
    - name: fact_scale1
      type: [float]
      desc: "factorization scale of the first beam"
    - name: fact_scale2
      type: [float]
      desc: "factorization scale of the second beam"
    - name: casimir
      type: [float, single, 2, n]
      desc: "QCD and QED factor C of each particle of the Born: C_A and C_F for a massless gluon and quark, Q^2 for a massless charged particle, zero for the other particles"
    - name: gamma
      type: [float, single, 2, n]
      desc: "QCD and QED gamma of FKS of each particle of the Born, zero for those without Q terms"
    - name: gamma_prime
      type: [float, single, 2, n]
      desc: "QCD and QED gamma' of FKS of each particle of the Born, zero for those without Q terms"
    - name: masses
      type: [float, single, n]
      desc: "mass of each particle of the Born"
    - name: pair_m
      type: [int, single, 2, k]
      desc: "position of m of each pair of color-linked (QCD) or charge-linked (QED) particles in the Born"
    - name: pair_n
      type: [int, single, 2, k]
      desc: "position of n of each pair in the Born"
    - name: pair_factor
      type: [float, single, 2, k]
      desc: "factor of each pair, -2 and -1 for a massive particle with itself, times eta_m Q_m eta_n Q_n for QED, zero for padding"
    - name: born_index
      type: [int, single, 2, o]
      desc: "Born order of the QCD and QED counterterms at each NLO order, -1 for none"
    - name: ren_factor
      type: [float, single, o]
      desc: "b gamma_g at each NLO order with the power b of alpha_s of the Born of its QCD counterterms"
    - name: options
      type: [float, single, 2]
      desc: "xicut and deltaO of fks_powers.inc"
  outputs:
    - name: soft_virtual
      type: [float, o]
      desc: "the n-body part without the Born and the virtual per NLO order"
    - name: ren_coefficient
      type: [float, o]
      desc: "coefficient of log mu_R^2 at a fixed virtual per NLO order"
    - name: fact_coefficients
      type: [float, o, 2]
      desc: "coefficients of log mu_F^2 of the two beams per NLO order"
  vectorized: False
  desc: "The n-body part of bornsoftvirtual in fks_singular.f without the virtual per NLO order, for QCD and QED and with the Ellis-Sexton scale at mu_R. With a = alpha_s / (2 pi) for QCD and alpha / (2 pi) for QED and the Born B of the order of the counterterms, each is a B sum_j Q_j over the massless particles with Q terms plus a sum_(m, n) f_mn L_mn I_mn over the pairs of linked particles, with L_mn = <T_m . T_n> B for QCD and B for QED and the integrated eikonals I_mn of eikonal_Ireg. Q_j = gamma'_j - log(s deltaO / (2 mu_R^2)) (gamma_j - 2 C_j log(2 E_j / (xicut sqrt_s))) + 2 C_j (log^2(2 E_j / sqrt_s) - log^2 xicut) - 2 gamma_j log(2 E_j / sqrt_s) for a final-state particle with its energy in the partonic center-of-mass frame, -log(mu_F^2 / mu_R^2) (gamma_j + 2 C_j log xicut) for an incoming one with the factorization scale of its beam. The coefficients of log mu_R^2 and log mu_F^2 of the weight lines of MadFKS are a b gamma_g B of QCD and the sum of -a (gamma_j + 2 C_j log xicut) B over QCD and QED."

ew_sudakov:
  inputs:
    - name: momenta
      type: [float, n, 4]
      desc: "momenta of the Born"
    - name: diagonal
      type: [float, h]
      desc: "|M_h|^2 of the base amplitude of each helicity combination at the LO1"
    - name: lo2
      type: [float, h]
      desc: "the same at the LO2"
    - name: derivatives
      type: [float, h, 6]
      desc: "derivatives of diagonal with respect to the parameters of numder_*.f"
    - name: interference
      type: [float, t, 2]
      desc: "real and imaginary parts of the interferences of the interference terms at the LO1"
    - name: alpha_s
      type: [float]
      desc: "strong coupling"
    - name: ren_scale
      type: [float]
      desc: "renormalization scale"
    - name: signs
      type: [float, single, n]
      desc: "-1 for an incoming particle, 1 for an outgoing one"
    - name: modes
      type: [int, single, m, 2]
      desc: "s_to_rij and rij_ge_mw of each mode"
    - name: diagonal_coefficients
      type: [float, single, m, h, c]
      desc: "factors of the logarithms (L, l, then F and G of every pair (i, j) with j < i) in the coefficient of each helicity combination in each mode, the real and imaginary part of each one after the other"
    - name: interference_coefficients
      type: [float, single, m, t, c]
      desc: "the same for each interference term"
    - name: par_coefficients
      type: [float, single, 6]
      desc: "parameter renormalisation of each derivative per unit l"
    - name: qcd_coefficients
      type: [float, single, 2]
      desc: "factors of log(mu_R^2 / m_t^2) and log(s / m_t^2) of the QCD part per unit alpha_s / (2 pi)"
    - name: options
      type: [float, single, 4]
      desc: "M_W^2, M_Z^2, m_t^2 and alpha / (4 pi)"
  outputs:
    - name: sudakov
      type: [float, m]
      desc: "the Sudakov approximation of the EW corrections in each mode"
  vectorized: False
  desc: "The Sudakov approximation of the EW corrections of ewsudakov_wrapper.f and ewsudakov_functions.f, without the factor f_b / g^k of compute_ewsudakov. With a = alpha / (4 pi), L = a log^2(s / M_W^2), l = a log(s / M_W^2) and for every pair the invariant r of sdk_get_invariants (set to +-M_W^2 below it in size with rij_ge_mw), ell = log(|r| / s) and i pi = -i pi for r > 0, F = 2 l (ell + i pi) + a (ell^2 + 2 ell i pi) and G = 2 a ell log(M_W^2 / M_Z^2), the second terms only with s_to_rij. The coefficients C are the combinations of these with the factors of the tables, and the correction is 2 Re(sum_h C_h diagonal_h + sum_t C_t interference_t) + l sum_h sum_p par_p derivatives_hp + 2 Q sum_h lo2_h with Q = alpha_s / (2 pi) (q_1 log(mu_R^2 / m_t^2) + q_2 log(s / m_t^2))."

---
title: Invariants

uniform_invariant:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: s
      type: [float]
      desc: "sampled invariant"
    - name: gs
      type: [float]
      desc: "Jacobian ds/dr"
  desc: "Samples a propagator invariant uniformly in [s_min, s_max]. Building block of @ref Invariant."

uniform_invariant_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: gs
      type: [float]
      desc: "Jacobian dr/ds"
  desc: "Inverse of `uniform_invariant`. Building block of @ref Invariant."

breit_wigner_invariant:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: mass
      type: [float, single]
      desc: "resonance mass"
    - name: width
      type: [float, single]
      desc: "resonance width"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: s
      type: [float]
      desc: "sampled invariant"
    - name: gs
      type: [float]
      desc: "Jacobian ds/dr"
  desc: "Samples a propagator invariant with a Breit-Wigner density around the pole mass. Building block of @ref Invariant."

breit_wigner_invariant_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: mass
      type: [float, single]
      desc: "resonance mass"
    - name: width
      type: [float, single]
      desc: "resonance width"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: gs
      type: [float]
      desc: "Jacobian dr/ds"
  desc: "Inverse of `breit_wigner_invariant`. Building block of @ref Invariant."

flat_window_breit_wigner_invariant:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: mass
      type: [float, single]
      desc: "resonance mass"
    - name: width
      type: [float, single]
      desc: "resonance width"
    - name: window
      type: [float, single]
      desc: "half-width of the flattened window, in units of the width"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: s
      type: [float]
      desc: "sampled invariant"
    - name: gs
      type: [float]
      desc: "Jacobian ds/dr"
  desc: "Samples a propagator invariant with a Breit-Wigner density whose peak is flattened to a constant (the mean of its two edge values) inside |sqrt(s) - mass| < window * width (the $-excluded region). Building block of @ref Invariant."

flat_window_breit_wigner_invariant_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: mass
      type: [float, single]
      desc: "resonance mass"
    - name: width
      type: [float, single]
      desc: "resonance width"
    - name: window
      type: [float, single]
      desc: "half-width of the flattened window, in units of the width"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: gs
      type: [float]
      desc: "Jacobian dr/ds"
  desc: "Inverse of `flat_window_breit_wigner_invariant`. Building block of @ref Invariant."

stable_invariant:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: mass
      type: [float, single]
      desc: "pole mass"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: s
      type: [float]
      desc: "sampled invariant"
    - name: gs
      type: [float]
      desc: "Jacobian ds/dr"
  desc: "Samples a propagator invariant with a 1/(s - m^2 + 0.01) density, the pole shifted slightly below m^2. Building block of @ref Invariant."

stable_invariant_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: mass
      type: [float, single]
      desc: "pole mass"
    - name: s_min
      type: [float]
