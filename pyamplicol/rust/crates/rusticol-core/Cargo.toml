[package]
name = "rusticol-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["f64-compiled", "f64-symjit"]
f64-compiled = ["dep:libloading", "dep:num-complex", "dep:symjit"]
f64-symjit = ["dep:num-complex", "dep:symjit"]
# Unstable cross-crate bridge for artifact generation and the native loop
# consumer. It is intentionally absent from the default feature set.
python-generation-bridge = ["f64-symjit"]
# Non-default parity seam for the private Python development harness.  This
# feature is deliberately absent from production/default builds.
on-the-fly-test-support = ["f64-symjit"]
symbolica-runtime = ["dep:symbolica", "dep:pyamplicol", "dep:tracing", "dep:tracing-subscriber"]
# Native core of the loop engine v2: plan v4 and its executor (open-loop
# polynomials in the NinjaRS tensor layout). Enabled by the loop consumer
# (rusticol-loop-reduction), so the native extension ships it.
loop-v2 = ["dep:brotli", "dep:flate2", "dep:ninjars", "symbolica-runtime", "f64-symjit"]
# TIRust's capability query in the loop engine's rank admission (m-lit
# lit-eft: families beyond NinjaRS's rank <= N+2 are admitted when TIRust
# reduces them; `loop_v2::bounds`). Not the TIRust backend (the default
# feature `tir` of the crates that link it): enabled only by the loop
# consumer's `tir` (rusticol-loop-reduction), so a `--no-default-features`
# build links no TIRust; not a default here.
tirust-capability = ["loop-v2", "dep:iregi-rust"]

[dependencies]
bincode.workspace = true
# Symbolica's export stream (its own brotli version; `loop_v2::generate::state_rename`).
brotli = { version = "8.0", optional = true }
flate2 = { workspace = true, optional = true }
libloading = { version = "0.9", optional = true }
libc.workspace = true
ninjars = { git = "https://github.com/alphal00p/ninjars.git", rev = "e6c31af749ee571908af058584e94dd0b6c77e61", optional = true }
# The loop consumer's TIRust pin (rusticol-loop-reduction's `iregi-rust`, the
# same revision): its capability query only (feature `tir`).
iregi-rust = { git = "https://github.com/huashengshao/TIRust.git", rev = "2bba1b2502661a8170f7b00eed9afa2ed0ac3e78", optional = true }
# pyAmpliCol's Symbolica library key (the crate named after the package the
# key is issued for).
pyamplicol = { path = "../pyamplicol", optional = true }
num-complex = { version = "0.4", optional = true }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
symbolica = { workspace = true, optional = true }
symjit = { workspace = true, optional = true }
thiserror.workspace = true
# Symbolica's diagnostics on standard error (`diagnostics`; Symbolica's versions).
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"], optional = true }
wide.workspace = true

[[bench]]
name = "loop_v2_kernels"
harness = false
required-features = ["loop-v2"]

[[bench]]
name = "loop_v2_schedules"
harness = false
required-features = ["loop-v2"]

[[bench]]
name = "loop_v2_generation"
harness = false
required-features = ["loop-v2"]

[[bench]]
name = "loop_v2_dag"
harness = false
required-features = ["loop-v2"]
