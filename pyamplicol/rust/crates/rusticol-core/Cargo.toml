# SPDX-License-Identifier: 0BSD

[package]
name = "rusticol-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["f64-compiled", "f64-symjit"]
f64-compiled = ["dep:libloading", "dep:num-complex", "dep:symjit"]
f64-symjit = ["dep:num-complex", "dep:symjit"]
# Unstable cross-crate bridge for artifact generation and the native loop
# consumer. It is intentionally absent from the default feature set.
python-generation-bridge = ["f64-symjit"]
# Non-default parity seam for the private Python development harness.  This
# feature is deliberately absent from production/default builds.
on-the-fly-test-support = ["f64-symjit"]
symbolica-runtime = ["dep:symbolica"]
# Native core of the loop engine v2: plan v4 and its executor (open-loop
# polynomials in the NinjaRS tensor layout). Enabled by the loop consumer
# (rusticol-loop-reduction), so the native extension ships it.
loop-v2 = ["dep:ninjars", "symbolica-runtime"]

[dependencies]
bincode.workspace = true
flate2.workspace = true
libloading = { version = "0.9", optional = true }
libc.workspace = true
ninjars = { git = "https://github.com/alphal00p/ninjars.git", rev = "aa6a6307dd081dc3714f9accebc0df9e5561ae73", optional = true }
num-complex = { version = "0.4", optional = true }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
symbolica = { workspace = true, optional = true }
symjit = { workspace = true, optional = true }
thiserror.workspace = true
wide.workspace = true

[[bench]]
name = "loop_v2_kernels"
harness = false
required-features = ["loop-v2"]

[[bench]]
name = "loop_v2_schedules"
harness = false
required-features = ["loop-v2"]
