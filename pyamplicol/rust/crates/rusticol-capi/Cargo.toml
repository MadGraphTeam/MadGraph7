# SPDX-License-Identifier: 0BSD

[package]
name = "rusticol-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "rusticol_capi"
crate-type = ["staticlib", "rlib"]

[features]
default = []
# Link GMP, MPFR and MPC as shared libraries instead of building them into
# the binary (gmp-mpfr-sys use-system-libs). The build backend enables it
# for distributable wheels and supplies the libraries
# (build_backend/arithmetic.py); developer builds keep the static default.
shared-arithmetic = ["dep:gmp-mpfr-sys", "gmp-mpfr-sys/use-system-libs"]

[dependencies]
gmp-mpfr-sys = { workspace = true, optional = true }
rusticol-core = { path = "../rusticol-core", default-features = false, features = ["f64-compiled", "f64-symjit"] }
rusticol-loop-sdk = { path = "../../loop-reduction/sdk" }
serde_json.workspace = true
