# SPDX-License-Identifier: 0BSD

[package]
name = "rusticol-loop-reduction"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "0BSD"
publish = false

[dependencies]
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop.git", rev = "d1904bf2bd5bf4f26969a73b415095e941a55610", default-features = false, features = ["native"] }
pyamplicol = { path = "../crates/pyamplicol" }
rusticol-core = { path = "../crates/rusticol-core", features = ["symbolica-runtime", "python-generation-bridge", "loop-v2"] }
ninjars = { git = "https://github.com/alphal00p/ninjars.git", rev = "b3a29c8577733f384de1c74b48bde5b24c2799d3" }
ninjars-graph = { git = "https://github.com/alphal00p/ninjars.git", rev = "b3a29c8577733f384de1c74b48bde5b24c2799d3" }
ninjars-symbolica = { git = "https://github.com/alphal00p/ninjars.git", rev = "b3a29c8577733f384de1c74b48bde5b24c2799d3", features = ["native-masters"] }
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "128ea6645f2811e6179068b98731501292841409", default-features = false }
symbolica = { version = "=3.0.2", default-features = false, features = ["integer-gmp", "float-mpfr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
