# SPDX-License-Identifier: 0BSD

[package]
name = "rusticol-loop-reduction"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "0BSD"
publish = false

[dependencies]
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop.git", rev = "d1904bf2bd5bf4f26969a73b415095e941a55610", default-features = false, features = ["native"] }
rusticol-core = { path = "../crates/rusticol-core", features = ["symbolica-runtime", "python-generation-bridge", "loop-v2"] }
ninjars = { git = "https://github.com/alphal00p/ninjars.git", rev = "41a4c00e7635e3ab188fc26bacf0aae6941e8082" }
ninjars-graph = { git = "https://github.com/alphal00p/ninjars.git", rev = "41a4c00e7635e3ab188fc26bacf0aae6941e8082" }
ninjars-symbolica = { git = "https://github.com/alphal00p/ninjars.git", rev = "41a4c00e7635e3ab188fc26bacf0aae6941e8082", features = ["native-masters"] }
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "5b710437ada83cbc6e8c6d51e56f7d6ee6a0edb5", default-features = false }
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
