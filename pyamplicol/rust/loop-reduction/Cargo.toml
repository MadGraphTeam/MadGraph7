# SPDX-License-Identifier: 0BSD

[package]
name = "rusticol-loop-reduction"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "0BSD"
publish = false

# Standalone consumer workspace; dependencies are installable from ordinary Git pins.
[workspace]
resolver = "3"
members = ["python", "sdk"]

[dependencies]
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop.git", rev = "1e8063a763d3aa515749c33616ee59aa827705be", default-features = false, features = ["native"] }
rusticol-core = { path = "../crates/rusticol-core", features = ["symbolica-runtime", "python-generation-bridge"] }
ninjars = { git = "https://github.com/alphal00p/ninjars.git", rev = "0d0d7e7a8033431b60a8580731084742e0655cda" }
ninjars-graph = { git = "https://github.com/alphal00p/ninjars.git", rev = "0d0d7e7a8033431b60a8580731084742e0655cda" }
ninjars-symbolica = { git = "https://github.com/alphal00p/ninjars.git", rev = "0d0d7e7a8033431b60a8580731084742e0655cda", features = ["native-masters"] }
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "09b2c7497743db875ed446da95123175dd00b1c8", default-features = false }
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
symbolica = { git = "https://github.com/alphal00p/symbolica.git", rev = "e679e8c129ce15ec50c46ffb4ff4b59aeb7813b8" }
numerica = { git = "https://github.com/alphal00p/symbolica.git", rev = "e679e8c129ce15ec50c46ffb4ff4b59aeb7813b8" }
graphica = { git = "https://github.com/alphal00p/symbolica.git", rev = "e679e8c129ce15ec50c46ffb4ff4b59aeb7813b8" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
