# SPDX-License-Identifier: 0BSD

[package]
name = "rusticol-loop-reduction"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "0BSD"
publish = false

[dependencies]
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop.git", rev = "d1904bf2bd5bf4f26969a73b415095e941a55610", default-features = false, features = ["native"] }
pyamplicol = { path = "../crates/pyamplicol" }
rusticol-core = { path = "../crates/rusticol-core", features = ["symbolica-runtime", "python-generation-bridge", "loop-v2"] }
ninjars = { git = "https://github.com/alphal00p/ninjars.git", rev = "520b220b653d46266e7aa1417a3b941923812118" }
ninjars-graph = { git = "https://github.com/alphal00p/ninjars.git", rev = "520b220b653d46266e7aa1417a3b941923812118" }
ninjars-symbolica = { git = "https://github.com/alphal00p/ninjars.git", rev = "520b220b653d46266e7aa1417a3b941923812118", features = ["native-masters"] }
# One oneloop feature set in every root build (M-LIT PLAN §2.c.2 item 3, the Q28
# rule): NinjaRS's native masters need generated-evaluators, TIRust rust-codegen;
# rust-codegen only adds modules (rust_codegen, native::batch).
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "a7cf45876b2273f2c1b5dd1490d88abc07a6f287", default-features = false, features = ["generated-evaluators", "rust-codegen"] }
symbolica = { version = "=3.0.2", default-features = false, features = ["integer-gmp", "float-mpfr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
