# SPDX-License-Identifier: 0BSD

[package]
name = "rusticol-loop-reduction"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "0BSD"
publish = false

[dependencies]
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop.git", rev = "1e8063a763d3aa515749c33616ee59aa827705be", default-features = false, features = ["native"] }
rusticol-core = { path = "../crates/rusticol-core", features = ["symbolica-runtime", "python-generation-bridge", "loop-v2"] }
ninjars = { git = "https://github.com/alphal00p/ninjars.git", rev = "0d0d7e7a8033431b60a8580731084742e0655cda" }
ninjars-graph = { git = "https://github.com/alphal00p/ninjars.git", rev = "0d0d7e7a8033431b60a8580731084742e0655cda" }
ninjars-symbolica = { git = "https://github.com/alphal00p/ninjars.git", rev = "0d0d7e7a8033431b60a8580731084742e0655cda", features = ["native-masters"] }
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "09b2c7497743db875ed446da95123175dd00b1c8", default-features = false }
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
