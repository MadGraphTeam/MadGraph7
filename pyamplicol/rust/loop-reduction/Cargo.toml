# SPDX-License-Identifier: 0BSD

[package]
name = "rusticol-loop-reduction"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "0BSD"
publish = false

[features]
# TIRust (huashengshao/TIRust), the tensor-integral reduction backend (m-lit
# PLAN §2.c.2 item 3), is a DEFAULT feature (USER 2026-11-06 ~13:35): every
# default build links it (developer builds, tests, staged natives, CI, wheels
# and releases). `--no-default-features` builds without it; TIRust shares this
# workspace's Symbolica and oneloop sources and feature sets, so NinjaRS's
# numerics are the same either way.
default = ["tir"]
tir = ["dep:iregi-rust", "dep:iregi-masters", "rusticol-core/tirust-capability"]

[dependencies]
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop.git", rev = "d1904bf2bd5bf4f26969a73b415095e941a55610", default-features = false, features = ["native"] }
pyamplicol = { path = "../crates/pyamplicol" }
rusticol-core = { path = "../crates/rusticol-core", features = ["symbolica-runtime", "python-generation-bridge", "loop-v2"] }
ninjars = { git = "https://github.com/alphal00p/ninjars.git", rev = "e6c31af749ee571908af058584e94dd0b6c77e61" }
ninjars-graph = { git = "https://github.com/alphal00p/ninjars.git", rev = "e6c31af749ee571908af058584e94dd0b6c77e61" }
ninjars-symbolica = { git = "https://github.com/alphal00p/ninjars.git", rev = "e6c31af749ee571908af058584e94dd0b6c77e61", features = ["native-masters"] }
# One oneloop feature set in every root build (M-LIT PLAN §2.c.2 item 3, the Q28
# rule): NinjaRS's native masters need generated-evaluators, TIRust rust-codegen;
# rust-codegen only adds modules (rust_codegen, native::batch).
oneloop = { git = "https://github.com/alphal00p/oneloopmaster.git", rev = "bd703d09a78f7849a6b86a07096e6f222fc01193", default-features = false, features = ["generated-evaluators", "rust-codegen"] }
symbolica = { version = "=3.0.2", default-features = false, features = ["integer-gmp", "float-mpfr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A commit of TIRust's main (after its one history rewrite); its oneloop
# revision and feature set are this manifest's, its Symbolica requirement
# ("3.0") resolves to the root [patch.crates-io] revision.
iregi-rust = { git = "https://github.com/huashengshao/TIRust.git", rev = "2bba1b2502661a8170f7b00eed9afa2ed0ac3e78", optional = true }
iregi-masters = { git = "https://github.com/huashengshao/TIRust.git", rev = "2bba1b2502661a8170f7b00eed9afa2ed0ac3e78", optional = true }
