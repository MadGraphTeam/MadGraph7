# SPDX-License-Identifier: 0BSD

[package]
name = "rusticol-loop-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "0BSD"
publish = false

[lib]
name = "_loop_reduction"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311", "multiple-pymethods"] }
pyamplicol = { path = "../../crates/pyamplicol" }
rusticol-core = { path = "../../crates/rusticol-core", features = ["symbolica-runtime", "python-generation-bridge"] }
rusticol-loop-reduction = { path = ".." }
serde = { workspace = true }
serde_json = { workspace = true }
symbolica = { version = "=3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr"] }
