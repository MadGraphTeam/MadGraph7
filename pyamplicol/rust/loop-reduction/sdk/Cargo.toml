[package]
name = "rusticol-loop-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "0BSD"
publish = false

[lib]
name = "rusticol_loop_sdk"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
# TIRust, a default feature forwarded to rusticol-loop-reduction (m-lit
# PLAN §2.c.2 item 3; USER 2026-11-06 ~13:35).
default = ["tir"]
tir = ["rusticol-loop-reduction/tir"]
# The Rust example client links the combined C ABI archive by hand (README:
# `cargo rustc --example client --features c-abi-examples -- -l static=rusticol_capi`),
# so `cargo test --workspace` must not try to link it on its own.
c-abi-examples = []

[[example]]
name = "client"
required-features = ["c-abi-examples"]

[dependencies]
# pyAmpliCol's Symbolica library key: every ABI call holds it (`ffi::guard`).
pyamplicol = { path = "../../crates/pyamplicol" }
rusticol-loop-reduction = { path = "..", default-features = false }
rusticol-core = { path = "../../crates/rusticol-core", features = ["symbolica-runtime", "python-generation-bridge"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
symbolica = { version = "=3.0.2", default-features = false, features = ["integer-gmp", "float-mpfr"] }
