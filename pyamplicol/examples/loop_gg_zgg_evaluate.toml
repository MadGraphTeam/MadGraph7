# Loop example: evaluate the gg_zgg artifact (poles and the
# recommended stability checks, the per-type default backend).

schema_version = 1
action = "evaluate"

[evaluation]
artifact = "artifacts/loop_gg_zgg"
momenta = "data/loop_gg_zgg_momenta.json"
mu_r2 = "1000000"
poles = "all"

[evaluation.stability_checks]
rotation_count = 1
reduction_direction = true
rescaled = true
