license_ids = [ "MadGraph5-aMCatNLO",]
release_eligible = true
note = "With the model patch of UFOmodeldb issue 1 / mg5amcnlo#475 (Valentin Hirschi; gist https://gist.github.com/ValentinHirschi/81a26a3c9a03ca38cd2f6d6cf6a2b75f, sha256 4b5b1ef0e5f942a956c3e01b4b0f2a77070777910d81567c2caffaace18000a8; ufomodeldb-issue-1-patch-v1: CT_couplings.py, CT_vertices.py, parameters.py; UFOmodeldb 60ee58bb2695c2f4a9b048de801db2caffc2fe6f (2026-10-30) took the patch's b-flavour R2_G0tt split (same values); the local delta against it is the d/s split, the exactly unitary CKM); every other UFO module and restriction card of the download byte for byte; not shipped: MG5_aMC caches (*.pkl, __pycache__), editor backups (*~), AppleDouble files (._*), hidden internal test cards (.restrict_*) and the SMWidth Fortran width tool"

