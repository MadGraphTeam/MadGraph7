[[transformations]]
id = "verbatim-git-blob-v1"
description = "Copy the selected baseline Git blob byte-for-byte"

[[transformations]]
id = "scalar-static-defaults-v1"
description = "Replace UFO_SCALARS_MODEL_* environment reads with the historical defaults N_SCALARS=3 and N_POINT_INTERACTIONS=3..10"
authorized_by = "docs/development/PHYSICS_EXTRACTION_CONTRACT.md#model-determinism"

[[transformations]]
id = "scalar-gravity-static-defaults-v1"
description = "Replace UFO_GRAVITY_MODEL_N_SCALARS with N_SCALARS=3 and remove the unused interaction-option branch containing undefined N_POINT_INTERACTIONS"
authorized_by = "docs/development/PHYSICS_EXTRACTION_CONTRACT.md#model-determinism"

[[transformations]]
id = "loader-ufo-full-v1"
description = "Load sanitized UFO with restriction='full', simplify=True, no index wrapping; serialize model with ufo-model-loader 0.1.8 JSONLook.VERBOSE"
authorized_by = "docs/development/MODEL_ASSET_PROVENANCE.md#before-extraction"

[[transformations]]
id = "loader-ufo-full-wrapped-v1"
description = "Load sanitized UFO with restriction='full', simplify=True, wrap Lorentz indices; serialize with ufo-model-loader 0.1.8 JSONLook.VERBOSE"
authorized_by = "docs/development/MODEL_ASSET_PROVENANCE.md#before-extraction"

[[transformations]]
id = "loader-json-canonical-v1"
description = "Load the tracked frozen JSON variant without a restriction and reserialize with ufo-model-loader 0.1.8 JSONLook.VERBOSE"
authorized_by = "docs/development/MODEL_ASSET_PROVENANCE.md#before-extraction"

[[transformations]]
id = "sm-standard-ufo-spinor-order-v1"
description = "Swap the fermion-pair leg labels in the spinor slots of the SM Lorentz structures to the standard UFO order of MadGraph and FeynRules, e.g. FFV1 = Gamma(3,2,1); the JSON models apply it to their loader-ufo-full-v1 and loader-ufo-full-wrapped-v1 serializations"
authorized_by = "docs/development/model-assets/TRANSFORMATIONS.md#standard-ufo-spinor-order"

[[transformations]]
id = "loader-restriction-card-v1"
description = "Parse every external parameter from the matching sanitized UFO restriction card and serialize the complete card, including explicit zeros, with ufo-model-loader 0.1.8 JSONLook.VERBOSE"
authorized_by = "docs/development/MODEL_ASSET_PROVENANCE.md#before-extraction"

[[transformations]]
id = "verbatim-distribution-file-v1"
description = "Copy the file of the upstream release distribution byte for byte"

[[transformations]]
id = "ufomodeldb-issue-1-patch-v1"
description = "The UFOmodeldb download's file with the model patch of UFOmodeldb issue 1 / mg5amcnlo#475 (Valentin Hirschi; gist https://gist.github.com/ValentinHirschi/81a26a3c9a03ca38cd2f6d6cf6a2b75f, ufomodeldb-issue-1.patch sha256 4b5b1ef0e5f942a956c3e01b4b0f2a77070777910d81567c2caffaace18000a8) applied by patch --fuzz=0 -p1 to a fresh extraction: R2_G0tt_{d,s,b} split by loop content ([W+, G+, q] and [G+, q], coefficient sum kept), exactly unitary standard-parametrisation CKM from the four Wolfenstein inputs, G_mu charge counterterm's bottom-mass term, G_mu restrict_with_b_mass.dat SMINPUTS 1 = 0"

[[transformations]]
id = "ufomodeldb-issue-1-patch-python3-v1"
description = "ufomodeldb-issue-1-patch-v1, then ufo-python3-conversion-v1 (the conversion touches import lines only: converting before or after patching gives the same file)"

[[transformations]]
id = "ufomodeldb-issue-1-patch-python3-fold-v1"
description = "ufomodeldb-issue-1-patch-python3-v1, then tools/developer/fold_ufo_value_appends.py: the patch's module-level string appends to the Laurent terms of eCoup_a0_UV_EW and eCoup_DGmua0_UV_EW folded into their constructors (statements kept as comments); every UFO value string is unchanged (checked by import); ufo-model-loader 1.0.1 certifies no value written after its constructor"

[[transformations]]
id = "ufo-python3-conversion-v1"
description = "Python-3 conversion of a Python-2 UFO module: package-relative imports (__init__.py also imports object_library), .iteritems() -> .items() in object_library.py, write_param_card.py ported to Python 3 (print calls, sort key, exec namespace); no declaration changes"

