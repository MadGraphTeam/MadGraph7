action = "generate"
schema_version = 1

[model]
source = "loop_qcd_qed_sm"
simplify = true
cache = true
cache_dir = "model-cache"

[process]
entries = [{ expression = "e- e+ > e- e+", name = "selftest_virtual_ew" }]
flavor_scheme = 5
coupling_order_policy = "minimal"
loop_coupling_orders = ["QED"]
reference_color_order = []
selected_color_sector_ids = []
flavor_blind = false
consider_charge_conjugation = true
only_unit_multiplier = false
analyze_process_groups = "none"

[process.multiparticles]

[process.max_coupling_orders]

[process.selected_source_helicities]

[loop]
r2_strategy = "model"
external_photons = "final"
alpha0_conversion_parameter = "eCoup_DGmua0_UV_EW"

[loop.model]

[loop.model.scheme]

[loop.preparation]

[loop.preparation.covariant_multiplets]

[loop.preparation.fixed_parameters]
MB = ["0", "0"]
ymb = ["0", "0"]
MTA = ["0", "0"]
ymtau = ["0", "0"]
WT = ["0", "0"]
WW = ["0", "0"]
WZ = ["0", "0"]
WH = ["0", "0"]

[color]
accuracy = "full"
contraction = "auto"
lc_flow_layout = "topology-replay"
fft_basis = "adjoint"

[generation]
output = "artifact"
mode = "error"
workers = 1
emit_api_bundle = false
particle_veto = []
allow_anomalous_veto = false

[generation.validation]
enabled = true
samples = 2
seed = 12345
relative_tolerance = 1e-12
absolute_tolerance = 1e-300
post_build_validation = false

[generation.relation_discovery]
mode = "off"
precision_digits = 96
probe_count = 4
verification_probe_count = 4
relative_tolerance = 1e-70
absolute_tolerance = 1e-80
seed = 1348026701

[evaluator]
backend = "jit"
execution_mode = "loop_recurrence"
batch_size = 128
output_chunk_size = 512

[evaluator.optimization]
horner_iterations = 10
cores = 384
max_horner_variables = 1000
max_common_pair_cache_entries = 5000000
max_common_pair_distance = 1000
collect_factors = "auto"

[evaluator.jit]
optimization_level = 2
compress = false

[evaluator.cpp]
optimization = "O3"
native_arch = false
extra_flags = []

[evaluator.eager]
point_tile_size = 1024
workspace_mib = 256

[evaluator.recurrence]
point_tile_size = 1024
workspace_mib = 256

[evaluation]
precision = 16
resolved = false
orders = false
on_failure = "raise"
poles = "all"
helicity_ids = []
color_flow_ids = []

[evaluation.stability]
higher = []
verify_successful = false

[evaluation.stability_checks]
rotations = []
rotation_count = 0
reduction_direction = false
rescaled = false

[benchmark]
target_runtime = 10.0
batch_size = 128
precision = 16
warmup_runs = 2
minimum_samples = 5
helicity_ids = []
color_flow_ids = []

[output]
format = "human"
color = "auto"
progress = "off"
log_level = "info"

[symbolica]
suggest_license = true
