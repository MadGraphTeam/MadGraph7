# SPDX-License-Identifier: 0BSD
schema_version = 1

[project]
distribution = "pyamplicol"
version = "0.1.0"
python_requires = ">=3.11"
wheel_abi = "cp311-abi3"
license = "0BSD"

[abis]
python_api = 1
toml = 1
compiled_model = 9
process_artifact = 3
runtime_physics = 1
c_abi = 1
symbolica_serialization = "symbolica-bincode2-v1"
symjit_application = "symjit-application-storage-v3"
symjit_plane_application = "pyamplicol-symjit-plane-application-v2"
prepared_model_bundle = 1
prepared_kernel_variant = "pyamplicol-prepared-kernel-variant-v2"
eager_kernel = "pyamplicol-eager-kernel-v1"
eager_plan = "pyamplicol-eager-plan-v2"
eager_selector_domains = "pyamplicol-eager-selector-domains-v1"

[toolchain]
just = "1.46.0"
maturin = "1.14.1"
packaging = "26.2"
rust_minimum = "1.89.0"
rust_toolchain = "1.89.0"
rust_toolchain_action_sha = "c1709d61444fb708e6ed87924f95626398d8d115"
manylinux_image = "quay.io/pypa/manylinux_2_28_x86_64"
manylinux_image_digest = "sha256:b04887b645dde99b9e955aeae3ff4da414992d0bd88259f046295b56361c5614"

[[targets]]
triple = "aarch64-apple-darwin"
platform_tag = "macosx_11_0_arm64"

[[targets]]
triple = "x86_64-apple-darwin"
platform_tag = "macosx_11_0_x86_64"

[[targets]]
triple = "x86_64-unknown-linux-gnu"
platform_tag = "manylinux_2_28_x86_64"

[[python_dependencies]]
distribution = "colorama"
version = "0.4.6"

[[python_dependencies]]
distribution = "numpy"
version = "2.4.2"

[[python_dependencies]]
distribution = "platformdirs"
version = "4.10.0"

[[python_dependencies]]
distribution = "prettytable"
version = "3.18.0"

[[python_dependencies]]
distribution = "progressbar2"
version = "4.5.0"

[[python_dependencies]]
distribution = "six"
version = "1.17.0"

[[python_dependencies]]
distribution = "symbolica"
version = "2.2.0"

[[python_dependencies]]
distribution = "tomli-w"
version = "1.2.0"

[[python_dependencies]]
distribution = "ufo-model-loader"
version = "0.1.7"

[symbolica]
python_distribution = "symbolica"
python_version = "2.2.0"
rust_crate = "symbolica"
rust_version = "2.2.0"
serialization_abi = "symbolica-bincode2-v1"

[symjit]
version = "2.22.0"
repository = "https://github.com/siravan/symjit-crate.git"
revision = "77789ff0f78232b1ea4608aceb397058df50b06d"
source_url = "https://github.com/siravan/symjit-crate/archive/77789ff0f78232b1ea4608aceb397058df50b06d.tar.gz"
archive_prefix = "symjit-crate-77789ff0f78232b1ea4608aceb397058df50b06d"
archive_sha256 = "b3cb6451eff299b27709115053caed579bc266bbd46923a70066b5ac554dd0ac"
source_tree_sha256 = "88aa6a50ec7ad120d3d832f4d98e3efe89ea259e925c9ed139904b8dd7607453"
configured_tree_sha256 = "4b4b791b0f2bbef33a7dbd2936d20dc722f7301e2e9e986b65b2a8b94d220b31"
release_cargo_lock_sha256 = "acc74268440a3913efcbfdff031d23abc2fc956b522b054996543a4576f9edd3"
patches = [
  { name = "symjit-raw-plane-descriptor-v1", target = "symjit", path = "patches/symjit/upstream/0001-Expose-a-stable-raw-P-kernel-plane-descriptor.patch", sha256 = "70012117436d77265b349c013b0df8c4fe72a04ced972090ba3ac069721b436d", applies_to_revision = "77789ff0f78232b1ea4608aceb397058df50b06d" },
