name: Candidate artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tool-tests:
    name: Candidate workflow and release-tool preflight
    runs-on: ubuntu-24.04
    env:
      PYAMPLICOL_BUILD_MODE: release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test tools
        run: python -m pip install "pytest>=8.3,<9" "ruff>=0.9,<1"
      - name: Focused clean-checkout release tests
        run: >-
          python -m pytest
          tests/release
          tests/unit/test_dependency_gate.py
          tests/unit/test_release_*.py
          -q
      - name: Release-tool lint
        run: ruff check tools/release tests/release tests/unit/test_release_*.py

  candidate-source-validation:
    name: Complete candidate source validation gate
    needs: release-tool-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ARENA_EVIDENCE_ROOT: /tmp/pyamplicol-arena-x86-${{ github.sha }}
      PYAMPLICOL_BUILD_MODE: candidate
      PYAMPLICOL_REQUIRE_NATIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@c1709d61444fb708e6ed87924f95626398d8d115 # 1.89.0
      - name: Install required C++17 and Fortran 2008 toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ gfortran make
          command -v c++
          command -v gfortran
          command -v make
      - name: Build the pinned candidate environment
        run: >-
          python tools/ci/memory_watchdog.py --limit-gib 30 --
          python dependencies/install_dependencies.py
          --without-legacy-amplicol
      - name: Run the complete candidate source gate
        run: >-
          .venv/bin/python tools/ci/memory_watchdog.py --limit-gib 30 --
          env PYTHON="$PWD/.venv/bin/python" just source-gate
      - name: Test the candidate wheel in an isolated deployment
        run: >-
          .venv/bin/python tools/ci/memory_watchdog.py --limit-gib 30 --
          .venv/bin/python tools/release/test_deployment.py
          --candidate
          --python .venv/bin/python
          --artifact-dir .artifacts/candidate
          --no-build
      - name: Authenticate source, package, and native x86 runtime
        run: |
          mkdir -p "$ARENA_EVIDENCE_ROOT"
          .venv/bin/python tools/developer/arena_native_x86_acceptance.py \
            preflight \
            --evidence-root "$ARENA_EVIDENCE_ROOT" \
            --expected-revision "${{ github.sha }}" \
            --expected-workspace "${{ github.workspace }}"
      # Four serial O0-O3 workers are each bounded at 15 minutes. This keeps
      # their worst-case envelope inside the authoritative six-hour job limit.
      - name: Validate compiled Direct-Arena at JIT O0 through O3
        run: >-
          .venv/bin/python tools/ci/memory_watchdog.py --limit-gib 30 --
          .venv/bin/python tools/developer/compiled_all_jit_arena_gate.py
          --output-root "$ARENA_EVIDENCE_ROOT/compiled-all-jit"
          --points 3
          --generation-timeout 900
      # Four serial color lanes are each bounded at 40 minutes, leaving time
      # for the source gate, deployment check, color matrix, and final audit.
      - name: Validate four independent quark lines in every valid color lane
        run: >-
          .venv/bin/python tools/ci/memory_watchdog.py --limit-gib 30 --
          .venv/bin/python tools/developer/four_quark_compiled_gate.py
          --output-root "$ARENA_EVIDENCE_ROOT/four-quark"
          --points 3
          --generation-timeout 2400
      - name: Validate eager versus compiled LC, NLC, and full color
        run: >-
          .venv/bin/python tools/ci/memory_watchdog.py --limit-gib 30 --
          .venv/bin/python tools/developer/eager_benchmark_matrix.py
          --suite smoke
          --builtin-pack
          src/pyamplicol/assets/prepared_models/built-in-sm-jit-o2-x86_64.pyamplicol-model
          --output-root "$ARENA_EVIDENCE_ROOT/eager-compiled-color"
          --python .venv/bin/python
      - name: Audit emitted Arena acceptance evidence
        run: >-
          .venv/bin/python tools/developer/arena_native_x86_acceptance.py
          audit
          --evidence-root "$ARENA_EVIDENCE_ROOT"
          --expected-revision "${{ github.sha }}"
          --expected-workspace "${{ github.workspace }}"
          --point-count 3
      - name: Upload native x86 Arena evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyamplicol-arena-native-x86-${{ github.sha }}
          path: |
            ${{ env.ARENA_EVIDENCE_ROOT }}/runtime-identity-preflight.json
            ${{ env.ARENA_EVIDENCE_ROOT }}/compiled-all-jit/compiled-all-jit-arena-gate.json
            ${{ env.ARENA_EVIDENCE_ROOT }}/four-quark/four-quark-compiled-gate.json
            ${{ env.ARENA_EVIDENCE_ROOT }}/eager-compiled-color/result.json
            ${{ env.ARENA_EVIDENCE_ROOT }}/arena-native-x86-acceptance.json
          if-no-files-found: warn
          retention-days: 30

  x86-performance-runtime-bundle:
    name: Frozen x86 performance runtime bundle
    needs: release-tool-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BASELINE_SOURCE_ROOT: /private/tmp/pyamplicol-eager-compiled-arena-base-src
      PERFORMANCE_BUNDLE_ROOT: /tmp/pyamplicol-arena-x86-runtime-bundle-${{ github.run_id }}
      PERFORMANCE_RUNTIME_ROOT: /tmp/pyamplicol-arena-x86-runtime-${{ github.run_id }}
      PYAMPLICOL_BUILD_MODE: candidate
      PYTHONDONTWRITEBYTECODE: "1"
      SYMBOLICA_HIDE_BANNER: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@c1709d61444fb708e6ed87924f95626398d8d115 # 1.89.0
      - name: Install frozen build toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ gfortran make
      - name: Create exact frozen baseline worktree
        run: |
          set -euo pipefail
          sudo install -d -m 1777 /private/tmp
          test "$(stat -c '%a' /private/tmp)" = 1777
          test ! -e "$BASELINE_SOURCE_ROOT"
          git fetch --no-tags --depth=1 origin 443f354a467cdda187996bef1a41fbd5a00ae28d
          git worktree add --detach \
            "$BASELINE_SOURCE_ROOT" \
            443f354a467cdda187996bef1a41fbd5a00ae28d
      - name: Build pinned current dependency environment
        run: >-
          python tools/ci/memory_watchdog.py --limit-gib 30 --
          python dependencies/install_dependencies.py
          --without-legacy-amplicol
      - name: Build pinned baseline dependency environment
        working-directory: /tmp/pyamplicol-eager-compiled-arena-base-src
        run: >-
          python tools/ci/memory_watchdog.py --limit-gib 30 --
          python dependencies/install_dependencies.py
          --without-legacy-amplicol
      - name: Restore the audited frozen baseline dependency state
        run: |
          mkdir -p "$PERFORMANCE_BUNDLE_ROOT"
          python tools/developer/x86_performance_runtime_bundle.py \
            freeze-baseline \
            --source-root "$BASELINE_SOURCE_ROOT" \
            --output \
            "$PERFORMANCE_BUNDLE_ROOT/frozen-baseline-attestation.json"
      - name: Build current and frozen candidate wheels
        run: |
          set -euo pipefail
          mkdir -p \
            "$PERFORMANCE_BUNDLE_ROOT/wheels/current" \
            "$PERFORMANCE_BUNDLE_ROOT/wheels/baseline"
          .venv/bin/python tools/ci/memory_watchdog.py --limit-gib 30 -- \
            .venv/bin/python tools/release/build_release_artifacts.py \
            --candidate \
            --python .venv/bin/python \
            --output-dir "$PERFORMANCE_BUNDLE_ROOT/wheels/current"
          .venv/bin/python tools/ci/memory_watchdog.py --limit-gib 30 -- \
            "$BASELINE_SOURCE_ROOT/.venv/bin/python" \
            "$BASELINE_SOURCE_ROOT/tools/release/build_release_artifacts.py" \
            --candidate \
            --python "$BASELINE_SOURCE_ROOT/.venv/bin/python" \
            --output-dir "$PERFORMANCE_BUNDLE_ROOT/wheels/baseline"
      - name: Bundle exact shared dependencies and prepared UFO-SM model
        run: |
          set -euo pipefail
          current_site="$(
            .venv/bin/python -c \
              'import sysconfig; print(sysconfig.get_paths()["purelib"])'
          )"
          .venv/bin/python \
            tools/developer/x86_performance_runtime_bundle.py \
            bundle-dependencies \
            --source-site "$current_site" \
            --destination "$PERFORMANCE_BUNDLE_ROOT/dependency-site"
          .venv/bin/python tools/ci/memory_watchdog.py --limit-gib 30 -- \
            .venv/bin/python \
            tools/developer/x86_performance_runtime_bundle.py \
            prepare-ufo \
            --output \
            "$PERFORMANCE_BUNDLE_ROOT/prepared-models/ufo-sm-jit-o2.pyamplicol-model" \
            --artifact-root \
            "/tmp/pyamplicol-arena-x86-prepared-${{ github.run_id }}"
      - name: Materialize and authenticate both runtime lanes
        run: |
          set -euo pipefail
          python tools/developer/x86_performance_runtime_bundle.py \
            materialize \
            --bundle-root "$PERFORMANCE_BUNDLE_ROOT" \
            --runtime-root "$PERFORMANCE_RUNTIME_ROOT"
          current_inputs="$(
            "$PERFORMANCE_RUNTIME_ROOT/current/bin/python" -c \
              'import json, pathlib, pyamplicol; print(json.loads(pathlib.Path(pyamplicol.__file__).with_name("_build_info.json").read_text())["native_build_inputs_sha256"])'
          )"
          python tools/developer/x86_performance_runtime_bundle.py \
            create-manifest \
            --bundle-root "$PERFORMANCE_BUNDLE_ROOT" \
            --baseline-python "$PERFORMANCE_RUNTIME_ROOT/baseline/bin/python" \
            --current-python "$PERFORMANCE_RUNTIME_ROOT/current/bin/python" \
            --dependency-site "$PERFORMANCE_BUNDLE_ROOT/dependency-site" \
            --workflow-run-id "${{ github.run_id }}" \
            --expected-current-revision "${{ github.sha }}" \
            --expected-current-native-inputs-sha256 "$current_inputs" \
            --output "$PERFORMANCE_BUNDLE_ROOT/runtime-bundle.json"
          python tools/developer/x86_performance_runtime_bundle.py \
            verify \
            --bundle-root "$PERFORMANCE_BUNDLE_ROOT" \
            --baseline-python "$PERFORMANCE_RUNTIME_ROOT/baseline/bin/python" \
            --current-python "$PERFORMANCE_RUNTIME_ROOT/current/bin/python" \
            --dependency-site "$PERFORMANCE_BUNDLE_ROOT/dependency-site" \
            --workflow-run-id "${{ github.run_id }}" \
            --expected-current-revision "${{ github.sha }}" \
            --manifest "$PERFORMANCE_BUNDLE_ROOT/runtime-bundle.json"
      - name: Upload immutable x86 performance runtime bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyamplicol-x86-performance-runtime-${{ github.run_id }}
          path: ${{ env.PERFORMANCE_BUNDLE_ROOT }}/
          if-no-files-found: error
          retention-days: 30

  x86-performance-matrix-shard:
    name: x86 compiled/eager matrix shard ${{ matrix.shard }}
    needs: x86-performance-runtime-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PERFORMANCE_BUNDLE_ROOT: /tmp/pyamplicol-arena-x86-runtime-bundle-${{ github.run_id }}
      PERFORMANCE_RUNTIME_ROOT: /tmp/pyamplicol-arena-x86-runtime-${{ github.run_id }}
      PERFORMANCE_MATRIX_ROOT: /tmp/pyamplicol-arena-x86-matrix-${{ github.run_id }}
      PYTHONDONTWRITEBYTECODE: "1"
      SYMBOLICA_HIDE_BANNER: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pyamplicol-x86-performance-runtime-${{ github.run_id }}
          path: ${{ env.PERFORMANCE_BUNDLE_ROOT }}
      - name: Reconstruct and verify the immutable runtime lanes
        run: |
          set -euo pipefail
          python tools/developer/x86_performance_runtime_bundle.py \
            materialize \
            --bundle-root "$PERFORMANCE_BUNDLE_ROOT" \
            --runtime-root "$PERFORMANCE_RUNTIME_ROOT"
          python tools/developer/x86_performance_runtime_bundle.py \
            verify \
            --bundle-root "$PERFORMANCE_BUNDLE_ROOT" \
            --baseline-python "$PERFORMANCE_RUNTIME_ROOT/baseline/bin/python" \
            --current-python "$PERFORMANCE_RUNTIME_ROOT/current/bin/python" \
            --dependency-site "$PERFORMANCE_BUNDLE_ROOT/dependency-site" \
            --workflow-run-id "${{ github.run_id }}" \
            --expected-current-revision "${{ github.sha }}" \
            --manifest "$PERFORMANCE_BUNDLE_ROOT/runtime-bundle.json"
      - name: Run exact 21-cell whole-artifact shard
        run: |
          set -euo pipefail
          manifest="$PERFORMANCE_BUNDLE_ROOT/runtime-bundle.json"
          bundle_sha="$(jq -r '.content_identity.sha256' "$manifest")"
          baseline_distribution="$(
            jq -r '.installations.baseline.distribution_content.sha256' "$manifest"
          )"
          current_distribution="$(
            jq -r '.installations.current.distribution_content.sha256' "$manifest"
          )"
          baseline_native="$(
            jq -r '.installations.baseline.native_module.sha256' "$manifest"
          )"
          current_native="$(
            jq -r '.installations.current.native_module.sha256' "$manifest"
          )"
          current_inputs="$(
            jq -r '.installations.current.build_info.native_build_inputs_sha256' \
              "$manifest"
          )"
          "$PERFORMANCE_RUNTIME_ROOT/current/bin/python" \
            tools/ci/memory_watchdog.py --limit-gib 30 -- \
            "$PERFORMANCE_RUNTIME_ROOT/current/bin/python" \
            tools/developer/compiled_mode_matrix_x86.py shard \
            --shard-count 8 \
            --shard-index "${{ matrix.shard }}" \
            --baseline-python "$PERFORMANCE_RUNTIME_ROOT/baseline/bin/python" \
            --current-python "$PERFORMANCE_RUNTIME_ROOT/current/bin/python" \
            --baseline-dependency-site \
            "$PERFORMANCE_BUNDLE_ROOT/dependency-site" \
            --current-dependency-site \
            "$PERFORMANCE_BUNDLE_ROOT/dependency-site" \
            --ufo-sm-model \
            "$PERFORMANCE_BUNDLE_ROOT/prepared-models/ufo-sm-jit-o2.pyamplicol-model" \
            --output-root "$PERFORMANCE_MATRIX_ROOT" \
            --expected-baseline-source-revision \
            443f354a467cdda187996bef1a41fbd5a00ae28d \
            --expected-current-source-revision "${{ github.sha }}" \
            --expected-baseline-native-inputs-sha256 \
            f91ebcc3eb431e3e1e72ac8a4e02dea194c17c2118f57a2742d0c8c5a73b3088 \
            --expected-current-native-inputs-sha256 "$current_inputs" \
            --expected-baseline-distribution-sha256 "$baseline_distribution" \
            --expected-current-distribution-sha256 "$current_distribution" \
            --expected-baseline-native-module-sha256 "$baseline_native" \
            --expected-current-native-module-sha256 "$current_native" \
            --workflow-run-id "${{ github.run_id }}" \
            --runtime-bundle-sha256 "$bundle_sha" \
            --samples 7 \
            --target-runtime 5 \
            --minimum-samples 7 \
            --warmup-runs 2 \
            --generation-timeout 2400 \
            --profile-timeout 1200 \
            --rerun-results \
            --regenerate-artifacts
      - name: Upload exact shard JSON evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyamplicol-x86-matrix-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ env.PERFORMANCE_MATRIX_ROOT }}/cells/*/result.json
            ${{ env.PERFORMANCE_MATRIX_ROOT }}/shards/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  x86-qq-recurrence-capture:
    name: x86 qq Z+6g capture (${{ matrix.role }})
    needs: x86-performance-runtime-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: builtin-topology
            model: builtin
            layout: topology-replay
          - role: builtin-union
            model: builtin
            layout: all-flow-union
          - role: ufo-topology
            model: ufo
            layout: topology-replay
          - role: ufo-union
            model: ufo
            layout: all-flow-union
    env:
      PERFORMANCE_BUNDLE_ROOT: /tmp/pyamplicol-arena-x86-runtime-bundle-${{ github.run_id }}
      PERFORMANCE_RUNTIME_ROOT: /tmp/pyamplicol-arena-x86-runtime-${{ github.run_id }}
      QQ_CAPTURE_ROOT: /tmp/pyamplicol-arena-x86-qq-${{ github.run_id }}
      QQ_WORK_ROOT: /tmp/pyamplicol-arena-x86-qq-work-${{ github.run_id }}
      QQ_UPLOAD_ROOT: /tmp/pyamplicol-arena-x86-qq-upload-${{ github.run_id }}
      PYTHONDONTWRITEBYTECODE: "1"
      SYMBOLICA_HIDE_BANNER: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pyamplicol-x86-performance-runtime-${{ github.run_id }}
          path: ${{ env.PERFORMANCE_BUNDLE_ROOT }}
      - name: Reconstruct and verify the immutable current runtime
        run: |
          set -euo pipefail
          python tools/developer/x86_performance_runtime_bundle.py \
            materialize \
            --bundle-root "$PERFORMANCE_BUNDLE_ROOT" \
            --runtime-root "$PERFORMANCE_RUNTIME_ROOT"
          python tools/developer/x86_performance_runtime_bundle.py \
            verify \
            --bundle-root "$PERFORMANCE_BUNDLE_ROOT" \
            --baseline-python "$PERFORMANCE_RUNTIME_ROOT/baseline/bin/python" \
            --current-python "$PERFORMANCE_RUNTIME_ROOT/current/bin/python" \
            --dependency-site "$PERFORMANCE_BUNDLE_ROOT/dependency-site" \
            --workflow-run-id "${{ github.run_id }}" \
            --expected-current-revision "${{ github.sha }}" \
            --manifest "$PERFORMANCE_BUNDLE_ROOT/runtime-bundle.json"
      - name: Run complete three-lane authoritative capture
        run: |
          set -euo pipefail
          output="$QQ_CAPTURE_ROOT/${{ matrix.role }}"
          work="$QQ_WORK_ROOT/${{ matrix.role }}"
          model_arguments=()
          selector_arguments=()
          if [[ "${{ matrix.model }}" == "ufo" ]]; then
            model_arguments=(
              --prepared-model
              "$PERFORMANCE_BUNDLE_ROOT/prepared-models/ufo-sm-jit-o2.pyamplicol-model"
            )
          fi
          if [[ "${{ matrix.layout }}" == "topology-replay" ]]; then
            selector_arguments=(
              --color-flow
              flow:2,4,5,6,7,8,9,1
            )
          else
            selector_arguments=(
              --helicity
              h:-1,+1,-1,+1,-1,+1,-1,+1,-1
            )
          fi
          "$PERFORMANCE_RUNTIME_ROOT/current/bin/python" \
            tools/ci/memory_watchdog.py --limit-gib 30 -- \
            "$PERFORMANCE_RUNTIME_ROOT/current/bin/python" \
            tools/developer/recurrence_z6g_benchmark.py \
            --output-root "$work" \
            --result-json "$output/result.json" \
            --jit-optimization-level 3 \
            --lc-flow-layout "${{ matrix.layout }}" \
            --mode compiled \
            --mode eager \
            --mode recurrence \
            --batch-size 1 \
            --batch-size 128 \
            --batch-size 1024 \
            --target-runtime 5 \
            --minimum-samples 7 \
            --subprocess-samples 7 \
            --warmup-runs 2 \
            --validation-samples 10 \
            --generation-timeout 10800 \
            --profile-timeout 1800 \
            --force \
            "${model_arguments[@]}" \
            "${selector_arguments[@]}"
          install -D -m 0644 \
            "$output/result.json" \
            "$QQ_UPLOAD_ROOT/${{ matrix.role }}.json"
      - name: Upload authoritative qq Z+6g capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyamplicol-x86-qq-${{ matrix.role }}-${{ github.run_id }}
          path: ${{ env.QQ_UPLOAD_ROOT }}/${{ matrix.role }}.json
          if-no-files-found: warn
          retention-days: 30

  x86-performance-matrix-aggregate:
    name: Aggregate exact 168-cell x86 performance matrix
    needs:
      - x86-performance-runtime-bundle
      - x86-performance-matrix-shard
    runs-on: ubuntu-24.04
    env:
      PERFORMANCE_BUNDLE_ROOT: /tmp/pyamplicol-arena-x86-runtime-bundle-${{ github.run_id }}
      PERFORMANCE_RUNTIME_ROOT: /tmp/pyamplicol-arena-x86-runtime-${{ github.run_id }}
      PERFORMANCE_MATRIX_ROOT: /tmp/pyamplicol-arena-x86-matrix-${{ github.run_id }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pyamplicol-x86-performance-runtime-${{ github.run_id }}
          path: ${{ env.PERFORMANCE_BUNDLE_ROOT }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: pyamplicol-x86-matrix-shard-*-${{ github.run_id }}
          path: ${{ env.PERFORMANCE_MATRIX_ROOT }}
          merge-multiple: true
      - name: Recompute the unchanged global matrix gates from shard JSON
        run: |
          set -euo pipefail
          manifest="$PERFORMANCE_BUNDLE_ROOT/runtime-bundle.json"
          bundle_sha="$(jq -r '.content_identity.sha256' "$manifest")"
          baseline_distribution="$(
            jq -r '.installations.baseline.distribution_content.sha256' "$manifest"
          )"
          current_distribution="$(
            jq -r '.installations.current.distribution_content.sha256' "$manifest"
          )"
          baseline_native="$(
            jq -r '.installations.baseline.native_module.sha256' "$manifest"
          )"
          current_native="$(
            jq -r '.installations.current.native_module.sha256' "$manifest"
          )"
          current_inputs="$(
            jq -r '.installations.current.build_info.native_build_inputs_sha256' \
              "$manifest"
          )"
          python tools/developer/compiled_mode_matrix_x86.py aggregate \
            --shard-count 8 \
            --shard-root "$PERFORMANCE_MATRIX_ROOT/shards" \
            --aggregate-result \
            "$PERFORMANCE_MATRIX_ROOT/compiled-mode-matrix-x86-aggregate.json" \
            --baseline-python "$PERFORMANCE_RUNTIME_ROOT/baseline/bin/python" \
            --current-python "$PERFORMANCE_RUNTIME_ROOT/current/bin/python" \
            --baseline-dependency-site \
            "$PERFORMANCE_BUNDLE_ROOT/dependency-site" \
            --current-dependency-site \
            "$PERFORMANCE_BUNDLE_ROOT/dependency-site" \
            --ufo-sm-model \
            "$PERFORMANCE_BUNDLE_ROOT/prepared-models/ufo-sm-jit-o2.pyamplicol-model" \
            --output-root "$PERFORMANCE_MATRIX_ROOT" \
            --expected-baseline-source-revision \
            443f354a467cdda187996bef1a41fbd5a00ae28d \
            --expected-current-source-revision "${{ github.sha }}" \
            --expected-baseline-native-inputs-sha256 \
            f91ebcc3eb431e3e1e72ac8a4e02dea194c17c2118f57a2742d0c8c5a73b3088 \
            --expected-current-native-inputs-sha256 "$current_inputs" \
            --expected-baseline-distribution-sha256 "$baseline_distribution" \
            --expected-current-distribution-sha256 "$current_distribution" \
            --expected-baseline-native-module-sha256 "$baseline_native" \
            --expected-current-native-module-sha256 "$current_native" \
            --workflow-run-id "${{ github.run_id }}" \
            --runtime-bundle-sha256 "$bundle_sha"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyamplicol-x86-matrix-aggregate-${{ github.run_id }}
          path: ${{ env.PERFORMANCE_MATRIX_ROOT }}/compiled-mode-matrix-x86-aggregate.json
          if-no-files-found: error
          retention-days: 30

  x86-qq-recurrence-acceptance:
    name: Audit four x86 qq Z+6g recurrence captures
    needs:
      - x86-performance-runtime-bundle
      - x86-qq-recurrence-capture
    runs-on: ubuntu-24.04
    env:
      PERFORMANCE_BUNDLE_ROOT: /tmp/pyamplicol-arena-x86-runtime-bundle-${{ github.run_id }}
      QQ_CAPTURE_ROOT: /tmp/pyamplicol-arena-x86-qq-${{ github.run_id }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pyamplicol-x86-performance-runtime-${{ github.run_id }}
          path: ${{ env.PERFORMANCE_BUNDLE_ROOT }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: pyamplicol-x86-qq-*-${{ github.run_id }}
          path: ${{ env.QQ_CAPTURE_ROOT }}
          merge-multiple: true
      - name: Recompute numerical contracts and paired recurrence ratios
        run: >-
          python tools/developer/x86_qq_recurrence_acceptance.py
          --builtin-topology "$QQ_CAPTURE_ROOT/builtin-topology.json"
          --builtin-union "$QQ_CAPTURE_ROOT/builtin-union.json"
          --ufo-topology "$QQ_CAPTURE_ROOT/ufo-topology.json"
          --ufo-union "$QQ_CAPTURE_ROOT/ufo-union.json"
          --runtime-bundle-manifest
          "$PERFORMANCE_BUNDLE_ROOT/runtime-bundle.json"
          --workflow-run-id "${{ github.run_id }}"
          --expected-current-revision "${{ github.sha }}"
          --output "$QQ_CAPTURE_ROOT/x86-qq-recurrence-acceptance.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyamplicol-x86-qq-acceptance-${{ github.run_id }}
          path: ${{ env.QQ_CAPTURE_ROOT }}/x86-qq-recurrence-acceptance.json
          if-no-files-found: error
          retention-days: 30

  x86-portable-candidate-acceptance:
    name: Final portable x86 correctness and performance acceptance
    needs:
      - candidate-source-validation
      - x86-performance-matrix-aggregate
      - x86-qq-recurrence-acceptance
    runs-on: ubuntu-24.04
    env:
      FINAL_EVIDENCE_ROOT: /tmp/pyamplicol-arena-x86-final-${{ github.run_id }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pyamplicol-arena-native-x86-${{ github.sha }}
          path: ${{ env.FINAL_EVIDENCE_ROOT }}/native
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pyamplicol-x86-matrix-aggregate-${{ github.run_id }}
          path: ${{ env.FINAL_EVIDENCE_ROOT }}/matrix
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pyamplicol-x86-qq-acceptance-${{ github.run_id }}
          path: ${{ env.FINAL_EVIDENCE_ROOT }}/qq
      - name: Bind final correctness and performance evidence
        run: >-
          python tools/developer/x86_portable_performance_acceptance.py
          --native-acceptance
          "$FINAL_EVIDENCE_ROOT/native/arena-native-x86-acceptance.json"
          --matrix-acceptance
          "$FINAL_EVIDENCE_ROOT/matrix/compiled-mode-matrix-x86-aggregate.json"
          --qq-acceptance
          "$FINAL_EVIDENCE_ROOT/qq/x86-qq-recurrence-acceptance.json"
          --workflow-run-id "${{ github.run_id }}"
          --expected-revision "${{ github.sha }}"
          --output "$FINAL_EVIDENCE_ROOT/x86-portable-candidate-acceptance.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyamplicol-x86-portable-acceptance-${{ github.sha }}
          path: ${{ env.FINAL_EVIDENCE_ROOT }}/x86-portable-candidate-acceptance.json
          if-no-files-found: error
          retention-days: 30

  macos-candidate:
    name: Candidate artifact (${{ matrix.target }})
    needs: candidate-source-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      PYAMPLICOL_BUILD_MODE: candidate
      PYAMPLICOL_REQUIRE_NATIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@c1709d61444fb708e6ed87924f95626398d8d115 # 1.89.0
      - name: Prepare pinned candidate dependency inputs
        run: >-
          python tools/ci/memory_watchdog.py --limit-gib 30 --
          python dependencies/install_dependencies.py
          --without-legacy-amplicol
      - name: Install build tools
        run: python -m pip install "build>=1.2,<2" "maturin==1.14.1"
      - name: Build and audit non-publishable candidate artifacts
        run: >-
          python tools/ci/memory_watchdog.py --limit-gib 30 --
          python tools/release/build_release_artifacts.py
          --candidate
          --output-dir .artifacts/candidate-ci
      - name: Require C++17 and Fortran 2008 SDK toolchains
        shell: bash
        run: |
          set -euo pipefail
          command -v make
          cxx="$(command -v c++)"
          fc="$(command -v gfortran || true)"
          if [[ -z "$fc" ]]; then
            brew install gcc
            prefix="$(brew --prefix gcc)"
            for candidate in "$prefix/bin/gfortran" "$prefix"/bin/gfortran-*; do
              if [[ -x "$candidate" ]]; then
                fc="$candidate"
                break
              fi
            done
          fi
          test -n "$fc"
          "$cxx" --version
          "$fc" --version
          printf 'CXX=%s\n' "$cxx" >> "$GITHUB_ENV"
          printf 'FC=%s\n' "$fc" >> "$GITHUB_ENV"
      - name: Test the installed candidate wheel and native SDK
        run: >-
          python tools/ci/memory_watchdog.py --limit-gib 30 --
          python tools/release/test_deployment.py
          --candidate
          --python "$(command -v python)"
          --wheel .artifacts/candidate-ci/pyamplicol-*.whl
          --no-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyamplicol-candidate-${{ matrix.target }}
          path: .artifacts/candidate-ci/
          if-no-files-found: error
          retention-days: 14

  manylinux-candidate:
    name: Candidate artifact (manylinux-x86_64)
    needs: candidate-source-validation
    runs-on: ubuntu-24.04
    env:
      PYAMPLICOL_BUILD_MODE: candidate
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build and audit non-publishable candidates in manylinux_2_28 x86_64
        run: |
          docker run --rm \
            -v "$PWD:/io" \
            -w /io \
            -e PYAMPLICOL_BUILD_MODE=candidate \
            -e PYAMPLICOL_REQUIRE_NATIVE_TESTS=1 \
            quay.io/pypa/manylinux_2_28_x86_64@sha256:b04887b645dde99b9e955aeae3ff4da414992d0bd88259f046295b56361c5614 \
            /bin/bash -euxo pipefail -c '
              git config --global --add safe.directory /io
              yum install -y gcc-c++ gcc-gfortran make
              command -v c++
              command -v gfortran
              command -v make
              curl --proto "=https" --tlsv1.2 -sSf \
                -o /tmp/rustup-init \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" \
                | sha256sum --check --strict
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.89.0
              source "$HOME/.cargo/env"
              PYTHON=/opt/python/cp311-cp311/bin/python
              "$PYTHON" -m pip install "build>=1.2,<2" "maturin==1.14.1"
              "$PYTHON" tools/ci/memory_watchdog.py --limit-gib 30 -- \
                "$PYTHON" dependencies/install_dependencies.py \
                --without-legacy-amplicol
              "$PYTHON" tools/ci/memory_watchdog.py --limit-gib 30 -- \
                "$PYTHON" tools/release/build_release_artifacts.py \
                --candidate \
                --output-dir .artifacts/candidate-ci
              "$PYTHON" tools/ci/memory_watchdog.py --limit-gib 30 -- \
                "$PYTHON" tools/release/test_deployment.py \
                --candidate \
                --python "$PYTHON" \
                --wheel .artifacts/candidate-ci/pyamplicol-*.whl \
                --no-build
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyamplicol-candidate-manylinux-x86_64
          path: .artifacts/candidate-ci/
          if-no-files-found: error
          retention-days: 14
