# SPDX-License-Identifier: 0BSD

[workspace]
members = [
  "rust/crates/pyamplicol",
  "rust/crates/rusticol-core",
  "rust/crates/rusticol-python",
  "rust/crates/rusticol-capi",
  "rust/loop-reduction",
  "rust/loop-reduction/python",
  "rust/loop-reduction/sdk",
]
exclude = [
  "TMP_FIXED_SYMJIT",
  "TMP_FIXED_SPENSO",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
license = "0BSD"
authors = [
  "Rikkert Frederix <rikkert.frederix@thep.lu.se>",
  "Valentin Hirschi <valentin.hirschi@gmail.com>",
  "Timea Vitos <timea.vitos@thep.lu.se>",
]
repository = "https://github.com/mg5amcnlo/pyamplicol"

[workspace.dependencies]
bincode = { version = "2.0", features = ["serde"] }
flate2 = "1.1"
libc = "0.2"
numpy = "0.29"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
pyo3 = { version = "0.29", features = ["abi3-py311"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"
symbolica = { version = "=3.0.2", default-features = false, features = ["bincode", "integer-gmp", "float-mpfr", "native_code_generation"] }
symjit = { version = "=2.28.3", default-features = false }
thiserror = "2.0"
wide = "1.7"

# Symbolica: symbolica-dev/symbolica's `community` branch 36cbac3a (main
# 9de26e4e plus the author's merged commits; the Python Community release is
# built from it, and FeynKit needs its symbolica::utils::resources) with the
# consolidated upstream PR (batched evaluation, DualNumber component views,
# saved evaluators that hold only the state they reference, complex-modulus
# derivatives in Dual domains, deterministic integer factor signs, polynomial
# exponents bounded by the i32 conversion range, a journaled conditional cache
# in the direct evaluator translator, native Python ComplexFloat operands at
# the more precise component's precision) on top:
# symbolica-dev/symbolica#163, branch ValentinHirschi/symbolica
# loop_me_pyamplicol. NinjaRS and oneloopmaster's own standalone [patch]
# pin the same revision (only this root's [patch] applies here); it moves
# to upstream once the PR is merged. One revision for the kernel and its
# numerical and graph crates.
[patch.crates-io]
symbolica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "dfe6bd97b974b1028dc63071ea165136cd2b0ef5" }
numerica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "dfe6bd97b974b1028dc63071ea165136cd2b0ef5" }
graphica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "dfe6bd97b974b1028dc63071ea165136cd2b0ef5" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "debuginfo"

# The C SDK archive (build_backend/sdk.py): the release codegen without LTO, so
# that no crate of the archive carries LLVM bitcode for the extension's thin
# LTO (bitcode was ~2/3 of the archive and is unusable by C/C++/Fortran linkers).
[profile.sdk]
inherits = "release"
lto = "off"
