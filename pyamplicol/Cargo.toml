# SPDX-License-Identifier: 0BSD

[workspace]
members = [
  "rust/crates/rusticol-core",
  "rust/crates/rusticol-python",
  "rust/crates/rusticol-capi",
  "rust/loop-reduction",
  "rust/loop-reduction/python",
  "rust/loop-reduction/sdk",
]
exclude = [
  "TMP_FIXED_SYMJIT",
  "TMP_FIXED_SPENSO",
]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.96"
license = "0BSD"
authors = [
  "Rikkert Frederix <rikkert.frederix@thep.lu.se>",
  "Valentin Hirschi <valentin.hirschi@gmail.com>",
  "Timea Vitos <timea.vitos@thep.lu.se>",
]
repository = "https://github.com/mg5amcnlo/pyamplicol"

[workspace.dependencies]
bincode = { version = "2.0", features = ["serde"] }
flate2 = "1.1"
libc = "0.2"
numpy = "0.29"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
pyo3 = { version = "0.29", features = ["abi3-py311"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"
symbolica = { version = "=3.0.1", default-features = false, features = ["bincode", "integer-gmp", "float-mpfr", "native_code_generation"] }
symjit = { version = "=2.27.3", default-features = false }
thiserror = "2.0"
wide = "1.7"

# NinjaRS's tested integration fork. Keep the numerical and graph crates on
# the same revision as Symbolica; these fixes are not all merged upstream yet.
[patch.crates-io]
symbolica = { git = "https://github.com/alphal00p/symbolica.git", rev = "e679e8c129ce15ec50c46ffb4ff4b59aeb7813b8" }
numerica = { git = "https://github.com/alphal00p/symbolica.git", rev = "e679e8c129ce15ec50c46ffb4ff4b59aeb7813b8" }
graphica = { git = "https://github.com/alphal00p/symbolica.git", rev = "e679e8c129ce15ec50c46ffb4ff4b59aeb7813b8" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "debuginfo"
