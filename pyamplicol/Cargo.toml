# SPDX-License-Identifier: 0BSD

[workspace]
members = [
  "rust/crates/pyamplicol",
  "rust/crates/rusticol-core",
  "rust/crates/rusticol-python",
  "rust/crates/rusticol-capi",
  "rust/loop-reduction",
  "rust/loop-reduction/python",
  "rust/loop-reduction/sdk",
]
exclude = [
  "TMP_FIXED_SYMJIT",
  "TMP_FIXED_SPENSO",
]
resolver = "2"

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.96"
license = "0BSD"
authors = [
  "Rikkert Frederix <rikkert.frederix@thep.lu.se>",
  "Valentin Hirschi <valentin.hirschi@gmail.com>",
  "Timea Vitos <timea.vitos@thep.lu.se>",
]
repository = "https://github.com/mg5amcnlo/pyamplicol"

[workspace.dependencies]
bincode = { version = "2.0", features = ["serde"] }
flate2 = "1.1"
libc = "0.2"
numpy = "0.29"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
pyo3 = { version = "0.29", features = ["abi3-py311"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"
symbolica = { version = "=3.0.2", default-features = false, features = ["bincode", "integer-gmp", "float-mpfr", "native_code_generation"] }
symjit = { version = "=2.28.3", default-features = false }
thiserror = "2.0"
wide = "1.7"

# Symbolica: symbolica-dev/symbolica's `community` branch 36cbac3a (main
# 9de26e4e plus the author's merged commits; the Python Community release is
# built from it, and FeynKit needs its symbolica::utils::resources) with the
# consolidated upstream PR (batched evaluation, DualNumber component views,
# saved evaluators that hold only the state they reference, complex-modulus
# derivatives in Dual domains, deterministic integer factor signs, polynomial
# exponents bounded by the i32 conversion range) on top:
# symbolica-dev/symbolica#163, branch ValentinHirschi/symbolica
# loop_me_pyamplicol. NinjaRS pins the same revision (oneloopmaster's own
# standalone [patch] names the previous head 20a9da94; only this root's
# [patch] applies here); it moves to upstream once the PR is merged. One
# revision for the kernel and its numerical and graph crates.
[patch.crates-io]
symbolica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "b9eaa735862e7d22d7694a14da02f2498342e29a" }
numerica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "b9eaa735862e7d22d7694a14da02f2498342e29a" }
graphica = { git = "https://github.com/ValentinHirschi/symbolica.git", rev = "b9eaa735862e7d22d7694a14da02f2498342e29a" }
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "debuginfo"
