name: Build madspace
description: >
  Build the madspace install prefix once per commit (content-addressed on the
  madspace source). Shared by the build_madspace job of every mg7 workflow so
  the build logic lives in exactly one place. This action NEVER saves a cache:
  the madspace cache entry is written only by the madspace_cache job of
  warm_cache.yml, on main. A miss here is handed to the test jobs of the same
  run as a workflow artifact (a tarball, kept one day), which install_madspace
  unpacks. Assumes the repository is already checked out.

inputs:
  enable_docs:
    description: >
      Build with ENABLE_DOCS=ON: pybind11 docstrings extracted from the Doxygen
      comments plus .pyi stubs. doxygen must already be on PATH -- CMake runs
      generate_docstrings.py --require-doxygen, which hard-fails without it.
      Folded into the cache key so a docs build can never be satisfied by (nor
      poison) a normal, docstring-less one. Empty suffix when false, so every
      existing cache entry keeps its exact key.
    required: false
    default: 'false'
  handoff:
    description: >
      'true' (default): on a miss, upload the built install as an artifact for
      the test jobs of this run. warm_cache.yml passes 'false', because it saves
      the cache itself and has no test jobs to hand the install to.
    required: false
    default: 'true'

outputs:
  cache-hit:
    description: "'true' when the install was restored from the cache, not built."
    value: ${{ steps.cache-madspace.outputs.cache-hit }}
  cache-key:
    description: The cache key of this install (the key install_madspace restores).
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    # The key is computed here, before the build creates madspace/install, so
    # hashFiles sees the clean source. install_madspace computes the same string.
    - name: madspace cache key
      id: key
      run: |
        MS_PY="$(python3 -c 'import sys;print(f"{sys.version_info.major}{sys.version_info.minor}")')"
        # -simd: the install includes the SIMD CPU backends; a separate suffix so
        # that a cached install from before SIMD was enabled is never restored
        MS_VARIANT="${{ inputs.enable_docs == 'true' && '-docs' || '' }}-simd"
        KEY="madspace${MS_VARIANT}-${RUNNER_OS}-py${MS_PY}-${{ hashFiles('madspace/**') }}"
        echo "key=$KEY" >> "$GITHUB_OUTPUT"
      shell: bash

    # Restore only. Saved by warm_cache.yml on main.
    - name: Restore madspace install
      id: cache-madspace
      uses: actions/cache/restore@v5
      with:
        path: madspace/install
        key: ${{ steps.key.outputs.key }}

    # generate_docstrings.py --require-doxygen (invoked by CMake when
    # ENABLE_DOCS=ON) hard-fails if doxygen isn't on PATH -- check early with a
    # clear message instead of a buried cmake error.
    - name: Assert doxygen is on PATH
      if: inputs.enable_docs == 'true' && steps.cache-madspace.outputs.cache-hit != 'true'
      run: doxygen --version
      shell: bash

    # Built from the in-tree source (scikit-build-core / cmake). Upgrade pip +
    # packaging first: the runner ships an ancient pip whose build isolation does
    # not provide packaging>=22, which scikit-build-core's vendored
    # pyproject_metadata requires.
    #
    # ENABLE_OPENBLAS=ON builds OpenBLAS from source and links it statically into
    # the extension (see madspace/CMakeLists.txt), so the cached install is
    # self-contained and needs no system libopenblas at runtime. This avoids a
    # dynamic dependency that would otherwise only be satisfied on cache miss
    # (when apt installed libopenblas-dev) and missing on cache hit.
    #
    # --target installs into madspace/install, the prefix the mg7 runtime and
    # madspace/install.py expect.
    - name: Build and install madspace (only on cache miss)
      if: steps.cache-madspace.outputs.cache-hit != 'true'
      run: |
        cd $GITHUB_WORKSPACE
        python3 -m pip install --upgrade pip packaging
        python3 -m pip install ./madspace \
          -Ccmake.define.ENABLE_OPENBLAS=ON \
          -Ccmake.define.ENABLE_SIMD=ON \
          ${{ inputs.enable_docs == 'true' && '-Ccmake.define.ENABLE_DOCS=ON' || '' }} \
          --target="$GITHUB_WORKSPACE/madspace/install"
      shell: bash

    # A tarball keeps the symlinks of the install (shared-library SONAMEs),
    # which an artifact upload would drop.
    - name: Package madspace install for the test jobs (on cache miss)
      if: steps.cache-madspace.outputs.cache-hit != 'true' && inputs.handoff == 'true'
      run: tar -C madspace -czf "$RUNNER_TEMP/madspace-install.tgz" install
      shell: bash

    - name: Hand madspace install to the test jobs (on cache miss)
      if: steps.cache-madspace.outputs.cache-hit != 'true' && inputs.handoff == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.key.outputs.key }}
        path: ${{ runner.temp }}/madspace-install.tgz
        retention-days: 1
        if-no-files-found: error
        overwrite: true
