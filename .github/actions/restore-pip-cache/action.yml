name: Restore pip cache
description: Restores numpy from cache and sets PYTHONPATH

runs:
  using: composite
  steps:
    - name: Set cache key
      # ImageOS is only set on GitHub-hosted runners; on a self-hosted one
      # (cern1, alma10) key on the distribution instead, so it never restores
      # a numpy built for the ubuntu image.
      run: echo "CACHE_KEY=pip-numpy-${ImageOS:-$(. /etc/os-release && echo $ID$VERSION_ID)}" >> $GITHUB_ENV
      shell: bash

    # Generation-suffixed keys: see the comment in restore_heptools.
    - uses: actions/cache/restore@v5
      with:
        path: ~/.cache/pip-packages
        key: ${{ env.CACHE_KEY }}-${{ github.run_id }}
        restore-keys: |
          ${{ env.CACHE_KEY }}-
          ${{ env.CACHE_KEY }}

    - run: |
        # meson+ninja (the build backend of numpy 2.x f2py) come with the pip
        # cache (warm_cache.yml installs numpy, meson and ninja into it), and
        # its bin/ goes first on PATH. No apt install here: it was redundant,
        # and an apt mirror outage then failed every job at setup.
        echo "PYTHONPATH=$PYTHONPATH:$HOME/.cache/pip-packages" >> $GITHUB_ENV
        echo "$HOME/.cache/pip-packages/bin" >> $GITHUB_PATH
        # Install meson+ninja if missing from the cache.
        # --upgrade is needed so pip writes scripts into the existing bin/ directory;
        # it only affects meson/ninja since numpy is not listed here.
        if [ ! -x "$HOME/.cache/pip-packages/bin/meson" ]; then
          pip install --target "$HOME/.cache/pip-packages" --upgrade meson ninja
        fi
        cd $GITHUB_WORKSPACE
        # Use direct path because GITHUB_PATH additions don't take effect in the same step
        F2PY_BIN="$HOME/.cache/pip-packages/bin/f2py"
        if [ -x "$F2PY_BIN" ]; then
          echo "f2py_compiler = $F2PY_BIN" >> input/mg7_configuration.txt
        else
          pip install --target "$HOME/.cache/pip-packages" --upgrade numpy
          echo "f2py_compiler = $F2PY_BIN" >> input/mg7_configuration.txt
        fi
      shell: bash
