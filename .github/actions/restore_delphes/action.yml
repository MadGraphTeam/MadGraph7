name: Restore Delphes cache
description: Restores Delphes (and its ROOT dependency) from a dedicated cache and configures MG5

# Delphes depends only on ROOT. Both live in the dedicated ~/.cache/Delphes
# cache (kept separate from HEPtools); the delphes-<os> cache is stacked on top
# of the root-<os> one, exactly like the HEPtools sub-caches.

inputs:
  setup_only:
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Ensure the ROOT environment (ROOTSYS/PATH/LD_LIBRARY_PATH) is set up,
    # restoring the root cache only if a higher level did not already do so.
    - name: restore ROOT
      uses: ./.github/actions/restore_root
      with:
        setup_only: ${{ inputs.setup_only }}

    - name: Set cache key
      run: echo "CACHE_KEY=delphes-$ImageOS" >> $GITHUB_ENV
      shell: bash

    # Generation-suffixed keys: see the comment in restore_heptools.
    - name: Restore Delphes cache
      id: cache
      if: ${{ inputs.setup_only != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/Delphes
        key: ${{ env.CACHE_KEY }}-${{ github.run_id }}
        restore-keys: |
          ${{ env.CACHE_KEY }}-
          ${{ env.CACHE_KEY }}

    # Self-heal on a cache miss, like restore_root does for ROOT: build Delphes
    # inline with MG's installer, exactly like the delphes_cache warm job (keep
    # the two in sync). Without this a miss (eviction, or a warm run still
    # queued) leaves delphes_path pointing at nothing, the Delphes acceptance
    # tests raise SkipTest, and test_manager.py fails the step on any skip.
    # ROOT is already in ~/.cache/Delphes/root (restore_root above, cached or
    # installed inline). Nothing is saved here: warm_cache.yml stays the only
    # writer of delphes-<os>, since an entry saved from a PR is readable only
    # by that PR and just eats the 10 GB repository quota.
    # MG's install may save delphes_path = ./Delphes into the configuration;
    # the step below appends the cache path afterwards, and the last line wins.
    - name: Install Delphes (cache miss fallback)
      if: ${{ inputs.setup_only != 'true' && steps.cache.outputs.cache-matched-key == '' }}
      env:
        MAKEFLAGS: "-j4"
      run: |
        echo "::warning::Delphes cache miss for ${CACHE_KEY}; installing Delphes inline. Run the 'Warm all caches' workflow (warm_cache.yml) on main to restore the cache."
        cd $GITHUB_WORKSPACE
        [ -f Template/LO/Source/make_opts ] || cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
        echo "install Delphes" > "$RUNNER_TEMP/install_delphes.mg"
        ./bin/madgraph "$RUNNER_TEMP/install_delphes.mg"
        rm -rf "$HOME/.cache/Delphes/Delphes"
        mv "$GITHUB_WORKSPACE/Delphes" "$HOME/.cache/Delphes/Delphes"
      shell: bash

    # Fail here, with the reason, rather than in a test that skips.
    - name: Verify Delphes is available
      if: ${{ inputs.setup_only != 'true' }}
      run: |
        if [ ! -x "$HOME/.cache/Delphes/Delphes/DelphesHepMC2" ]; then
          echo "::error::Delphes is not available at $HOME/.cache/Delphes/Delphes after restore/install."
          exit 1
        fi
      shell: bash

    - run: |
        cd $GITHUB_WORKSPACE
        echo "delphes_path = $HOME/.cache/Delphes/Delphes" >> input/mg7_configuration.txt
      shell: bash
