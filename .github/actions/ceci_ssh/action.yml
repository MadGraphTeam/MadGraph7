name: CECI ssh access
description: >
  Install the CECI ssh key, the pinned host keys and an ssh config, so that
  `ssh manneback` / `ssh lemaitre4` go through the gwceci gateway. Plain shell on
  purpose: the private key never goes through a third-party action. Used by the
  GPU CI (gpu_runner_ci.yml), whose job holding the key runs in the protected
  `ceci-gpu` environment.

inputs:
  key:
    description: 'private ssh key registered in the CECI account'
    required: true
  user:
    description: 'CECI login'
    required: false
    default: 'omatt'

runs:
  using: composite
  steps:
    - name: install ssh key, host keys and config
      shell: bash
      env:
        CECI_KEY: ${{ inputs.key }}
        CECI_USER: ${{ inputs.user }}
      run: |
        install -d -m 700 ~/.ssh
        # Rebuild a clean key file from the secret, whatever the way it was pasted:
        # Windows line endings, blank or indented lines, newlines turned into spaces.
        printf '%s' "$CECI_KEY" | python3 -c '
        import re, sys
        raw = sys.stdin.read().replace("\r", "")
        m = re.search(r"-----BEGIN ([A-Z0-9 ]+)-----(.*?)-----END \1-----", raw, re.S)
        if not m:
            sys.stdout.write(raw.strip() + "\n")
        elif ":" in m.group(2):  # PEM with headers (e.g. encrypted RSA): keep its lines
            lines = [l.strip() for l in m.group(2).strip().splitlines() if l.strip()]
            sys.stdout.write("-----BEGIN %s-----\n%s\n-----END %s-----\n" % (m.group(1), "\n".join(lines), m.group(1)))
        else:
            body = "".join(m.group(2).split())
            width = 70 if m.group(1) == "OPENSSH PRIVATE KEY" else 64
            wrapped = "\n".join(body[i:i + width] for i in range(0, len(body), width))
            sys.stdout.write("-----BEGIN %s-----\n%s\n-----END %s-----\n" % (m.group(1), wrapped, m.group(1)))
        ' > ~/.ssh/id_ceci
        chmod 600 ~/.ssh/id_ceci
        # check that ssh can load the key; on failure explain why, without printing the key
        if ! ssh-keygen -y -P '' -f ~/.ssh/id_ceci > /dev/null 2> /tmp/keycheck; then
          first=$(head -n 1 ~/.ssh/id_ceci)
          case $first in
            '') hint="the secret is empty in this job (not set in the ceci-gpu environment, or the calling workflow lacks 'secrets: inherit')" ;;
            ssh-*|ecdsa-*) hint="this is a PUBLIC key: store the private key instead" ;;
            -----BEGIN*)
              if grep -q 'ENCRYPTED' ~/.ssh/id_ceci; then
                echo "::error::the CECI_KEY secret is protected by a passphrase, which the CI cannot type: store a copy without passphrase (ssh-keygen -p -N '' on a copy of the key, see .github/gpu_ci/README.md)"
                exit 1
              fi
              body=$(sed '1d;$d' ~/.ssh/id_ceci | tr -d '\n')
              if printf '%s' "$body" | base64 -d > /dev/null 2>&1; then b64=valid; else b64=INVALID; fi
              hint="header '$first', ${#body} base64 characters ($b64 base64): the key is truncated, altered or protected by a passphrase" ;;
            *) hint="no '-----BEGIN ... PRIVATE KEY-----' line found" ;;
          esac
          echo "::error::the CECI_KEY secret is not a usable private ssh key ($(tr -d '\n' < /tmp/keycheck)): $hint"
          exit 1
        fi
        echo "CECI key: $(ssh-keygen -l -f ~/.ssh/id_ceci)"
        # Pinned host keys. If a cluster gets a new key, update this list with
        # e.g. `ssh manneback ssh-keyscan manneback`.
        cat >> ~/.ssh/known_hosts << 'EOF'
        gwceci.cism.ucl.ac.be ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGBlvDUHE7OlmvDCJy9QSKjqfeJ/CYAhT2PU2zYoFRkT
        manneback ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBGaBgO+bW1g7iBNmeO2HiZecq64OSlNGLWmPczWbjbvjZOIWLHiciLPjzR4FnHXABABCgLBSN4JPpCR5VRy82Vs=
        lemaitre4,lemaitre4.cism.ucl.ac.be ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOOQtD+ss6DxA3utrPLTPU31xdcnSNA8GWH3l4Tzl44Q
        EOF
        cat >> ~/.ssh/config << EOF
        Host gwceci
          HostName gwceci.cism.ucl.ac.be
        Host manneback lemaitre4
          ProxyJump gwceci
        Host gwceci manneback lemaitre4
          User $CECI_USER
          IdentityFile ~/.ssh/id_ceci
          IdentitiesOnly yes
          StrictHostKeyChecking yes
          ServerAliveInterval 60
          ServerAliveCountMax 5
        EOF
