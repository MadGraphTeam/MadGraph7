name: Release

# Fires once a GitHub Release is published (draft -> Publish release), never on
# a tag push by itself. Checks that main's CI was green for the tagged commit,
# publishes madspace (same version as the MadGraph release) and pyamplicol
# (that version + ".1") to PyPI, and attaches the MadGraph tarball and the pyamplicol
# prepared-model archive to the release. If anything fails, the release
# is reverted to draft so a half-published version never stays public.
#
# Two kinds of release, told apart by the tag:
#   v<MG>                 MadGraph release: madspace <MG> and pyamplicol <MG>.1
#   pyamplicol-v<MG>.<N>  standalone pyamplicol release, N >= 2, on top of the
#                         published MadGraph release v<MG>; only pyamplicol is
#                         built and published, plus its prepared-model archive.
# Both publish through this file so that one PyPI trusted publisher covers them.
#
# The test suites are deliberately NOT re-run here. Every commit on main is
# already tested by the push-triggered workflows, and the release tag points at
# one of those commits, so re-running them would test the same tree a second
# time for ~250 duplicated jobs. require_green_ci below gates on that existing
# run instead. (The suites also no longer trigger on tag pushes, for the same
# reason -- see the push.branches note in each of them.)
on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  # Other releases of this repository (e.g. benchmark data) are left alone.
  check_version:
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'pyamplicol-v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
      kind: ${{ steps.version.outputs.kind }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          case "$GITHUB_REF_NAME" in
            pyamplicol-v*) kind=pyamplicol; value=${GITHUB_REF_NAME#pyamplicol-v} ;;
            v*) kind=madgraph; value=${GITHUB_REF_NAME#v} ;;
            *) echo "::error::release tag $GITHUB_REF_NAME is neither v<MG> nor pyamplicol-v<MG>.<N>"; exit 1 ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Check VERSION / madspace / pyamplicol (<MG>.1) agree with the release tag
        if: steps.version.outputs.kind == 'madgraph'
        run: python3 bin/create_release.py --version "${{ steps.version.outputs.value }}" --check-only
      - name: Check the standalone pyamplicol version
        if: steps.version.outputs.kind == 'pyamplicol'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          python3 pyamplicol/tools/release/sync_version.py --check --version "$VERSION"
          mg=${VERSION%.*}
          if [ "${VERSION##*.}" -lt 2 ]; then
            echo "::error::pyamplicol $mg.1 is published by the MadGraph release v$mg, not by a pyamplicol-v tag."
            exit 1
          fi
          draft=$(gh release view "v$mg" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft) || {
            echo "::error::MadGraph release v$mg does not exist; publish it before pyamplicol-v$VERSION."
            exit 1
          }
          if [ "$draft" != "false" ]; then
            echo "::error::MadGraph release v$mg is still a draft; publish it before pyamplicol-v$VERSION."
            exit 1
          fi
          # Keep the MadGraph release as the repository's "latest" one.
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest=false \
            || echo "::warning::could not unmark $GITHUB_REF_NAME as the latest release"

  # The release gate: main's CI for the exact commit being released must have
  # finished and be green. Waits if it is still running, so publishing a release
  # straight after a merge works without having to watch CI by hand.
  require_green_ci:
    needs: check_version
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # merge-base below needs history

      - name: Check the release commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not on main."
            echo "::error::Releases are gated on main's CI run for the tagged commit, so the tag has to be on main."
            exit 1
          fi

      # Every suite that runs on a push to main. Kept as an explicit list on
      # purpose: "all runs for this commit were green" is vacuously true when
      # no run exists at all, which is exactly the failure mode that let
      # v0.2.0 publish untested -- hence absent_is_failure: 'true' below.
      #
      # madspin_parallel.yml is knowingly absent -- its push filter is
      # branches: ['3.x'], so it never runs on main and there is nothing to
      # gate on. See the tracking issue linked in the PR that added this.
      #
      # The full suite takes a few hours from cold; poll_timeout_minutes stays
      # under this job's own timeout-minutes so we report which suite hung
      # rather than having the runner killed out from under us.
      - name: Require main's CI for this commit to be green
        uses: ./.github/actions/require_green_ci
        with:
          sha: ${{ github.sha }}
          branch: main
          absent_is_failure: 'true'
          poll_timeout_minutes: '330'
          poll_interval_seconds: '60'
          required_workflows: |
            .github/workflows/unittest.yml
            .github/workflows/acceptancetest.yml
            .github/workflows/acceptancetest_madevent.yml
            .github/workflows/acceptancetest_mg7.yml
            .github/workflows/parralel.yml
            .github/workflows/IOtest.yml
            .github/workflows/aloha.yml
            .github/workflows/check_xsec_processes_mg7.yml
            .github/workflows/madspace.yml
            .github/workflows/pyamplicol.yml

  # Builds the wheels for every supported Python/platform. This one suite does
  # have to run at release time: the CI build on main only builds the
  # smoke-test subset, and nothing on main uploads to PyPI.
  madspace:
    needs: [check_version, require_green_ci]
    if: needs.check_version.outputs.kind == 'madgraph'
    uses: ./.github/workflows/madspace.yml
    with:
      full_matrix: true

  # Publishes the wheels madspace just built. This job MUST be defined here in
  # release.yml rather than in madspace.yml, even though that is where the
  # wheels are built: PyPI trusted publishing matches the OIDC job_workflow_ref
  # claim, which names the workflow file the *job* is defined in, not the
  # caller. A publish job inside the reusable workflow presents
  #   job_workflow_ref: .../madspace.yml@refs/tags/vX.Y.Z
  # and is rejected with "invalid-publisher" against the configured
  # "Workflow: release.yml" publisher, which is what happened to v0.2.0 in
  # run 34779296181. PyPI does not support reusable workflows here at all:
  # https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
  #
  # The environment name below is also part of the publisher's claims -- the
  # configured publisher sets Environment name: pypi, so dropping it would
  # leave the claim MISSING and fail the same way.
  publish_pypi:
    name: Publish to PyPI
    needs: madspace
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/madspace
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v5
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Builds and tests the pyamplicol sdist and wheels (and the prepared-model
  # archive they contain), validated by pyamplicol's own release tooling.
  pyamplicol:
    needs: require_green_ci
    uses: ./.github/workflows/pyamplicol.yml
    with:
      full_matrix: true

  # Defined here for the same reason as publish_pypi; pyamplicol's PyPI trusted
  # publisher names this workflow and the same "pypi" environment.
  # Waits for madspace on a MadGraph release; publish_pypi is skipped on a
  # standalone pyamplicol release.
  publish_pypi_pyamplicol:
    name: Publish pyamplicol to PyPI
    needs: [check_version, pyamplicol, publish_pypi]
    if: >-
      always() && needs.pyamplicol.result == 'success'
      && (needs.publish_pypi.result == 'success'
          || (needs.check_version.outputs.kind == 'pyamplicol'
              && needs.publish_pypi.result == 'skipped'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyamplicol
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download the validated dists
        uses: actions/download-artifact@v5
        with:
          name: pyamplicol-validated-release
          path: validated
      - name: Keep only the package files
        run: |
          mkdir dist
          find validated -name 'pyamplicol-*.whl' -exec cp {} dist/ \;
          find validated -name 'pyamplicol-*.tar.gz' -exec cp {} dist/ \;
          ls -l dist
      # Ported from pyAmpliCol's publish-pypi.yml: exactly the three platform
      # wheels and the one sdist, and no candidate build.
      - name: Verify the pyamplicol package inventory
        shell: python
        run: |
          from pathlib import Path

          files = sorted(path for path in Path("dist").iterdir() if path.is_file())
          wheels = [path for path in files if path.suffix == ".whl"]
          sdists = [path for path in files if path.name.endswith(".tar.gz")]
          if len(wheels) != 3 or len(sdists) != 1 or len(files) != 4:
              raise SystemExit(
                  f"expected three wheels and one sdist, found {len(wheels)} wheels "
                  f"and {len(sdists)} sdists"
              )
          expected = {"macosx_11_0_arm64", "macosx_11_0_x86_64", "manylinux_2_28_x86_64"}
          found = {
              next((tag for tag in expected if tag in path.name), None) for path in wheels
          }
          if found != expected:
              raise SystemExit(f"unexpected wheel platform inventory: {found}")
          if any("candidate" in path.name or "dev0" in path.name for path in files):
              raise SystemExit("candidate artifacts cannot be published")
          version = "${{ needs.check_version.outputs.kind == 'madgraph' && format('{0}.1', needs.check_version.outputs.version) || needs.check_version.outputs.version }}"
          stale = [path.name for path in files if f"pyamplicol-{version}" not in path.name]
          if stale:
              raise SystemExit(f"not pyamplicol {version}: {', '.join(stale)}")
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Standalone pyamplicol release: smoke-test the published package and attach
  # its prepared-model archive, which source installs of this version fetch.
  pyamplicol_assets:
    needs: [check_version, publish_pypi_pyamplicol]
    if: needs.check_version.outputs.kind == 'pyamplicol'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download the pyamplicol prepared-model archive
        uses: actions/download-artifact@v5
        with:
          name: pyamplicol-prepared-models
          path: dist
      - name: Smoke-test the published package
        env:
          VERSION: ${{ needs.check_version.outputs.version }}
        run: |
          # The just-published wheel may take a little while to be installable.
          for attempt in $(seq 10); do
            python -m pip install "pyamplicol==$VERSION" && break
            echo "attempt $attempt: pyamplicol==$VERSION not installable yet, retrying..."
            sleep 15
          done
          python -c "import pyamplicol, sys; assert pyamplicol.__version__ == sys.argv[1], pyamplicol.__version__" "$VERSION"
      - name: Upload the archive to the GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' dist/** --repo '${{ github.repository }}' --clobber

  tarball:
    needs:
      - check_version
      - publish_pypi
      - publish_pypi_pyamplicol
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history: create_release.py's authors.md needs it

      # The actual wheel filenames built for this release, so create_release.py
      # can record them in input/.release and install.py can later check
      # platform/Python availability locally instead of querying PyPI.
      - name: Download the madspace wheels built for this release
        uses: actions/download-artifact@v5
        with:
          pattern: cibw-*
          path: wheels
          merge-multiple: true

      - name: Download the pyamplicol wheels built for this release
        uses: actions/download-artifact@v5
        with:
          name: pyamplicol-validated-release
          path: pyamplicol-validated

      - name: Download the pyamplicol prepared-model archive
        uses: actions/download-artifact@v5
        with:
          name: pyamplicol-prepared-models
          path: dist

      - name: Collect the pyamplicol wheel names
        run: find pyamplicol-validated -name 'pyamplicol-*.whl' -exec cp {} wheels/ \;

      - name: Build the MadGraph tarball
        run: >
          python3 bin/create_release.py --version "${{ needs.check_version.outputs.version }}"
          --output dist --wheels-dir wheels

      - name: Smoke-test the tarball
        run: |
          set -e
          tar xzf dist/MG7_v${{ needs.check_version.outputs.version }}.tar.gz -C /tmp
          cd "/tmp/MG7_v$(echo "${{ needs.check_version.outputs.version }}" | tr . _)"

          # madgraph/VERSION is a symlink to ../VERSION: prove it survived packaging.
          grep -q "version = ${{ needs.check_version.outputs.version }}" madgraph/VERSION

          # The just-published PyPI wheel may take a little while to become
          # installable; retry rather than fail on the first miss.
          for attempt in $(seq 10); do
            python3 madspace/install.py --bin -y && break
            echo "attempt $attempt: madspace==${{ needs.check_version.outputs.version }} not installable yet, retrying..."
            sleep 15
          done
          test -d madspace/install/madspace

          # Also checks that Symbolica accepts pyamplicol's library key; only the
          # wheel download is retried, so a rejected key fails the step.
          for attempt in $(seq 10); do
            if python3 pyamplicol/install.py --bin -y; then status=0; break; else status=$?; fi
            # The wheel installed, so the license check failed: retrying cannot help.
            test -d pyamplicol/install/pyamplicol && break
            echo "attempt $attempt: pyamplicol==${{ needs.check_version.outputs.version }}.1 not installable yet, retrying..."
            sleep 15
          done
          test "$status" -eq 0
          test -d pyamplicol/install/pyamplicol

      - name: Sign the tarball with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: ./dist/MG7_v${{ needs.check_version.outputs.version }}.tar.gz

      - name: Upload tarball to the GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' dist/** --repo '${{ github.repository }}' --clobber

  revert_to_draft:
    needs:
      - check_version
      - require_green_ci
      - madspace
      - publish_pypi
      - pyamplicol
      - publish_pypi_pyamplicol
      - pyamplicol_assets
      - tarball
    # A skipped job has to count as a failure here: a job whose own guard is
    # false, or one whose dependency was skipped, is neither failure() nor
    # cancelled(), so the old condition let a run in which nothing but
    # check_version executed report success and leave the release published
    # untested. Each kind of release lists the jobs it must run.
    if: >-
      always()
      && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'pyamplicol-v'))
      && (contains(needs.*.result, 'failure')
      || contains(needs.*.result, 'cancelled')
      || needs.check_version.result != 'success'
      || needs.require_green_ci.result != 'success'
      || needs.pyamplicol.result != 'success'
      || needs.publish_pypi_pyamplicol.result != 'success'
      || (needs.check_version.outputs.kind == 'pyamplicol'
          && needs.pyamplicol_assets.result != 'success')
      || (needs.check_version.outputs.kind != 'pyamplicol'
          && (needs.madspace.result != 'success'
              || needs.publish_pypi.result != 'success'
              || needs.tarball.result != 'success')))
    runs-on: ubuntu-24.04
    steps:
      - name: Revert the release to draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release edit '${{ github.ref_name }}' --draft --repo '${{ github.repository }}'
          echo "::error::Release checks failed -- '${{ github.ref_name }}' was reverted to draft. Fix the issue and re-publish."
          # An ::error:: annotation does not set an exit code. Without this the
          # run is still green when the trigger was skipped jobs rather than a
          # failed one, which is exactly the case this job now catches.
          exit 1
