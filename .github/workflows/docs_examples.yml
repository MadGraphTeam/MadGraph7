name: MadSpace docs examples

# The other MG7 acceptance workflows all carry `paths-ignore: ['docs/**']`, so a
# docs-only commit currently triggers none of them. This workflow does the
# opposite: it triggers ONLY on the paths that can affect the documentation
# examples, so editing docs/source/madspace/examples/*.rst (or the event
# streaming example in docs/source/event_stream.rst) is actually tested.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'docs/source/madspace/examples/**'
      - 'docs/source/event_stream.rst'
      - 'madgraph/iolibs/template_files/mg7/**'
      - 'madgraph/mg7/**'
      - 'madspace/**'
      - 'tests/acceptance_tests/test_madspace_examples.py'
      - '.github/workflows/docs_examples.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/source/madspace/examples/**'
      - 'docs/source/event_stream.rst'
      - 'madgraph/iolibs/template_files/mg7/**'
      - 'madgraph/mg7/**'
      - 'madspace/**'
      - 'tests/acceptance_tests/test_madspace_examples.py'
      - '.github/workflows/docs_examples.yml'


  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the madspace install exactly once per workflow run, cached on the
  # madspace source hash (same composite action the mg7 workflow uses).
  build_madspace:
    runs-on: ubuntu-24.04
    if: ${{ (github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == true)) || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build_madspace
      - name: Cancel the other CI runs of this commit (fail fast)
        if: ${{ failure() && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'run-ci') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run list --repo "$REPO" --commit "$HEAD_SHA" --event pull_request --limit 300 \
            --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' |
          while read -r id; do
            [ "$id" = "$RUN_ID" ] || gh run cancel "$id" --repo "$REPO" || true
          done
          gh run cancel "$RUN_ID" --repo "$REPO" || true

  docs_examples:
    needs: build_madspace
    runs-on: ubuntu-24.04
    if: ${{ (github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == true)) || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/install_madspace
      - uses: ./.github/actions/restore_heptools_core
      - uses: ./.github/actions/restore-pip-cache
      - name: install torch and madnis (CPU wheel)
        run: >
            pip install --extra-index-url https://download.pytorch.org/whl/cpu
            torch madnis
      - name: run the madspace doc examples
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_madspace_example_simple_mappings test_madspace_example_cuts test_madspace_example_diagram_mapping test_madspace_example_integration_order test_madspace_example_matrix_element test_madspace_example_pdf test_madspace_example_integrator test_madspace_example_integrator_madnis test_madspace_example_flow_training test_gridpack_example_event_stream -pA -t0 -l INFO
      - name: Cancel the other CI runs of this commit (fail fast)
        if: ${{ failure() && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'run-ci') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run list --repo "$REPO" --commit "$HEAD_SHA" --event pull_request --limit 300 \
            --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' |
          while read -r id; do
            [ "$id" = "$RUN_ID" ] || gh run cancel "$id" --repo "$REPO" || true
          done
          gh run cancel "$RUN_ID" --repo "$REPO" || true
