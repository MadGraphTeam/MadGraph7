# .github/workflows/warm-caches.yml
name: Warm all caches

permissions:
  actions: write
  contents: read
on:
  push:
    paths:
      - '.github/workflows/warm_cache.yml'
      - '.github/actions/restore_heptools/**'
      - '.github/actions/restore_heptools_*/**'
      - '.github/actions/restore_root/**'
      - '.github/actions/restore_delphes/**'
  schedule:
    - cron: '0 3 * * 0,3'  # twice a week (Sun & Wed 3am): keep caches warm
  workflow_dispatch:
    inputs:
      reset_heptools:
        type: boolean
        default: false
      reset_ufo:
        type: boolean
        default: false
      reset_delphes:
        type: boolean
        default: false
        description: 'Rebuild the dedicated ROOT/Delphes cache (independent of heptools)'
      reset_pip:
        type: boolean
        default: false

  # Called from release.yml to warm caches before the release test suite runs,
  # so restore_heptools's fail-on-cache-miss doesn't abort the release.
  workflow_call:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  delete-cache:
    if: (github.ref_name == 'main' || github.ref_name == 'test_ci' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
#
    steps:
      - uses: actions/checkout@v5
#
      - name: Set cache key
        run: echo "CACHE_KEY=$ImageOS" >> $GITHUB_ENV
#
      # NB: 'inputs.reset_heptools' is a *boolean* for workflow_dispatch, and
      # GitHub coerces types to numbers on a loose comparison (true -> 1,
      # 'true' -> NaN), so `inputs.reset_heptools == 'true'` is always false.
      # Test the boolean itself.
      - name: Delete heptools related cache
        if: inputs.reset_heptools
        run: | 
          gh cache delete heptools-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
          gh cache delete lhapdf-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
          gh cache delete pythia8-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
          gh cache delete emela-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
          gh cache delete contur-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
          # looptools was missing here: an incomplete looptools-<os> cache could
          # therefore never be reset, and every later run would cache-hit on it.
          gh cache delete looptools-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delete ufo cache
        if: inputs.reset_ufo
        run: |
          gh cache delete ufomodel-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delete pip cache
        if: inputs.reset_pip
        run: | 
          gh cache delete pip-numpy-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
        env:
          GH_TOKEN: ${{ github.token }}

      # ROOT/Delphes are deliberately NOT reset on the weekly schedule (they are
      # large and stable). They are only rebuilt on explicit request, so the
      # cache can be cleaned independently of the heptools one.
      - name: Delete root/delphes cache
        if: inputs.reset_delphes
        run: |
          gh cache delete root-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
          gh cache delete delphes-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
        env:
          GH_TOKEN: ${{ github.token }}

  rebuild-numpy-cache:
    if: (github.ref_name == 'main' || github.ref_name == 'test_ci' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name == 'schedule')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    needs: delete-cache
    steps:
      - name: Set cache key
        run: echo "CACHE_KEY=$ImageOS" >> $GITHUB_ENV

      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip-packages
          key: pip-numpy-${{ env.CACHE_KEY }}

      - name: Install numpy (+ meson/ninja for f2py) into cache dir (if not cached)
        if: steps.cache-pip.outputs.cache-hit != 'true'
        # meson + ninja are required by numpy>=1.26's f2py meson backend (used on
        # ubuntu-24 / py3.12 to compile the Fortran matrix-element wrappers, e.g.
        # all_matrix2py.so for MadSpin/reweight). restore-pip-cache puts this
        # dir on PYTHONPATH and its bin/ on PATH, so the meson/ninja executables
        # are then found wherever the pip cache is restored.
        run: pip install --target ~/.cache/pip-packages --ignore-installed numpy meson ninja

  ufo_cache:
    if: (github.ref_name == 'main' || github.ref_name == 'test_ci' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    needs: delete-cache

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
     - name: Cache UFO MODEL
       id: cache-ufo
       uses: actions/cache@v5
       with:
         path: ~/.cache/UFOMODEL
         key: ufomodel

     - uses: actions/checkout@v5
       if: steps.cache-ufo.outputs.cache-hit != 'true'

     - name: Install UFO model
       if: steps.cache-ufo.outputs.cache-hit != 'true'
       run: |
         mkdir -p /home/runner/.cache/UFOMODEL
         echo "PYTHONPATH=$PYTHONPATH:$HOME/.cache/UFOMODEL" >> $GITHUB_ENV
         echo "import model 2HDM" >> cmd
         ./bin/madgraph cmd

     - name: move UFO model to cache
       if: steps.cache-ufo.outputs.cache-hit != 'true'
       run: |
         cp -r models/2HDM /home/runner/.cache/UFOMODEL
           
  lhapdf_cache:
    if: (github.ref_name == 'main' || github.ref_name == 'test_ci' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.event_name != 'schedule'
    needs: delete-cache
    runs-on: ${{ matrix.os }}
    strategy:
     matrix:
       os: [ubuntu-24.04]

     # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

       - name: Set cache key
         run: echo "CACHE_KEY=$ImageOS" >> $GITHUB_ENV
       - name: Cache lhapdf packages
         id: cache-lhapdf
         uses: actions/cache@v5
         with:
           path: ~/.cache/HEPtools
           key: lhapdf-${{ env.CACHE_KEY }}

       - name: get mg5
         uses: actions/checkout@v5
         if: steps.cache-lhapdf.outputs.cache-hit != 'true'

       - name: Install lhapdf into cache dir
         if: steps.cache-lhapdf.outputs.cache-hit != 'true'
         run: |
               mkdir -p /home/runner/.cache/HEPtools
               cd $GITHUB_WORKSPACE
               echo "heptools_install_dir=/home/runner/.cache/HEPtools" >> input/mg7_configuration.txt
               cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
               echo "install lhapdf6" > cmd
               ./bin/madgraph cmd

       - name: get pdf set for NLO
         if: steps.cache-lhapdf.outputs.cache-hit != 'true'
         run: |
               cd /home/runner/.cache/HEPtools/lhapdf6_py3/share/LHAPDF
               wget https://lhapdfsets.web.cern.ch/current/NNPDF23_nlo_as_0118_qed.tar.gz
               tar -xzpvf NNPDF23_nlo_as_0118_qed.tar.gz
               wget https://lhapdfsets.web.cern.ch/lhapdfsets/current/cteq6l1.tar.gz
               tar -xzpvf cteq6l1.tar.gz
               # LO set used by the mg7 run_card.toml default and by the
               # legacy LO run_card (pdlabel=lhapdf, lhaid=331900)
               wget https://lhapdfsets.web.cern.ch/current/NNPDF40_lo_as_01180.tar.gz
               tar -xzpvf NNPDF40_lo_as_01180.tar.gz
               # NLO run_card defaults: 5-flavour (331700) and, for a model with
               # a massive b, the 4-flavour set (334700)
               wget https://lhapdfsets.web.cern.ch/current/NNPDF40_nlo_as_01180.tar.gz
               tar -xzpvf NNPDF40_nlo_as_01180.tar.gz
               wget https://lhapdfsets.web.cern.ch/current/NNPDF40_nlo_as_01180_nf_4.tar.gz
               tar -xzpvf NNPDF40_nlo_as_01180_nf_4.tar.gz
               # previous mg7 default; still pinned by some tests
               wget https://lhapdfsets.web.cern.ch/current/NNPDF40MC_lo_as_01180.tar.gz
               tar -xzpvf NNPDF40MC_lo_as_01180.tar.gz
               # previous mg7 default; still pinned by the mg7 cross-section
               # reference tests (tests/acceptance_tests/test_check_xsec_processes_mg7.py)
               wget https://lhapdfsets.web.cern.ch/current/NNPDF23_lo_as_0130_qed.tar.gz
               tar -xzpvf NNPDF23_lo_as_0130_qed.tar.gz
               
  pythia8_cache:
    if: (github.ref_name == 'main' || github.ref_name == 'test_ci' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    needs: lhapdf_cache
    strategy:
     matrix:
       os: [ubuntu-24.04]

     # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

       - name: Set cache key
         run: echo "CACHE_KEY=$ImageOS" >> $GITHUB_ENV
       - name: Cache pythia8 packages
         id: cache-pythia8
         uses: actions/cache@v5
         with:
           path: ~/.cache/HEPtools
           key: pythia8-${{ env.CACHE_KEY }}

       - name: get mg5
         if: steps.cache-pythia8.outputs.cache-hit != 'true'
         uses: actions/checkout@v5

       - name: restore lhapdf cache
         if: steps.cache-pythia8.outputs.cache-hit != 'true'
         uses: ./.github/actions/restore_heptools_lhapdf

       - name: Install pythia8 into cache dir (in top of lhapdf cache)
         if: steps.cache-pythia8.outputs.cache-hit != 'true'
         # Compile pythia8 (and its hepmc dependency) in parallel across the
         # runner's vCPUs; MAKEFLAGS is inherited by every make the installer
         # spawns. Same speed-up as the contur build.
         env:
           MAKEFLAGS: "-j4"
         run: |
               mkdir -p /home/runner/.cache/HEPtools
               cd $GITHUB_WORKSPACE
               echo "heptools_install_dir=/home/runner/.cache/HEPtools" >> input/mg7_configuration.txt
               cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
               echo "install pythia8" > cmd
               ./bin/madgraph cmd

       - name: Verify pythia8 landed in the cache
         if: steps.cache-pythia8.outputs.cache-hit != 'true'
         run: |
               # madgraph exits 0 even when "install pythia8" fails (e.g. a network
               # timeout while downloading hepmc/pythia8 from the download server),
               # so guard the cache here. Without Pythia.h, MG5 nullifies
               # pythia8_path at startup, leaving the parton shower unavailable and
               # breaking the rivet/contur acceptance tests. Fail loudly instead of
               # saving a pythia8-less heptools cache.
               test -f /home/runner/.cache/HEPtools/pythia8/include/Pythia8/Pythia.h
               test -x /home/runner/.cache/HEPtools/pythia8/bin/pythia8-config

  emela_cache:
    if: (github.ref_name == 'main' || github.ref_name == 'test_ci' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    needs: lhapdf_cache
    strategy:
     matrix:
       os: [ubuntu-24.04]

     # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

       - name: Set cache key
         run: echo "CACHE_KEY=$ImageOS" >> $GITHUB_ENV
       - name: Cache eMELA packages
         id: cache-eMELA
         uses: actions/cache@v5
         with:
           path: ~/.cache/HEPtools
           key: emela-${{ env.CACHE_KEY }}

       - name: get mg5
         if: steps.cache-eMELA.outputs.cache-hit != 'true'
         uses: actions/checkout@v5
       
       - name: restore lhapdf cache
         if: steps.cache-eMELA.outputs.cache-hit != 'true'
         uses: ./.github/actions/restore_heptools_lhapdf

       - name: Install eMELA into cache dir (if not cached)
         if: steps.cache-eMELA.outputs.cache-hit != 'true'
         run: |
               mkdir -p /home/runner/.cache/HEPtools
               cd $GITHUB_WORKSPACE
               echo "heptools_install_dir=/home/runner/.cache/HEPtools" >> input/mg7_configuration.txt
               cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
               echo "install eMELA" > cmd
               ./bin/madgraph cmd
            
#  delete_lhapdf_cache:
#     runs-on: ${{ matrix.os }}
#     needs: 
#       - pythia8_cache
#       - emela_cache
#     strategy:
#       matrix:
#         os: [ubuntu-24.04]
#     steps:
#       - name: Set cache key                  
#         run: echo "CACHE_KEY=$ImageOS" >> $GITHUB_ENV
#       - name: Delete lhapdf cache (included both in emela/pythia8 cache)
#         run: |
#             gh cache delete lhapdf-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY || true
#         env:
#             GH_TOKEN: ${{ github.token }}

  contur_cache:
    if: (github.ref_name == 'main' || github.ref_name == 'test_ci' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    needs: pythia8_cache
    strategy:
     matrix:
       os: [ubuntu-24.04]

     # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
       - name: Set cache key
         run: echo "CACHE_KEY=$ImageOS" >> $GITHUB_ENV
       - name: check Cache rivet/contur packages
         id: cache-contur
         uses: actions/cache@v5
         with:
           path: ~/.cache/HEPtools
           key: contur-${{ env.CACHE_KEY }}

       - name: get mg5
         if: steps.cache-contur.outputs.cache-hit != 'true'
         uses: actions/checkout@v5
       
       - name: restore previous cache (pythia8)  
         if: steps.cache-contur.outputs.cache-hit != 'true'
         uses: ./.github/actions/restore_heptools_pythia8

       - name: Install contur into cache dir
         if: steps.cache-contur.outputs.cache-hit != 'true'
         # rivet is the long pole of the whole cache build (~36 min, single
         # threaded). MAKEFLAGS is inherited by every make the installer spawns,
         # so an unqualified "make" becomes a parallel build across the runner's
         # vCPUs. Harmless if a sub-build pins its own -j.
         env:
           MAKEFLAGS: "-j4"
         run: |
               # YODA's python extension build needs Cython (no longer shipped by
               # default on the GitHub runner image); without it rivet aborts at
               # YODA, before FastJet is installed, leaving NLO builds broken.
               # Install into the same interpreter madgraph/YODA use (no sudo, so
               # the system Python is left untouched for other steps).
               python3 -m pip install Cython
               mkdir -p /home/runner/.cache/HEPtools
               cd $GITHUB_WORKSPACE
               echo "heptools_install_dir=/home/runner/.cache/HEPtools" >> input/mg7_configuration.txt
               cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
               echo "install rivet" > cmd
               echo "install contur" >> cmd
               ./bin/madgraph cmd

       - name: Verify rivet/fastjet landed in the cache
         if: steps.cache-contur.outputs.cache-hit != 'true'
         run: |
               # madgraph exits 0 even when "install rivet" fails, so guard the
               # cache here: a missing fastjet-config means NLO subprocesses cannot
               # compile (fastjet/ClusterSequence.hh). Fail loudly instead of
               # saving an incomplete heptools cache.
               test -x /home/runner/.cache/HEPtools/fastjet/bin/fastjet-config

       #- name: Delete pythia8 cache (include in contur cache)
       #  run: |
       #      gh cache delete pythia8-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY || true
       #  env:
       #     GH_TOKEN: ${{ github.token }}

  looptools_cache:
    if: (github.ref_name == 'main' || github.ref_name == 'test_ci' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
     matrix:
       os: [ubuntu-24.04]
    needs:
    - delete-cache

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
     - name: Set cache key
       run: echo "CACHE_KEY=$ImageOS" >> $GITHUB_ENV
     - name: Cache loop packages (iregi/cutools)
       id: cache-nlo
       uses: actions/cache@v5
       with:
         path: ~/.cache/HEPtools
         key: looptools-${{ env.CACHE_KEY }} # key to change if not final step
      
     - name: get mg5
       if: steps.cache-nlo.outputs.cache-hit != 'true'
       uses: actions/checkout@v5

     - name: Install cuttools/iregi into cache dir
       if: steps.cache-nlo.outputs.cache-hit != 'true'
       run: |
             mkdir -p /home/runner/.cache/HEPtools/CutTools/lib
             mkdir -p /home/runner/.cache/HEPtools/IREGI/src
             cd $GITHUB_WORKSPACE
             echo "heptools_install_dir=/home/runner/.cache/HEPtools" >> input/mg7_configuration.txt
             cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
             cd vendor/IREGI/src
             make
             cd ../../CutTools
             make
             cd ../../
             cp -r vendor/IREGI/src/libiregi.a /home/runner/.cache/HEPtools/IREGI/src/
             cp -r vendor/./CutTools/includects/libcts.a /home/runner/.cache/HEPtools/CutTools/lib
             cp -r vendor/./CutTools/includects/mpmodule.mod /home/runner/.cache/HEPtools/CutTools/lib

     - name: Install ninja/collier into cache dir 
       if: steps.cache-nlo.outputs.cache-hit != 'true'
       run: |
             mkdir -p ~/.cache/HEPtools
             cd $GITHUB_WORKSPACE
             echo "heptools_install_dir=/home/runner/.cache/HEPtools" >> input/mg7_configuration.txt
             cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
             echo "install collier " > cmd
             echo "install ninja " >> cmd
             ./bin/madgraph cmd

     # madgraph exits 0 even when "install collier"/"install ninja" fails (e.g.
     # a download timeout), so the job would otherwise go green with a
     # half-populated cache -- and heptools_cache would then fold that into the
     # combined cache and delete the sub-caches. Fail here instead: actions/cache
     # does not run its post-save step when the job fails, so no incomplete
     # looptools-<os> cache is stored and a re-run of *this job only* rebuilds it.
     # Runs on the cache-hit path too, so an already-stored incomplete cache is
     # reported instead of being silently reused (fix it with the reset_heptools
     # input, which now also deletes looptools-<os>).
     - name: Verify looptools landed in the cache
       run: |
             set -e
             H=$HOME/.cache/HEPtools
             # paths as consumed by .github/actions/restore_heptools_looptools
             # (ninja = $H/ninja/lib, collier = $H/collier) and by the NLO
             # subprocess makefiles (libcts.a / mpmodule.mod / libiregi.a).
             for f in \
                 "$H/CutTools/lib/libcts.a" \
                 "$H/CutTools/lib/mpmodule.mod" \
                 "$H/IREGI/src/libiregi.a" \
                 "$H/ninja/lib/libninja.a" \
                 "$H/collier/libcollier.a" ; do
               if [ ! -f "$f" ]; then
                 echo "::error::looptools cache is incomplete: missing $f"
                 MISSING=1
               fi
             done
             if [ -n "$MISSING" ]; then
               echo "cache-hit was '${{ steps.cache-nlo.outputs.cache-hit }}'"
               exit 1
             fi
             echo "looptools content OK (cuttools, iregi, ninja, collier)"

  heptools_cache:
    if: always() && (github.ref_name == 'main' || github.ref_name == 'test_ci' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}       
    strategy:
      matrix:
        os: [ubuntu-24.04]
    needs: [lhapdf_cache, pythia8_cache, emela_cache, looptools_cache, contur_cache]
    steps:
      - name: Set cache key
        run: echo "CACHE_KEY=$ImageOS" >> $GITHUB_ENV

      - name: Restore pythia8 (if available)
        if: needs.pythia8_cache.result == 'success'
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/HEPtools
          key: pythia8-${{ env.CACHE_KEY }}

      - name: Restore emela (if available)
        if: needs.emela_cache.result == 'success'
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/HEPtools
          key: emela-${{ env.CACHE_KEY }}

      - name: Restore lhapdf (fallback when pythia8 and emela failed)
        if: needs.lhapdf_cache.result == 'success' && (needs.pythia8_cache.result != 'success' || needs.emela_cache.result != 'success')
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/HEPtools
          key: lhapdf-${{ env.CACHE_KEY }}
      - name: Restore contur (if available)
        if: needs.contur_cache.result == 'success'
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/HEPtools
          key: contur-${{ env.CACHE_KEY }}

      - name: Restore looptools (if available)
        if: needs.looptools_cache.result == 'success'
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/HEPtools
          key: looptools-${{ env.CACHE_KEY }}

      # A green sub-job is NOT proof that its content landed in the cache: the
      # installers run through ./bin/madgraph, which exits 0 even when a tool
      # fails to build. That is how an incomplete looptools (no collier/ninja)
      # got folded into the combined cache and the sub-caches were deleted
      # afterwards, losing the only good copies. So validate the *restored
      # files* here, and let a single flag gate the delete/save/cleanup below.
      # When something is missing the intermediate caches are kept untouched,
      # so re-running just the offending job (or the whole workflow) rebuilds
      # only the missing piece instead of everything.
      - name: Validate restored heptools content
        id: validate
        env:
          LHAPDF_RESULT: ${{ needs.lhapdf_cache.result }}
          PYTHIA8_RESULT: ${{ needs.pythia8_cache.result }}
          EMELA_RESULT: ${{ needs.emela_cache.result }}
          CONTUR_RESULT: ${{ needs.contur_cache.result }}
          LOOPTOOLS_RESULT: ${{ needs.looptools_cache.result }}
        run: |
          H=$HOME/.cache/HEPtools
          MISSING=""
          # req <tool> <file>... : record <tool> as incomplete if any file is absent
          req() {
            tool=$1; shift
            for f in "$@"; do
              if [ ! -e "$f" ]; then
                echo "::warning::$tool incomplete: missing $f"
                case " $MISSING " in
                  *" $tool "*) ;;
                  *) MISSING="$MISSING $tool" ;;
                esac
              fi
            done
          }

          req lhapdf    "$H/lhapdf6_py3/bin/lhapdf-config"
          req pythia8   "$H/pythia8/include/Pythia8/Pythia.h" \
                        "$H/pythia8/bin/pythia8-config"
          req emela     "$H/bin/eMELA-config"
          req contur    "$H/fastjet/bin/fastjet-config" "$H/rivet"
          # the four looptools pieces, exactly as consumed by
          # .github/actions/restore_heptools_looptools and the NLO makefiles
          req looptools "$H/CutTools/lib/libcts.a" \
                        "$H/CutTools/lib/mpmodule.mod" \
                        "$H/IREGI/src/libiregi.a" \
                        "$H/ninja/lib/libninja.a" \
                        "$H/collier/libcollier.a"

          # a job that did not succeed cannot have contributed anything
          for j in lhapdf pythia8 emela contur looptools; do
            var=$(echo $j | tr 'a-z' 'A-Z')_RESULT
            eval "res=\$$var"
            if [ "$res" != "success" ]; then
              echo "::warning::${j}_cache job result is '$res'"
              case " $MISSING " in
                *" $j "*) ;;
                *) MISSING="$MISSING $j" ;;
              esac
            fi
          done

          MISSING=$(echo $MISSING)
          if [ -n "$MISSING" ]; then
            echo "complete=false" >> $GITHUB_OUTPUT
            echo "missing=$MISSING" >> $GITHUB_OUTPUT
            echo "::error::heptools is incomplete ($MISSING): the combined cache will NOT be refreshed and the intermediate caches are kept, so only the failing part has to be rebuilt."
          else
            echo "complete=true" >> $GITHUB_OUTPUT
            echo "missing=" >> $GITHUB_OUTPUT
            echo "all heptools present (lhapdf, pythia8, emela, contur, looptools)"
          fi

      # GitHub Actions caches are immutable: actions/cache/save is a silent
      # no-op when the key already exists (it logs "Unable to reserve cache
      # ... another job may be creating this cache" and the freshly rebuilt
      # combined cache is discarded). Outside the Sunday cron / reset_heptools
      # the old heptools-$KEY therefore never gets replaced. Delete it first so
      # the new content is actually saved. Only do this (and the save) once all
      # sub-caches succeeded *and* their content is really on disk, so a partial
      # rebuild never replaces a good cache.
      - name: Delete previous combined cache (so the fresh one can be saved)
        if: steps.validate.outputs.complete == 'true'
        run: gh cache delete heptools-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/cache/save@v5
        if: steps.validate.outputs.complete == 'true'
        with:
          path: ~/.cache/HEPtools
          key: heptools-${{ env.CACHE_KEY }}

      - name: Cleanup intermediate caches (only if all succeeded)
        if: steps.validate.outputs.complete == 'true'
        run: |
          gh cache delete lhapdf-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
          gh cache delete pythia8-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
          gh cache delete emela-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
          gh cache delete contur-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
          gh cache delete looptools-${{ env.CACHE_KEY }} --repo $GITHUB_REPOSITORY --ref "${{ github.ref }}" || true
        env:
          GH_TOKEN: ${{ github.token }}

      # Without this the job goes green while having silently skipped the
      # combine, which is exactly how the problem stayed invisible.
      - name: Report the incomplete combine
        if: steps.validate.outputs.complete != 'true'
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ### heptools cache NOT refreshed

          Incomplete: \`${{ steps.validate.outputs.missing }}\`

          The intermediate caches (lhapdf/pythia8/emela/contur/looptools) were
          **kept**, so re-running only the failing job above is enough: the
          others will cache-hit and this job will combine and clean up.
          If the stale sub-cache itself is the incomplete one, re-run this
          workflow via *Run workflow* with \`reset_heptools\` ticked to drop it
          first.
          EOF
          exit 1

  # On the scheduled run the heptools rebuild chain is skipped (the *_cache jobs
  # are guarded with github.event_name != 'schedule'). Restore the combined
  # heptools cache here so its 7-day eviction timer is reset and it stays warm
  # without recompiling anything. ufo/numpy/root/delphes already keep themselves
  # warm via their own cache-hit restores on the scheduled run.
  keep-warm-heptools:
    if: github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - name: Set cache key
        run: echo "CACHE_KEY=$ImageOS" >> $GITHUB_ENV
      - name: Restore (touch) the combined heptools cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/HEPtools
          key: heptools-${{ env.CACHE_KEY }}


  # ---------------------------------------------------------------------------
  # Dedicated ROOT + Delphes caches (kept separate from the heptools cache).
  # Delphes depends only on ROOT, so root_cache is built first and delphes_cache
  # is stacked on top of it.
  #
  # These are version-pinned and stable, so they are NOT force-rebuilt. The
  # weekly run (and every PR restoring them) simply reads the cache, which
  # resets GitHub's 7-day eviction timer and keeps it warm without re-downloading
  # the (~identical) ROOT binary or recompiling Delphes. If the cache was evicted
  # (idle >7 days or repo size pressure), the cache-miss branch below rebuilds it
  # automatically. Use the reset_delphes input to force a rebuild, e.g. when
  # bumping the ROOT version.
  # ---------------------------------------------------------------------------
  root_cache:
     runs-on: ${{ matrix.os }}
     needs: delete-cache
     strategy:
       matrix:
         os: [ubuntu-24.04]

     steps:
       - name: Set cache key
         run: echo "CACHE_KEY=$ImageOS" >> $GITHUB_ENV

       - name: Cache ROOT
         id: cache-root
         uses: actions/cache@v5
         with:
           path: ~/.cache/Delphes
           key: root-${{ env.CACHE_KEY }}

       - name: Install ROOT runtime dependencies
         if: steps.cache-root.outputs.cache-hit != 'true'
         run: |
               sudo apt-get update
               sudo apt-get install -y libtbb12 libvdt0 libgsl-dev || true

       - name: Install ROOT binary into the dedicated cache dir
         if: steps.cache-root.outputs.cache-hit != 'true'
         # ROOT.cern publishes per-image binary builds. Bump ROOT_VERSION / the
         # gcc tags below when moving to a newer image; the filename must match
         # an existing build at https://root.cern/download/ .
         # NOTE: the same install logic is duplicated in the cache-miss fallback
         # of .github/actions/restore_root/action.yml - keep them in sync.
         run: |
               mkdir -p $HOME/.cache/Delphes
               cd $HOME/.cache/Delphes
               ROOT_VERSION=6.40.02
               case "$ImageOS" in
                 ubuntu22) ROOT_TARBALL=root_v${ROOT_VERSION}.Linux-ubuntu22.04-x86_64-gcc11.4.tar.gz ;;
                 ubuntu24) ROOT_TARBALL=root_v${ROOT_VERSION}.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz ;;
                 *) echo "Unsupported runner image: $ImageOS"; exit 1 ;;
               esac
               wget -q "https://root.cern/download/${ROOT_TARBALL}"
               tar -xzf "${ROOT_TARBALL}"
               rm -f "${ROOT_TARBALL}"

       - name: Verify ROOT landed in the cache
         if: steps.cache-root.outputs.cache-hit != 'true'
         run: |
               test -x $HOME/.cache/Delphes/root/bin/root-config
               $HOME/.cache/Delphes/root/bin/root-config --version

  delphes_cache:
     runs-on: ${{ matrix.os }}
     needs: root_cache
     strategy:
       matrix:
         os: [ubuntu-24.04]

     steps:
       - name: Set cache key
         run: echo "CACHE_KEY=$ImageOS" >> $GITHUB_ENV

       - name: Cache Delphes (stacked on top of ROOT)
         id: cache-delphes
         uses: actions/cache@v5
         with:
           path: ~/.cache/Delphes
           key: delphes-${{ env.CACHE_KEY }}

       - name: get mg5
         if: steps.cache-delphes.outputs.cache-hit != 'true'
         uses: actions/checkout@v5

       - name: restore ROOT cache (dependency)
         if: steps.cache-delphes.outputs.cache-hit != 'true'
         uses: ./.github/actions/restore_root

       - name: Install Delphes into the dedicated cache dir
         if: steps.cache-delphes.outputs.cache-hit != 'true'
         env:
           MAKEFLAGS: "-j4"
         run: |
               cd $GITHUB_WORKSPACE
               cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
               echo "install Delphes" > cmd
               ./bin/madgraph cmd
               # MG installs Delphes into MG5DIR/Delphes; move it next to ROOT so
               # the whole tool set lives in the dedicated cache.
               rm -rf $HOME/.cache/Delphes/Delphes
               mv $GITHUB_WORKSPACE/Delphes $HOME/.cache/Delphes/Delphes

       - name: Verify Delphes landed in the cache
         if: steps.cache-delphes.outputs.cache-hit != 'true'
         run: |
               test -x $HOME/.cache/Delphes/Delphes/DelphesHepMC2
