name: alma10 probe (temporary)

# TEMPORARY: validates on the alma10 runners what docs.yml `gate` needs (it only
# runs on push to main, so a branch push cannot exercise it). Remove before
# merging.
on:
  push:
    branches: [claude/alma10-light-jobs]

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: [self-hosted, alma10]
    steps:
      - name: runner tools and resources
        run: |
          hostname; nproc; free -m; df -h "$HOME" | tail -1
          for t in gh jq git curl tar python3 gfortran gcc make; do
            printf '%-9s %s\n' "$t" "$(command -v $t || echo MISSING)"
          done
      - uses: actions/checkout@v5
      # a main commit whose aloha.yml push run is green: must pass
      - uses: ./.github/actions/require_green_ci
        with:
          sha: 1af7a6da2a2407f873c295099d02e1d2f5ba9122
          branch: main
          required_workflows: |
            .github/workflows/aloha.yml
          poll_timeout_minutes: '5'
