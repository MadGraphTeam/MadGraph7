# GPU CI on a CECI cluster, through a self-hosted runner that lives inside ONE Slurm
# allocation per workflow run: all the CI jobs below share that allocation.
# Called by gpu_manneback_cuda.yml and gpu_lemaitre4_hip.yml; see .github/gpu_ci/README.md.
#
#   start_runner    vmadgraph       ask ceci-gate, on the vmadgraph VM, to sbatch the runner
#                                   on the GPU partition; wait until it is online
#   build_madspace  cluster runner  madspace with the CUDA/HIP backend (cached on the cluster)
#   pp_ttx          cluster runner  p p > t t~ with mg7 on the GPU
#   pp_jj           cluster runner  p p > j j with mg7 on the GPU (cuts on several jets)
#   madspace_ops    cluster runner  madspace GPU operations against the CPU runtime, .github/gpu_ci/madspace_checks.py
#   interference    cluster runner  squared split orders (interference), .github/gpu_ci/interference_gpu.sh
#   ...             cluster runner  more CI jobs: same runs-on, and add them to stop_runner's needs
#   stop_runner     cluster runner  clean up and end the allocation (no ssh key needed)
#
# The runner runs under a personal cluster account, hence:
#   - the ssh key is not on GitHub: only the Unix user `ceci` of the vmadgraph VM holds it,
#     and the CI reaches the cluster through /usr/local/sbin/ceci-gate (.github/gpu_ci/vm_gate),
#     which checks with the GitHub API that the run is in progress, comes from
#     gpu_lemaitre4_hip.yml or gpu_manneback_cuda.yml, and was started by a GitHub login or
#     is on a branch listed on the VM (/etc/ceci-gate/allowed_actors, allowed_branches);
#   - the runner refuses every job that is not part of the workflow run that started it
#     (.github/gpu_ci/job_started_hook.sh), so no other run can use it.

name: GPU CI on a CECI cluster (reusable)

on:
  workflow_call:
    inputs:
      cluster:
        description: 'cluster known to ceci-gate (.github/gpu_ci/vm_gate/ceci-gate): lemaitre4 or manneback'
        type: string
        required: true
      runner_label:
        description: 'label (and name) of the runner registered by .github/gpu_ci/install_runner.sh; must be the label ceci-gate starts for the cluster'
        type: string
        required: true
      partition:
        description: 'Slurm partition'
        type: string
        required: true
      backend:
        description: 'GPU backend: cuda or hip'
        type: string
        required: true
      modules:
        description: 'Modules to load on the GPU node, in order (space separated)'
        type: string
        required: true
      gres:
        type: string
        default: 'gpu:1'
      cpus:
        type: string
        default: '8'
      mem:
        type: string
        default: '32G'
      time_limit:
        description: 'Slurm --time of the runner allocation, i.e. of all the CI jobs together'
        type: string
        default: '00:20:00'
      extra_sbatch:
        description: 'Extra sbatch options, space separated, no quotes'
        type: string
        default: ''
      gpu_arch:
        description: 'CUDA compute capability (e.g. 80) or HIP target (e.g. gfx942); empty = the GPU of the node'
        type: string
        default: ''
      nevents:
        type: string
        default: '10000'
      pdf_set:
        type: string
        default: 'NNPDF23_lo_as_0130_qed'
      keep_workdir:
        description: 'Keep the run directory on the cluster even if every job succeeds'
        type: boolean
        default: false
      interference:
        description: 'Also run the interference (squared split-order) checks, .github/gpu_ci/interference_gpu.sh'
        type: boolean
        default: false

env:
  RUN_TAG: mg7-run-${{ github.run_id }}-${{ github.run_attempt }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  start_runner:
    # one vmadgraph runner per cluster (labels vmadgraph-lemaitre4 / vmadgraph-manneback), so a
    # run waiting in one cluster's Slurm queue does not block the other; see .github/gpu_ci/README.md
    runs-on: [self-hosted, vmadgraph, "vmadgraph-${{ inputs.cluster }}"]
    timeout-minutes: 300 # mostly the time the runner job waits in the Slurm queue
    env:
      CLUSTER: ${{ inputs.cluster }}
      PARTITION: ${{ inputs.partition }}
      GRES: ${{ inputs.gres }}
      CPUS: ${{ inputs.cpus }}
      MEM: ${{ inputs.mem }}
      TIME_LIMIT: ${{ inputs.time_limit }}
      EXTRA_SBATCH: ${{ inputs.extra_sbatch }}
    steps:
      # ceci-gate starts the runner `runner_label` of the cluster (fixed in ceci-gate), with the
      # cluster scripts installed on the VM, not the ones of this checkout
      - name: start the runner in a Slurm job and wait until it is online
        run: |
          sudo -n -u ceci /usr/local/sbin/ceci-gate start-runner "$CLUSTER" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            --partition="$PARTITION" --gres="$GRES" --cpus="$CPUS" --mem="$MEM" --time="$TIME_LIMIT" \
            --extra="$EXTRA_SBATCH"

  build_madspace:
    needs: start_runner
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -l -eo pipefail {0}
    env:
      BACKEND: ${{ inputs.backend }}
      MODULES: ${{ inputs.modules }}
      GPU_ARCH: ${{ inputs.gpu_arch }}
    outputs:
      venv: ${{ steps.build.outputs.venv }}
      madspace_prefix: ${{ steps.build.outputs.madspace_prefix }}
    steps:
      - name: where are we
        run: echo "Slurm job $SLURM_JOB_ID on $(hostname), partition $SLURM_JOB_PARTITION, $SLURM_CPUS_PER_TASK cpus"
      - uses: actions/checkout@v5
      - name: build madspace for ${{ inputs.backend }}
        id: build
        run: .github/gpu_ci/build_madspace_gpu.sh

  pp_ttx:
    needs: build_madspace
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -l -eo pipefail {0}
    env:
      BACKEND: ${{ inputs.backend }}
      MODULES: ${{ inputs.modules }}
      GPU_ARCH: ${{ inputs.gpu_arch }}
      NEVENTS: ${{ inputs.nevents }}
      PDF_SET: ${{ inputs.pdf_set }}
      VENV: ${{ needs.build_madspace.outputs.venv }}
      MADSPACE_PREFIX: ${{ needs.build_madspace.outputs.madspace_prefix }}
    steps:
      - uses: actions/checkout@v5
      - name: run directory
        run: echo "WORKDIR=${GLOBALSCRATCH:-$HOME}/mg7-gpu-ci/runs/$RUN_TAG/pp_ttx" >> "$GITHUB_ENV"
      - name: p p > t t~ on the GPU
        run: .github/gpu_ci/pp_ttx_mg7.sh
      - name: collect logs and cards
        if: always()
        run: |
          mkdir -p results
          (cd "$WORKDIR" && tar -cf - --ignore-failed-read summary.txt pp_ttx.mg7 output.log generate_events.log \
              PROC_pp_ttx/Cards PROC_pp_ttx/Events/*/info.json PROC_pp_ttx/Events/*/*.log 2> /dev/null) | tar -xf - -C results || true
          find results -type f | sort
      - name: job summary
        if: always()
        run: |
          {
            echo "### p p > t t~ on ${{ inputs.cluster }} ($BACKEND)"
            if [ -f results/summary.txt ]; then
              echo "| | |"
              echo "|---|---|"
              sed 's/^\([^=]*\)=\(.*\)$/| \1 | \2 |/' results/summary.txt
            else
              echo "No summary.txt: the job stopped early, see the log of the 'p p > t t~ on the GPU' step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-pp_ttx-${{ inputs.cluster }}-${{ inputs.backend }}
          path: results/
          if-no-files-found: warn

  interference:
    # input interference (true on push): squared split orders on the GPU backend of madmatrix,
    # standalone and through umami, and an interference sample with mg7
    needs: build_madspace
    if: inputs.interference
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -l -eo pipefail {0}
    env:
      BACKEND: ${{ inputs.backend }}
      MODULES: ${{ inputs.modules }}
      GPU_ARCH: ${{ inputs.gpu_arch }}
      # no PDF_SET: the mg7 check runs with the PDF set of its reference
      VENV: ${{ needs.build_madspace.outputs.venv }}
      MADSPACE_PREFIX: ${{ needs.build_madspace.outputs.madspace_prefix }}
    steps:
      - uses: actions/checkout@v5
      - name: run directory
        run: echo "WORKDIR=${GLOBALSCRATCH:-$HOME}/mg7-gpu-ci/runs/$RUN_TAG/interference" >> "$GITHUB_ENV"
      - name: interference on the GPU
        run: .github/gpu_ci/interference_gpu.sh
      - name: collect logs
        if: always()
        run: |
          mkdir -p results
          (cd "$WORKDIR" && tar -cf - --ignore-failed-read summary.txt checks.log *.mg5 *.log \
              PROC_uux/Cards PROC_uux/Events/*/info.json 2> /dev/null) | tar -xf - -C results || true
          find results -type f | sort
      - name: job summary
        if: always()
        run: |
          {
            echo "### interference on ${{ inputs.cluster }} ($BACKEND)"
            if [ -f results/summary.txt ]; then
              echo "| | |"
              echo "|---|---|"
              sed 's/^\([^=]*\)=\(.*\)$/| \1 | \2 |/' results/summary.txt
            else
              echo "No summary.txt: the job stopped early, see the log of the 'interference on the GPU' step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-interference-${{ inputs.cluster }}-${{ inputs.backend }}
          path: results/
          if-no-files-found: warn

  pp_jj:
    # p p > j j: cuts on several objects (the jets), which p p > t t~ does not have
    needs: build_madspace
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -l -eo pipefail {0}
    env:
      BACKEND: ${{ inputs.backend }}
      MODULES: ${{ inputs.modules }}
      GPU_ARCH: ${{ inputs.gpu_arch }}
      NEVENTS: ${{ inputs.nevents }}
      PROCESS: p p > j j
      TAG: pp_jj
      PDF_SET: ${{ inputs.pdf_set }}
      VENV: ${{ needs.build_madspace.outputs.venv }}
      MADSPACE_PREFIX: ${{ needs.build_madspace.outputs.madspace_prefix }}
    steps:
      - uses: actions/checkout@v5
      - name: run directory
        run: echo "WORKDIR=${GLOBALSCRATCH:-$HOME}/mg7-gpu-ci/runs/$RUN_TAG/pp_jj" >> "$GITHUB_ENV"
      - name: p p > j j on the GPU
        run: .github/gpu_ci/pp_ttx_mg7.sh
      - name: collect logs and cards
        if: always()
        run: |
          mkdir -p results
          (cd "$WORKDIR" && tar -cf - --ignore-failed-read summary.txt pp_jj.mg7 output.log generate_events.log \
              PROC_pp_jj/Cards PROC_pp_jj/Events/*/info.json PROC_pp_jj/Events/*/*.log 2> /dev/null) | tar -xf - -C results || true
          find results -type f | sort
      - name: job summary
        if: always()
        run: |
          {
            echo "### p p > j j on ${{ inputs.cluster }} ($BACKEND)"
            if [ -f results/summary.txt ]; then
              echo "| | |"
              echo "|---|---|"
              sed 's/^\([^=]*\)=\(.*\)$/| \1 | \2 |/' results/summary.txt
            else
              echo "No summary.txt: the job stopped early, see the log of the 'p p > j j on the GPU' step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-pp_jj-${{ inputs.cluster }}-${{ inputs.backend }}
          path: results/
          if-no-files-found: warn

  madspace_ops:
    # madspace GPU runtime operations against the CPU runtime (histogram, rank-4 kernels)
    needs: build_madspace
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -l -eo pipefail {0}
    env:
      BACKEND: ${{ inputs.backend }}
      MODULES: ${{ inputs.modules }}
      # no VENV: the python3 of the modules (see madspace_ops_gpu.sh)
      MADSPACE_PREFIX: ${{ needs.build_madspace.outputs.madspace_prefix }}
    steps:
      - uses: actions/checkout@v5
      - name: run directory
        run: echo "WORKDIR=${GLOBALSCRATCH:-$HOME}/mg7-gpu-ci/runs/$RUN_TAG/madspace_ops" >> "$GITHUB_ENV"
      - name: madspace operations on the GPU
        run: .github/gpu_ci/madspace_ops_gpu.sh
      - name: collect logs
        if: always()
        run: |
          mkdir -p results
          (cd "$WORKDIR" && tar -cf - --ignore-failed-read summary.txt checks.log 2> /dev/null) | tar -xf - -C results || true
      - name: job summary
        if: always()
        run: |
          {
            echo "### madspace operations on ${{ inputs.cluster }} ($BACKEND)"
            if [ -f results/summary.txt ]; then
              echo "| | |"
              echo "|---|---|"
              sed 's/^\([^=]*\)=\(.*\)$/| \1 | \2 |/' results/summary.txt
            else
              echo "No summary.txt: the job stopped early, see the log of the 'madspace operations on the GPU' step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-madspace_ops-${{ inputs.cluster }}-${{ inputs.backend }}
          path: results/
          if-no-files-found: warn

  stop_runner:
    # must list every job that runs on the self-hosted runner
    needs: [start_runner, build_madspace, pp_ttx, pp_jj, madspace_ops, interference]
    if: always() && needs.start_runner.result == 'success'
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    defaults:
      run:
        shell: bash -l -eo pipefail {0}
    env:
      CLEAN: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !inputs.keep_workdir }}
    steps:
      - name: clean up the run directories
        run: |
          RUNS=${GLOBALSCRATCH:-$HOME}/mg7-gpu-ci/runs
          if [ "$CLEAN" = true ]; then rm -rf -- "${RUNS:?}/$RUN_TAG"; fi
          # directories kept by failed runs are removed after two weeks
          find "$RUNS" -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} + || true
      - name: end the Slurm allocation
        run: touch "$CI_STOP_FILE" # set by runner_batch.sh, which then stops the runner
