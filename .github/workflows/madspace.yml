name: MadSpace

on:
  push:
  pull_request:
  # Called from release.yml once the full test suite has passed. madspace is
  # never released on its own -- its version always matches the MadGraph
  # release, so publishing only happens through that call.
  workflow_call:
    inputs:
      publish:
        description: 'Build the full wheel matrix and publish to PyPI'
        type: boolean
        default: false

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_small: cp312-manylinux_x86_64
            build_full: cp3*-manylinux_x86_64
            CIBW_BEFORE_ALL: >
              yum -y install openblas-devel yum-utils &&
              yum-config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
              yum-config-manager --add-repo /project/.github/workflows/rocm.repo &&
              yum -y install cuda-nvcc-12-8 cuda-cudart-devel-12-8 cuda-thrust-12-8 libcublas-devel-12-8 rocm-hip-runtime-devel rocblas-devel rocthrust-devel hipcub-devel
            CIBW_REPAIR_WHEEL_COMMAND: >
              auditwheel repair
              --exclude libmadspace.so
              --exclude 'libcublas.so.*'
              --exclude 'libcublasLt.so.*'
              --exclude 'libcudart.so.*'
              --exclude 'libamdhip64.so.*'
              --exclude 'libhipblaslt.so.*'
              --exclude 'librocblas.so.*'
              --exclude 'libroctx64.so.*'
              -w {dest_dir} {wheel}
            CIBW_ENVIRONMENT: >
                PATH=$PATH:/usr/local/cuda/bin
                CMAKE_PREFIX_PATH=/opt/rocm
                HIPFLAGS=--gcc-toolchain=$(dirname $(which g++))/../..
                SKBUILD_CMAKE_ARGS="-DENABLE_CUDA=ON;-DENABLE_HIP=ON;-DENABLE_SIMD=ON;-DENABLE_OPENBLAS=OFF"

          - os: macos-14
            build_small: cp312-macosx_arm64
            build_full: cp3*-macosx_arm64
            MACOSX_DEPLOYMENT_TARGET: 14.5
            CIBW_REPAIR_WHEEL_COMMAND: >
              delocate-wheel
              --ignore-missing-dependencies
              --require-archs {delocate_archs} -w {dest_dir} -v {wheel}

    steps:
      - uses: actions/checkout@v5

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: madspace
        env:
            CIBW_BUILD: ${{ (inputs.publish || github.ref == 'refs/heads/main') && matrix.build_full || matrix.build_small }}
            CIBW_BEFORE_ALL: ${{ matrix.CIBW_BEFORE_ALL }}
            CIBW_REPAIR_WHEEL_COMMAND: ${{ matrix.CIBW_REPAIR_WHEEL_COMMAND }}
            CIBW_ENVIRONMENT: ${{ matrix.CIBW_ENVIRONMENT }}
            MACOSX_DEPLOYMENT_TARGET: ${{ matrix.MACOSX_DEPLOYMENT_TARGET }}
            CIBW_TEST_REQUIRES: >
              pytest
              numpy
              scipy
              --extra-index-url https://download.pytorch.org/whl/cpu
              torch
            CIBW_TEST_COMMAND: pytest {project}/madspace/tests

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  publish-to-pypi:
    name: Publish to PyPI
    if: inputs.publish
    needs:
      - build_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/madspace
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v5
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
